# Embedding model registry (built-in default).
#
# Swapping BGE-M3 ↔ another model, or fp32 ↔ fp16, is a CONFIG edit, not a code
# change. Override or extend this by placing a models.yaml at $EMBED_MODELS_CONFIG
# (or data/models/models.yaml): entries merge by `name`, the file's `active` (or the
# $EMBED_MODEL env for a one-off run) picks which model the embedder loads.
#
# Identity: family / revision / tokenizer_revision / dim / normalization / precision
# / windowing / max_tokens are folded into the EmbedIdentity — change any and the
# re-embed + serve-compat gates fire, so an fp16 corpus and an fp32 query (or a
# truncate corpus and a mean_pool corpus) can never share one HNSW.
#
# windowing (truncate|mean_pool) and max_tokens default to truncate / 1024 when
# omitted, so a registry that does not set them yields the SAME identity as one that
# declares the defaults — the Kaggle fp16 and data-image registries stay coherent.
#
# Runtime tuning stays in env, NOT here (it doesn't change the vectors' identity):
#   ORT_EP=cpu|cuda · EMBED_PIPELINE · EMBED_GRAPH_OPT · BGE_BATCH · EMBED_BUCKET_WINDOW
active: bge-m3

models:
  - name: bge-m3            # the pinned fp32 BGE-M3 dense export (default)
    family: bge-m3
    dir: data/models/bge-m3
    precision: fp32
    dim: 1024
    normalization: l2
    windowing: mean_pool     # <- #208: embed the whole clause, not its first 1024
    max_tokens: 2048         #    tokens, at the chunk size TeleEmbedBench measures as
                             #    optimal for 3GPP. Bumps EmbedIdentity, so it re-embeds.
    revision: 5617a9f
    tokenizer_revision: 5617a9f
    inputs: [input_ids, attention_mask]
    output: sentence_embedding

  - name: bge-m3-fp16       # half-precision variant (T4 Tensor Cores). Provide a
    family: bge-m3          # validated fp16 export at `dir` (WITH_FP16=1 make model),
    dir: data/models/bge-m3-fp16  # then: EMBED_MODEL=bge-m3-fp16. Gated by the
    precision: fp16         # cos(fp32,fp16)>=0.9995 acceptance test before any bulk run.
    dim: 1024
    normalization: l2
    revision: 5617a9f
    tokenizer_revision: 5617a9f
    tokenizer_dir: data/models/bge-m3   # fp16 export often ships the model only
    inputs: [input_ids, attention_mask]
    output: sentence_embedding

  # THE MODEL AN IMAGE SHOULD BAKE. Dual-head: the same dense sentence_embedding
  # as bge-m3 above, PLUS the learned-lexical sparse_weights head — so one 2.2 GB
  # model serves BOTH arms. It has to be one model: SparseCapable() reads the
  # ACTIVE registry entry, so a build whose active model is dense-only drops the
  # sparse arm no matter what else is on disk, and the corpus's sparse postings
  # become bytes nothing can query.
  #
  # windowing/max_tokens are declared to match bge-m3, and that is a CLAIM about
  # interchangeability, so it was measured rather than assumed. Re-embedding 20
  # clauses of TS 23.501 whose vectors are already in the corpus:
  #
  #   bge-m3        vs stored   cos min 0.999995  avg 0.999999   (harness control)
  #   bge-m3-sparse vs stored   cos min 0.999995  avg 0.999999
  #   bge-m3        vs bge-m3-sparse            cos min 1.000000
  #
  # The two dense heads are the same tensor; 0.999995 is the float32 round-trip
  # through DuckDB, not a difference between the models. The tokenizers are
  # byte-identical (sha256 21106b6d…), so tokenizer_dir defaults to `dir`.
  # Both therefore stamp EmbedIdentity 38067f8c6efe, which is what the corpus
  # carries.
  #
  # Of the two lines, only `windowing` actually carries the identity here:
  # DefaultMaxTokens is 2048, so declaring max_tokens is documentation while
  # omitting windowing silently means "truncate" and yields fd18ca72f577 — which
  # is the value this entry stamped before, and what the serve guard would have
  # compared against the corpus before disabling VSS. Both are declared anyway,
  # because an entry that relies on a default matching by luck is how this drifts.
  - name: bge-m3-sparse
    family: bge-m3
    dir: data/models/bge-m3-sparse
    precision: fp32
    dim: 1024
    normalization: l2
    windowing: mean_pool
    max_tokens: 2048
    revision: 5617a9f
    tokenizer_revision: 5617a9f
    inputs: [input_ids, attention_mask]
    output: sentence_embedding
    sparse_output: sparse_weights   # <- the head that makes SparseModelID non-empty
