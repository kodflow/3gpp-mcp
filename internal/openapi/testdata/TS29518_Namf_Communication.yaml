openapi: 3.0.0
info:
  title: Namf_Communication
  version: 1.3.4
externalDocs:
  description: 3GPP TS 29.518 V18.13.0; 5G System; Access and Mobility Management Services
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.518/
servers:
  - url: '{apiRoot}/namf-comm/v1'
paths:
  /ue-contexts/{ueContextId}:
    put:
      summary: Namf_Communication CreateUEContext service Operation
      operationId: CreateUEContext
      tags:
        - Individual ueContext (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeContextCreateData'
      responses:
        '201':
          description: Created
        '400':
          $ref: 'TS29571_CommonData.yaml#/components/responses/400'
        '403':
          description: Forbidden
    get:
      summary: Namf_Communication EBIAssignment
      operationId: EBIAssignment
      responses:
        '200':
          description: OK
components:
  schemas:
    UeContextCreateData:
      type: object
      properties:
        ueContext:
          $ref: '#/components/schemas/UeContext'
        targetId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/NgRanTargetId'
    UeContext:
      type: object
      properties:
        supi:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Supi'
        mmContextList:
          type: array
    AccessType:
      anyOf:
        - type: string
          enum:
            - 3GPP_ACCESS
            - NON_3GPP_ACCESS
        - type: string
