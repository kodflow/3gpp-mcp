# 3gpp-mcp runtime profile for the labs serve box: 8 vCPU, 32 GB RAM, NO GPU.
# This is a docker env-file (KEY=VALUE). Named .conf (not .env) on purpose.
# Usage: docker run --env-file deploy/labs-8c32g-env.conf … ghcr.io/<owner>/3gpp-mcp:latest
#   (or `env_file: [deploy/labs-8c32g-env.conf]` in docker-compose).
# Rationale + diagnosis steps: docs/guides/serving-cpu-and-deploy.md.
#
# Tuned for THIS box; the shared image ships no box-specific defaults so it stays
# correct on any host. Quality is the priority — hence always-on rerank.

# HTTP serve mode + dashboard.
MCP_TRANSPORT=http
MCP_PORT=8765

# BGE-M3 query embedding on CPU — the per-query latency floor.
# 6 of 8 cores for the forward pass; 2 left for DuckDB + the Go runtime.
ORT_INTRA_OP_THREADS=6
ORT_INTER_OP_THREADS=1

# Cross-encoder rerank on EVERY query (top precision lever). Window 10 keeps the
# added CPU cost bounded; raise toward 20 if the latency budget allows.
RERANK_ALL=1
RERANK_WINDOW=10

# Query-embed LRU (~8 MiB): repeated / probe / popular queries skip the forward
# pass. Zero quality loss.
EMBED_QUERY_CACHE=2048

# EMBEDDER / RERANKER left UNSET on purpose: the full image is an ONNX build with
# the models baked, so unset = use them. Set EMBEDDER=off to force lexical-only.
