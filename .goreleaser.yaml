# GoReleaser — LINUX targets, built on an ubuntu runner with the NATIVE GNU
# toolchain (DuckDB's prebuilt libs are linked against GNU libstdc++, so only a
# GNU compiler links them — zig/libc++ fails with an ABI mismatch). amd64 is
# native gcc; arm64 uses the GNU cross compiler aarch64-linux-gnu-g++ (same
# libstdc++ ABI). Darwin/Windows have their own configs + native runners.
# Default (lexical) build — ONNX stays behind `-tags onnx`.
#
# Validate locally:  goreleaser build --snapshot --clean
version: 2

project_name: mcp-3gpp

snapshot:
  version_template: "latest"

builds:
  - id: mcp-3gpp-linux
    main: ./cmd/server
    binary: mcp-3gpp
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]
    overrides:
      - goos: linux
        goarch: arm64 # GNU cross-toolchain — ABI-matches the prebuilt arm64 lib
        env: [CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]
  # RERANKER variant. It is NOT semantic search, despite the asset name.
  #
  # This comment used to read "Semantic-capable variant: -tags onnx compiles the
  # BGE-M3/reranker backend". That was true until the write-side->Rust cutover
  # (Phase 11b) REMOVED the Go ONNX embed backend. internal/embed/embed_noop.go
  # has been explicit ever since: any build without `embed_ffi` returns
  # Disabled{}, and "`-tags onnx` alone now means reranker, no embed".
  #
  # So this binary carries the cross-encoder reranker and NO query embedder. A
  # mode=semantic or mode=hybrid request degrades to lexical and the corpus's
  # 821 146 vectors are unreachable from it. search_spec now reports that in
  # `mode` / `mode_degraded`, and server_info gives the reason.
  #
  # Real semantic search needs `-tags onnx,embed_ffi` plus the rust/embed-core
  # cdylib built with --features ort and loadable at run time. That is what the
  # `full` image builds (corpus-image.yml: build_tags: onnx,embed_ffi) and what a
  # local build produces. Doing it here means cross-building that cdylib for
  # every target and shipping it in the archive: not done — and, now, not
  # pretended either.
  #
  # onnxruntime_go dlopens libonnxruntime at runtime (no extra link deps), so the
  # DuckDB GNU toolchain is unchanged; `bootstrap --semantic` fetches ORT + model.
  - id: mcp-3gpp-linux-onnx
    main: ./cmd/server
    binary: mcp-3gpp
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
      - -tags=onnx
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]
    overrides:
      - goos: linux
        goarch: arm64
        env: [CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]

archives:
  - id: default
    ids: [mcp-3gpp-linux]
    name_template: "mcp-3gpp_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
  - id: onnx
    ids: [mcp-3gpp-linux-onnx]
    name_template: "mcp-3gpp-onnx_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums-linux.txt"

release:
  disable: true # published to the rolling 'latest' release by the workflow
