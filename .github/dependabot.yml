version: 2
updates:
  # Go module dependencies (DuckDB, mcp-go, ONNX, …).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      # onnxruntime_go's requested C API is coupled to the pinned ONNX Runtime
      # release (DefaultORTVersion in internal/bootstrap/models.go + ortSHA256).
      # An auto-bump breaks the embedder at runtime ("requested API version [N]
      # is not available"). Bump them together by hand.
      - dependency-name: "github.com/yalue/onnxruntime_go"
  # GitHub Actions used by ci.yml / release.yml / the image workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
