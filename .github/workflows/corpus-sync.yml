# =============================================================================
#  Corpus · Sync (single-runner, bounded)   — artifact-only smoke of the chain
# =============================================================================
#
#  WHEN it runs   MANUAL ONLY (workflow_dispatch).
#
#  WHAT it does   The same chain as "Corpus · Build" but in ONE job (no matrix,
#                 no per-series parallelism, no embed): download → convert →
#                 lexical ingest → package. Scope-bounded (a 14 GB runner can't
#                 hold the full ~20 GB corpus), so it's for a SMALL series subset
#                 or a quick end-to-end smoke of the chain.
#
#  WHAT it PUBLISHES   NOTHING. ARTIFACT-ONLY (retention 7d). The ability to
#                 clobber the canonical DB on the `latest` release was REMOVED
#                 (2026-06 CI cleanup): a secondary, bounded workflow that can
#                 overwrite the served DB is a footgun. The ONLY publisher of the
#                 lexical channel is "Corpus · Build" (corpus-matrix.yml).
#
#  WHEN to use which:
#                 • Corpus · Build  → the real pipeline (parallel, delta-aware,
#                                     embed-capable, auto-resumed, PUBLISHES). Use this.
#                 • Corpus · Sync   → a quick bounded smoke; produces an artifact only.

name: Corpus · Sync (bounded, single-runner)

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Space-separated 3GPP series (e.g. '23 24 29 33 38')."
        type: string
        default: "23 24 29 33 38"
      release_floor:
        description: "Lowest release to ingest (default Rel-99 = all real 3GPP releases (Rel-99..latest); not frozen)."
        type: string
        default: "Rel-99"

permissions:
  contents: read # artifact-only — never writes a release

concurrency:
  group: corpus-sync
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      # Rust toolchain + cargo cache: the Rust ingest restores libduckdb-sys & deps
      # instead of recompiling each sync (only a Cargo.lock change rebuilds).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target

      - name: Install deps (build + LibreOffice + zstd)
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zstd libreoffice-writer-nogui

      # Advisory drift guard — see scripts/lib/soffice-guard.sh for the rationale.
      - name: Guard — LibreOffice version drift (advisory)
        run: scripts/lib/soffice-guard.sh

      - name: Resolve scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fast, bounded validation: vocabulary series only, newest releases.
            echo "series=21"        >> "$GITHUB_OUTPUT"
            echo "floor=Rel-19"     >> "$GITHUB_OUTPUT"
          else
            echo "series=${{ github.event.inputs.series }}"            >> "$GITHUB_OUTPUT"
            echo "floor=${{ github.event.inputs.release_floor }}"      >> "$GITHUB_OUTPUT"
          fi

      - name: Build ingest (Rust)
        run: |
          command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.cargo/bin:$PATH" cargo build --release --manifest-path rust/ingest/Cargo.toml --bin ingest
          cp rust/target/release/ingest bin/ingest

      - name: Download + convert 3GPP specs (3gpp.org → HTML)
        run: |
          ./scripts/corpus.sh --set "${{ steps.scope.outputs.floor }}" \
            --series "${{ steps.scope.outputs.series }}" --jobs 2
          echo "converted HTML files:"
          find data/sources/convert -name '*.html' | wc -l

      - name: Consolidate → DuckDB
        run: |
          series_csv=$(echo "${{ steps.scope.outputs.series }}" | tr ' ' ',')
          ./bin/ingest --series "$series_csv" --convert data/sources/convert --db data/3gpp.duckdb
          echo "=== built DB ===" && ls -lh data/3gpp.duckdb

      - name: Package
        run: |
          zstd -19 -T0 --long=27 -f data/3gpp.duckdb -o data/3gpp.duckdb.zst
          sha256sum data/3gpp.duckdb | awk '{print $1"  3gpp.duckdb"}' > data/3gpp.duckdb.sha256
          ls -lh data/3gpp.duckdb.zst

      # ARTIFACT-ONLY (unconditional): this workflow never writes a release.
      - name: Upload DB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-duckdb
          path: |
            data/3gpp.duckdb.zst
            data/3gpp.duckdb.sha256
          retention-days: 7
