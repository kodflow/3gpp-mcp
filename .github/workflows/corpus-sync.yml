# Corpus sync — refreshes the indexed 3GPP DB and publishes it to the single
# rolling "latest" release (plan Part C4). NOT YET IMPLEMENTED — stub.
#
# Model (decided): the DB *is* the state. No version history, no dated releases.
# Each run:
#   1. pull the current 3gpp.duckdb.zst from the `latest` release,
#   2. diff the live 3gpp.org listing against what the DB already contains,
#   3. download ONLY the missing specs, convert (LibreOffice), ingest-append,
#   4. re-publish: `gh release upload latest 3gpp.duckdb.zst --clobber`
#      (replaces the single asset; old one gone — no disk-space accumulation).
#
# Incremental by construction (delta only) so it fits a hosted runner's 14 GB
# disk — full rebuild of the ~20 GB corpus never runs in CI. Kept deliberately
# simple: no elaborate delta machinery beyond "download missing + append".
# Blocked on an `ingest --append` path in cmd/ingest (next coding phase).

name: Corpus Sync

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 4 * * 1"  # weekly, off-peak, non-round minute

permissions:
  contents: write # to clobber the DB asset on the 'latest' release

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::corpus-sync stub — needs cmd/ingest --append + 'latest' DB publish (plan C4)."
