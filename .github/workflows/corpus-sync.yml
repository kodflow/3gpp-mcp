# =============================================================================
#  Corpus · Sync (single-runner, bounded)   — SIMPLE alternative to Corpus·Build
# =============================================================================
#
#  WHEN it runs   MANUAL ONLY (workflow_dispatch).
#
#  WHAT it does   The same chain as "Corpus · Build" but in ONE job (no matrix,
#                 no per-series parallelism, no embed): download → convert →
#                 lexical ingest → publish. Scope-bounded (a 14 GB runner can't
#                 hold the full ~20 GB corpus), so it's for a SMALL series subset
#                 or a quick end-to-end smoke of the chain.
#
#  WHEN to use which:
#                 • Corpus · Build  → the real pipeline (parallel, delta-aware,
#                                     embed-capable, auto-resumed). Use this.
#                 • Corpus · Sync   → a quick bounded one-shot when you don't need
#                                     the matrix machinery.
#
#  WHAT it PUBLISHES   publish_to_latest=false (default) → artifact only, so a
#                 small/test run never shrinks the canonical DB on `latest`.

name: Corpus · Sync (bounded, single-runner)

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Space-separated 3GPP series (e.g. '23 24 29 33 38')."
        type: string
        default: "23 24 29 33 38"
      release_floor:
        description: "Lowest release to ingest (default Rel-99 = all real 3GPP releases (Rel-99..latest); not frozen; not frozen)."
        type: string
        default: "Rel-99"
      publish_to_latest:
        description: "Clobber the DB on the 'latest' release (else: artifact only)."
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 4 * * 1"  # weekly, off-peak, non-round minute

permissions:
  contents: write # to clobber the DB asset on the 'latest' release

concurrency:
  group: corpus-sync
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install deps (build + LibreOffice + zstd)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zstd libreoffice-writer-nogui

      - name: Resolve scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fast, bounded validation: vocabulary series only, newest releases.
            echo "series=21"        >> "$GITHUB_OUTPUT"
            echo "floor=Rel-19"     >> "$GITHUB_OUTPUT"
            echo "publish=false"    >> "$GITHUB_OUTPUT"
          else
            echo "series=${{ github.event.inputs.series }}"            >> "$GITHUB_OUTPUT"
            echo "floor=${{ github.event.inputs.release_floor }}"      >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.publish_to_latest }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ingest
        run: go build -trimpath -o bin/ingest ./cmd/ingest

      - name: Download + convert 3GPP specs (3gpp.org → HTML)
        run: |
          ./scripts/corpus.sh --set "${{ steps.scope.outputs.floor }}" \
            --series "${{ steps.scope.outputs.series }}" --jobs 2
          echo "converted HTML files:"
          find data/sources/convert -name '*.html' | wc -l

      - name: Consolidate → DuckDB
        run: |
          series_csv=$(echo "${{ steps.scope.outputs.series }}" | tr ' ' ',')
          ./bin/ingest --series "$series_csv" --out data/3gpp.duckdb
          echo "=== built DB ===" && ls -lh data/3gpp.duckdb

      - name: Package
        run: |
          zstd -19 -T0 --long=27 -f data/3gpp.duckdb -o data/3gpp.duckdb.zst
          sha256sum data/3gpp.duckdb | awk '{print $1"  3gpp.duckdb"}' > data/3gpp.duckdb.sha256
          ls -lh data/3gpp.duckdb.zst

      # Test/bounded run → artifact only (never shrink the canonical 'latest' DB).
      - name: Upload DB artifact
        if: steps.scope.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-duckdb
          path: |
            data/3gpp.duckdb.zst
            data/3gpp.duckdb.sha256
          retention-days: 7

      # Real run → clobber the single DB asset on 'latest'.
      - name: Publish DB to 'latest' (clobber)
        if: steps.scope.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --latest --title "latest" \
              --notes "Rolling release — mcp-3gpp binaries + indexed 3GPP DB."
          gh release upload latest data/3gpp.duckdb.zst data/3gpp.duckdb.sha256 --clobber
