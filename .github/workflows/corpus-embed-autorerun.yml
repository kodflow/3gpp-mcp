# =============================================================================
#  Corpus · Embed Auto-rerun   (re-dispatches the fp16/T4 campaign until converged)
# =============================================================================
#
#  WHY this exists, and why it is SEPARATE from corpus-matrix-autorerun.yml:
#  the embed matrix swallows BOTH a time-box AND a fatal series failure into a
#  GREEN job (`timeout … || echo` in corpus-embed-kaggle.yml), so the embed run
#  always concludes `success` and `gh run rerun --failed` has nothing to rerun.
#  Convergence of all N series to null_at_floor=0 therefore needs a FRESH
#  workflow_dispatch each pass, not a job rerun. This workflow issues that
#  dispatch automatically until the corpus is complete.
#
#  WHEN it runs   AUTOMATICALLY, on every completion of "Corpus · Embed (Kaggle
#                 GPU)" that was itself a dispatch/schedule (never a rerun of this
#                 one off some other event). You never start it by hand.
#
#  HOW it decides
#    - reads the source run's `campaign-inputs` stamp (a workflow_run event CANNOT
#      see github.event.inputs, so the embed `plan` job stamps them as an artifact);
#    - counts DISTINCT series that logged "series <N>: COMPLETE (null_at_floor=0)".
#      max-parallel=2 cycles EVERY series each dispatch, so the latest run's log is
#      an authoritative completeness snapshot (a done series re-confirms fast on
#      resume) — there is no GPU-starvation blind spot;
#    - STOPS when complete >= total (corpus converged);
#    - else re-dispatches the SAME inputs (resume-lossless — each pass advances the
#      still-incomplete series), bounded by MAX_DISPATCHES dispatches per 36h so a
#      detection bug can never spin an unbounded paid-GPU + publish loop.
#
#  SAFETY. Two independent stop conditions (all-complete OR the 36h dispatch cap).
#  A workflow_run trigger only fires from the DEFAULT branch's copy of this file,
#  so this loop cannot start until this workflow is merged to main — review it
#  before merging.
# =============================================================================
name: Corpus · Embed Auto-rerun (until converged)

on:
  workflow_run:
    workflows: ["Corpus · Embed (Kaggle GPU)"]
    types: [completed]

# Serialize so two completion events can't race to dispatch overlapping passes.
concurrency:
  group: corpus-embed-autorerun
  cancel-in-progress: false

permissions:
  # actions:write is REQUIRED for `gh workflow run` (re-dispatch) and lets
  # `gh run view --log` / `gh run download` read the source run. contents:read
  # keeps everything else at minimum scope.
  actions: write
  contents: read

jobs:
  redispatch:
    # Chain only from a genuine campaign dispatch (or its scheduled equivalent),
    # never from an unrelated event.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      # Hard safety cap: max auto re-dispatches counted over a rolling 36h window.
      # Set comfortably above the few passes a real corpus needs (a big series
      # completes in ~1 pass; the long pole is a handful) but low enough that a
      # detection bug self-limits instead of burning quota indefinitely.
      MAX_DISPATCHES: "8"
    steps:
      - name: Decide whether to re-dispatch, and do it
        run: |
          set -euo pipefail

          # 1) Read the stamped dispatch inputs (workflow_run can't see inputs).
          if ! gh run download "$SOURCE_RUN_ID" --repo "$REPO" -n campaign-inputs -D _in 2>/dev/null \
             || [ ! -f _in/campaign-inputs.json ]; then
            echo "::notice::source run has no campaign-inputs stamp (pre-stamp run, or not this campaign) — skipping"
            exit 0
          fi
          INPUTS="$(cat _in/campaign-inputs.json)"
          get() { printf '%s' "$INPUTS" | python3 -c "import json,sys;print(json.load(sys.stdin).get('$1',''))"; }
          PRECISION="$(get PRECISION)"; FLOOR="$(get EMBED_FLOOR)"; ACCEL="$(get ACCELERATOR)"
          PUBLISH="$(get PUBLISH)"; SERIES_LIST="$(get SERIES_LIST)"; MAXR="$(get MAX_RETRIES)"
          RMIN="$(get RUNNER_MINUTES)"; TOTAL="$(get TOTAL)"
          if ! printf '%s' "$TOTAL" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::stamp missing/invalid TOTAL ('$TOTAL')"; exit 1
          fi
          echo "campaign: precision=$PRECISION floor=$FLOOR total_series=$TOTAL publish=$PUBLISH branch=$HEAD_BRANCH"

          # 2) Count DISTINCT series that reported COMPLETE in the source run's log.
          gh run view "$SOURCE_RUN_ID" --repo "$REPO" --log > _log.txt 2>/dev/null || true
          COMPLETE="$(grep -oE 'series [0-9]+: COMPLETE \(null_at_floor=0\)' _log.txt \
                      | grep -oE 'series [0-9]+' | sort -u | wc -l | tr -d ' ')"
          echo "complete: ${COMPLETE:-0} / $TOTAL series at null_at_floor=0"
          if [ "${COMPLETE:-0}" -ge "$TOTAL" ]; then
            echo "::notice::corpus CONVERGED — all $TOTAL series null_at_floor=0. No re-dispatch."
            exit 0
          fi

          # 3) Safety cap: recent corpus-embed-kaggle dispatches in the last 36h.
          SINCE="$(python3 -c 'import datetime;print((datetime.datetime.utcnow()-datetime.timedelta(hours=36)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          RECENT="$(gh run list --workflow=corpus-embed-kaggle.yml --repo "$REPO" \
                     --created ">$SINCE" --json databaseId -q 'length' 2>/dev/null || echo 0)"
          echo "recent dispatches (36h): ${RECENT:-0} / cap $MAX_DISPATCHES"
          if [ "${RECENT:-0}" -ge "$MAX_DISPATCHES" ]; then
            echo "::warning::MAX_DISPATCHES=$MAX_DISPATCHES hit in 36h with only $COMPLETE/$TOTAL complete — stopping the loop. Investigate, then re-dispatch manually or raise the cap."
            exit 0
          fi

          # 4) Re-dispatch the SAME campaign (resume-lossless; advances incomplete series).
          gh workflow run corpus-embed-kaggle.yml --repo "$REPO" --ref "$HEAD_BRANCH" \
            -f series_list="$SERIES_LIST" \
            -f embed_floor="$FLOOR" \
            -f precision="$PRECISION" \
            -f accelerator="$ACCEL" \
            -f max_retries="$MAXR" \
            -f runner_minutes="$RMIN" \
            -f publish="$PUBLISH"
          echo "::notice::re-dispatched corpus-embed-kaggle ($COMPLETE/$TOTAL complete) — next convergence pass"
