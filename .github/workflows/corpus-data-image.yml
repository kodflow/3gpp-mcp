name: Corpus Data Image

# =============================================================================
# Bake the fused corpus (lexical DB + fp16 vectors + BGE-M3 fp16) into the
# data base image ghcr.io/<owner>/3gpp-data — the build-time base the 3gpp-mcp
# full image inherits its ~14 GB data layer from via `FROM` (plan
# split-data-image, follow-up of #125). Splitting data from code means a
# code-only mcp rebuild pushes/pulls ~150 MB instead of ~15 GB.
#
# ONE bake (amd64 runner) — the fused DB content is arch-neutral. The data image
# is then published as a MULTI-PLATFORM manifest. Because the base is debian
# (FROM-inheritance needs a glibc userland), each platform carries its OWN data
# layer (amd64 + arm64): that doubles THIS image's registry footprint vs the old
# scratch single-blob, but it is what lets full INHERIT the data layer by digest
# per arch (the COPY --link approach re-materialised the layer — the gate caught
# it). Dockerfile.data is RUN-free, so the multi-platform build needs no QEMU.
# A verify step asserts both platforms exist and each carries its big data layer.
#
# VISIBILITY: the push uses GHCR_PAT (never the CI token) and the Dockerfile
# carries no org.opencontainers.image.source label, so the package is UNLINKED
# from this public repo and is BORN PRIVATE (same posture as 3gpp-corpus /
# 3gpp-mcp / 3gpp-vec). The assert step below VERIFIES it after every push and
# fails loud if the package is ever public (it embeds verbatim 3GPP text).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      corpus_tag:
        description: "3gpp-corpus tag to bake from"
        type: string
        default: "latest"
      push:
        description: "Push the data image to GHCR"
        type: boolean
        default: true
      force:
        description: "Bake even if the source corpus is unchanged"
        type: boolean
        default: true
  # AUTO-UPDATE: a daily GUARDED tick. The bake produces non-reproducible bytes,
  # so an unconditional schedule would re-push ~14 GB/day (and force the labs to
  # re-pull) for ZERO real change. The `guard` job below skips the bake unless
  # 3gpp-corpus:latest actually moved since the current 3gpp-data was built —
  # so the labs only ever re-pulls the data layer when the corpus truly changed.
  schedule:
    - cron: "37 3 * * *" # ~04:37 Europe/Paris, after the corpus/embed converge

permissions:
  contents: read

concurrency:
  group: corpus-data-image
  cancel-in-progress: false # never kill an in-flight ~1h bake; queue instead

jobs:
  # CHANGE GUARD — compare 3gpp-corpus:latest's digest against the source-corpus
  # digest stamped into the current 3gpp-data image. Skip the whole bake when
  # they match (scheduled no-op days). A manual dispatch defaults force=true, so
  # `/workflow run` always bakes; the schedule passes no force ⇒ digest decides.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.g.outputs.changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Decide whether the source corpus changed
        id: g
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          OWN="${{ github.repository_owner }}"
          TAG="${{ github.event.inputs.corpus_tag || 'latest' }}"
          force="${{ github.event.inputs.force }}"
          SRC="$(retry crane digest "ghcr.io/$OWN/3gpp-corpus:$TAG")"
          # The labels baked into the live data image (empty when they predate this
          # guard, which forces a one-time rebake to stamp them).
          CFG="$(crane config "ghcr.io/$OWN/3gpp-data:latest" 2>/dev/null || true)"
          CUR="$(printf '%s' "$CFG" | jq -r '.config.Labels["io.kodflow.3gpp.source.corpus"] // empty' 2>/dev/null || true)"
          BAKED_RECIPE="$(printf '%s' "$CFG" | jq -r '.config.Labels["io.kodflow.3gpp.bake.recipe"] // empty' 2>/dev/null || true)"
          # The CURRENT bake recipe (how the DB is built: fusion + FTS + frozen HNSW).
          RECIPE="$(scripts/bake-recipe-hash.sh)"
          echo "source corpus=$SRC  baked-from=$CUR  force=$force"
          echo "bake recipe=$RECIPE  baked-recipe=$BAKED_RECIPE"
          # Rebake when the corpus moved, the recipe changed (e.g. freeze-hnsw added),
          # a label is missing, or forced. The recipe trigger is the structural fix
          # for the stale-data-layer incident: changing HOW we bake now re-bakes even
          # when the corpus content is identical ([[project_served_stale_data_layer]]).
          if [ "$force" = "true" ] || [ -z "$CUR" ] || [ "$SRC" != "$CUR" ] || [ -z "$BAKED_RECIPE" ] || [ "$RECIPE" != "$BAKED_RECIPE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::baking — corpus ($CUR → $SRC) or recipe ($BAKED_RECIPE → $RECIPE) changed, or forced"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::corpus AND recipe unchanged ($SRC / $RECIPE) — skipping bake (no 14 GB re-push)"
          fi
  # Materialise the BGE-M3 model ONCE and hand it to the bake as a run artifact
  # (same prefetch as corpus-image.yml: models-release cache first, one pinned
  # HF fetch at most — HuggingFace 429-rate-limited the runners repeatedly).
  model:
    needs: guard
    if: ${{ needs.guard.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # Best-effort by design: the bake falls back to restore-bge.sh on a missing
    # artifact, so the prefetch can never gate the pipeline.
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Materialise BGE-M3 (models release → HF once)
        run: scripts/restore-bge.sh bge-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bge-m3-model
          path: bge-cache/bge-m3
          retention-days: 1
          if-no-files-found: warn

  bake:
    needs: [guard, model]
    if: ${{ needs.guard.outputs.changed == 'true' }}
    runs-on: ubuntu-latest # ONE bake: the data content is arch-neutral
    timeout-minutes: 300 # fusion + HNSW freeze (swap-backed, slower) + multi-arch build
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the data image
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # The bake stages ~27 GB in the workspace, and buildx (container driver)
      # then needs roughly 2x that AGAIN in Docker storage (build-context copy +
      # image snapshot) — the runner agent died of ENOSPC before this relocation
      # existed. Move Docker's data-root to the big ephemeral /mnt disk so
      # Docker/buildkit storage stops competing with the workspace. Guarded
      # no-op when /mnt is absent or small.
      - name: Relocate Docker data-root to /mnt (big ephemeral disk)
        run: |
          set -euo pipefail
          free_mnt=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          if [ "${free_mnt:-0}" -lt 40 ]; then
            echo "/mnt absent or <40GB free (${free_mnt:-0}GB) — keeping the default data-root"
            df -h | head -5
            exit 0
          fi
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker /etc/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '. + {"data-root":"/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          else
            echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          sudo systemctl start docker
          docker info --format 'docker data-root: {{.DockerRootDir}}'
          df -h / /mnt | tail -2

      # The model prefetched ONCE by the `model` job (arch-independent weights).
      # Missing artifact is tolerated — the bake falls back to restore-bge.sh.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: bge-m3-model
          path: bge-cache/bge-m3

      # Verbatim move of corpus-image.yml's proven full bake (issue #125 chain:
      # identity overlay #128, sympy #130, DUCK guard #131/#135, models-release
      # restore #132/#133, embedding_model stamp #133, compaction on the
      # emptiest disk #136/#137).
      - name: Bake fused raw DB (identity overlay) + fp16 BGE-M3
        id: bake
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.corpus_tag || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true; sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "disk after free:"; df -h / | tail -1
          rm -rf image-data && mkdir -p image-data
          # 1) DB = the CURRENT lexical corpus from the PRIVATE GHCR image.
          retry bash -c 'echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          retry docker pull "$img"
          # Record the EXACT corpus digest this image is baked from — stamped as
          # a label so the guard job can skip future no-op bakes (auto-update).
          SRC_CORPUS="$(docker inspect "$img" --format '{{index .RepoDigests 0}}' 2>/dev/null | cut -d@ -f2 || true)"
          echo "baked-from corpus digest: ${SRC_CORPUS:-unknown}"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          docker rmi "$img" >/dev/null 2>&1 || true   # DISK: the pulled copy is consumed
          test -s image-data/3gpp.duckdb
          # 1b) SPLIT ETSI corpus — placed BESIDE 3gpp.duckdb (NEVER merged). The serve
          #     entrypoint adds `-etsi-db $cache/etsi.duckdb` when this file is present,
          #     so get_spec/list_specs cover the ETSI LI suite. Guarded + best-effort:
          #     a missing etsi-corpus image just ships 3GPP only (no bake failure).
          if [ "${FOLD_ETSI:-true}" != "false" ]; then
            eimg="ghcr.io/${{ github.repository_owner }}/etsi-corpus:latest"
            if retry docker pull "$eimg" >/dev/null 2>&1; then
              ecid=$(docker create "$eimg" /noop)
              if docker cp "$ecid:/etsi.duckdb" image-data/etsi.duckdb 2>/dev/null && [ -s image-data/etsi.duckdb ]; then
                echo "ETSI corpus baked beside 3GPP (split): $(du -h image-data/etsi.duckdb | cut -f1)"
              else
                echo "::warning::etsi-corpus present but /etsi.duckdb missing — 3GPP only"
              fi
              docker rm "$ecid" >/dev/null 2>&1 || true
              docker rmi "$eimg" >/dev/null 2>&1 || true
            else
              echo "::notice::etsi-corpus:latest not pullable — serving 3GPP only this bake"
            fi
          fi
          # 2a) BGE-M3 WITHOUT touching HuggingFace: run artifact, else restore-bge.sh.
          if [ -s bge-cache/bge-m3/model.onnx_data ]; then
            mkdir -p image-data/models
            cp -a bge-cache/bge-m3 image-data/models/
            echo "BGE-M3 from the run artifact (prefetched once by the model job)"
          else
            echo "::warning::bge-m3-model artifact absent — restoring directly"
            scripts/restore-bge.sh image-data/models
          fi
          # 2b) ONNX Runtime + (BGE-M3 only if 2a fell through) via the provisioner —
          #    ORT is needed by the fp16 conversion toolchain context only at bake; it
          #    is NOT shipped in this data image (arch-specific → mcp layer).
          CGO_ENABLED=1 go build -tags onnx -o /tmp/mcp ./cmd/server
          # Bake BOTH models: BGE-M3 (embedder) AND the BGE-reranker-v2-m3 cross-encoder
          # (drop --no-reranker) so serve can turn the reranker on. ORT here is only for
          # the fp16 conversion toolchain; it is NOT shipped in this data image.
          RETRY_MAX=4 RETRY_BASE=15 RETRY_LABEL="bootstrap models/ORT" \
            retry /tmp/mcp bootstrap --cache "$PWD/image-data" --semantic --skip-db
          # 3) fp16 conversion (keep_io_types) — kernel-identical recipe.
          python3 -m pip install --quiet onnx onnxruntime sympy packaging
          mkdir -p image-data/models/bge-m3-fp16
          cat > /tmp/convfp16.py <<'PY'
          import onnx
          from onnxruntime.transformers.onnx_model import OnnxModel
          m = onnx.load("image-data/models/bge-m3/model.onnx")
          om = OnnxModel(m)
          om.convert_float_to_float16(keep_io_types=True)
          onnx.save(om.model, "image-data/models/bge-m3-fp16/model.onnx",
                    save_as_external_data=True, all_tensors_to_one_file=True,
                    location="model.onnx_data")
          print("fp16_saved")
          PY
          python3 /tmp/convfp16.py
          cp image-data/models/bge-m3/tokenizer.json image-data/models/bge-m3-fp16/
          rm -rf image-data/models/bge-m3
          cat > image-data/models/models.yaml <<'YAML'
          active: bge-m3-fp16
          models:
            - name: bge-m3-fp16
              family: bge-m3
              dir: /data/mcp-3gpp/models/bge-m3-fp16
              precision: fp16
              dim: 1024
              normalization: l2
              revision: 5617a9f
              tokenizer_revision: 5617a9f
              tokenizer_dir: /data/mcp-3gpp/models/bge-m3-fp16
              inputs: [input_ids, attention_mask]
              output: sentence_embedding
          YAML
          # 4) gate on the baked DB BEFORE fusing vectors into it.
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          # 5) FUSE the published vectors INTO the DB, one sub-base at a time.
          case "$(uname -m)" in
            x86_64)  oras_arch=amd64 ;;
            aarch64) oras_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m) for oras"; exit 1 ;;
          esac
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_${oras_arch}.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          retry bash -c 'echo "$GHCR_PAT" | oras login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          PATH="$HOME/.cargo/bin:$PATH" cargo build --release --manifest-path rust/store/Cargo.toml --bin overlay
          cp rust/target/release/overlay /tmp/overlay
          EMBED_ID="$(EMBED_MODELS_CONFIG="$PWD/image-data/models/models.yaml" go run ./cmd/embedid)"
          echo "embed identity (baked registry): $EMBED_ID"
          test -n "$EMBED_ID" || { echo "::error::empty embed identity from cmd/embedid"; exit 1; }
          VREF="ghcr.io/${{ github.repository_owner }}/3gpp-vec:latest-fp16"
          retry oras manifest fetch "$VREF" > /tmp/vec-manifest.json
          jq -r '.layers[] | select((.annotations["org.opencontainers.image.title"] // "") | test("^(s|shard-)[0-9]{2}.*\\.duckdb\\.zst$")) | .digest + " " + .annotations["org.opencontainers.image.title"]' \
            /tmp/vec-manifest.json > /tmp/subs.txt
          test -s /tmp/subs.txt || { echo "::error::no vector sub-bases on $VREF — refusing to ship a silently-lexical data image"; exit 1; }
          echo "fusing $(wc -l < /tmp/subs.txt) sub-bases:"; cat /tmp/subs.txt
          : > /tmp/overlay.log
          skipped=0
          while read -r digest title; do
            echo "--- $title ---"; df -h / | tail -1
            retry oras blob fetch "$VREF@$digest" --output /tmp/sub.duckdb.zst
            if ! zstd -d -q -f --long=31 /tmp/sub.duckdb.zst -o /tmp/sub.duckdb 2>/dev/null \
               || [ "$(dd if=/tmp/sub.duckdb bs=1 skip=8 count=4 2>/dev/null)" != "DUCK" ] \
               || ! /tmp/overlay --base image-data/3gpp.duckdb --vec /tmp/sub.duckdb --embedding-model "$EMBED_ID" 2>&1 | tee -a /tmp/overlay.log; then
              echo "::warning::sub-base $title is invalid or failed to overlay — SKIPPED (its series stays lexical until the channel republishes it)"
              skipped=$((skipped+1))
            fi
            rm -f /tmp/sub.duckdb.zst /tmp/sub.duckdb
          done < /tmp/subs.txt
          echo "sub-bases skipped: $skipped"
          echo "=== sizes ==="; du -sh image-data image-data/* image-data/*/* 2>/dev/null || true
          vectorised="$(grep -oE 'done: [0-9]+ clauses vectorised' /tmp/overlay.log | tail -1 | grep -oE '[0-9]+' || echo 0)"
          echo "fused vectorised clauses: $vectorised"
          [ "$vectorised" -ge 2000000 ] || { echo "::error::fused DB has only $vectorised vectorised clauses (< 2,000,000) — channel incomplete or overlay mis-matched"; exit 1; }
          grep -q 'embedding_model stamped:' /tmp/overlay.log || { echo "::error::embedding_model not stamped — serve would refuse semantic"; exit 1; }
          test -s image-data/3gpp.duckdb                          || { echo "::error::baked DB missing"; exit 1; }
          test -s image-data/models/bge-m3-fp16/model.onnx_data   || { echo "::error::fp16 BGE-M3 weights missing"; exit 1; }
          test -s image-data/models/models.yaml                   || { echo "::error::baked model registry missing"; exit 1; }
          test -s image-data/models/bge-reranker-v2-m3/model.onnx || { echo "::error::reranker model missing (drop --no-reranker?)"; exit 1; }
          # DISK FIRST, then COMPACT on the emptiest disk (see #136/#137 history).
          rm -rf bge-cache /tmp/mcp /tmp/overlay /tmp/vec-manifest.json /tmp/subs.txt
          scratch="image-data"
          mnt_free="$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)"
          if [ "${mnt_free:-0}" -ge 30 ]; then
            sudo install -d -m 0777 /mnt/compact-scratch
            scratch="/mnt/compact-scratch"
          fi
          compact="$scratch/3gpp.compact.duckdb"
          echo "compaction scratch: $compact (mnt_free=${mnt_free:-0}G)"
          if retry bash -c "curl -fsSL -o /tmp/duckdb.zip 'https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip'"; then
            mkdir -p /tmp/dk && unzip -o -q /tmp/duckdb.zip -d /tmp/dk
            cvec=0; cmeta=""
            if /tmp/dk/duckdb -c "ATTACH 'image-data/3gpp.duckdb' AS src (READ_ONLY); ATTACH '$compact' AS dst; COPY FROM DATABASE src TO dst;" \
               && cvec="$(/tmp/dk/duckdb -noheader -list "$compact" 'SELECT count(*) FROM clauses WHERE embedding IS NOT NULL;')" \
               && cmeta="$(/tmp/dk/duckdb -noheader -list "$compact" "SELECT value FROM schema_meta WHERE key = 'embedding_model';")" \
               && [ "${cvec:-0}" -ge 2000000 ] && [ -n "$cmeta" ] \
               && CGO_ENABLED=1 go run ./cmd/validate --db "$compact" \
                    --require-fts --min-clauses 1 --max-empty-meta 100000; then
              echo "compacted copy keeps vectors=$cvec embedding_model=$cmeta"
              before=$(stat -c%s image-data/3gpp.duckdb); after=$(stat -c%s "$compact")
              rm -f image-data/3gpp.duckdb
              mv -f "$compact" image-data/3gpp.duckdb
              echo "DB compacted: $((before/1024/1024)) MB -> $((after/1024/1024)) MB"
            else
              echo "::warning::compaction failed or lost FTS — keeping the (bloated) fused DB"
              rm -f "$compact"
            fi
          else
            echo "::warning::duckdb CLI unavailable — skipping compaction"
          fi
          # 6) FREEZE the HNSW index on the (compacted) fused DB — the LAST DB step.
          #    It MUST come after compaction: COPY FROM DATABASE does not copy custom
          #    indexes, so freezing earlier would be undone. Without this the shipped
          #    DB has hnsw_state="" → serve's LoadVSS refuses it → exact-scan →
          #    server_info hnsw:false/semantic:false despite the vectors being baked.
          #    freeze-hnsw indexes the EXISTING embedding column (no embedder/ONNX)
          #    and fail-louds if the post-state is not "frozen".
          #    NOTE (resources): HNSW on ~2.85M×1024 loads vectors into RAM + builds
          #    the graph (several minutes). If this OOMs, move to a larger runner or
          #    tune ef_construction/M.
          # Memory cushion: the HNSW build loads ~12 GB of vectors (2.85M×1024) +
          # the graph into RAM; a bare 16 GB runner OOMs (the agent dies → "operation
          # was canceled"). A big swapfile on /mnt lets it complete (slower, never
          # killed). The early cleanup swapoff'd to reclaim disk — re-arm it here.
          echo "arming swap for the HNSW build…"
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/hnsw-swap 2>/dev/null || true
          if sudo fallocate -l 28G /mnt/hnsw-swap 2>/dev/null || sudo dd if=/dev/zero of=/mnt/hnsw-swap bs=1M count=28672 status=none; then
            sudo chmod 600 /mnt/hnsw-swap && sudo mkswap /mnt/hnsw-swap >/dev/null && sudo swapon /mnt/hnsw-swap && echo "swap armed:" && free -h | grep -i swap
          else
            echo "::warning::could not create swapfile — HNSW build may OOM"
          fi
          echo "freezing HNSW index on the fused DB… (Rust store-rs freeze-hnsw)"; df -h / /mnt | tail -2; free -h | head -2
          command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          PATH="$HOME/.cargo/bin:$PATH" cargo build --release --manifest-path rust/store/Cargo.toml --bin freeze-hnsw
          ./rust/target/release/freeze-hnsw --db image-data/3gpp.duckdb
          sudo swapoff /mnt/hnsw-swap 2>/dev/null || true; sudo rm -f /mnt/hnsw-swap 2>/dev/null || true
          echo "HNSW frozen ✓"; du -sh image-data/3gpp.duckdb
          # AUTHORITATIVE COMPLETENESS GATE — the data layer is now final (fused +
          # compacted + frozen). Assert the FULL contract BEFORE anything is pushed, so
          # 3gpp-data:latest can NEVER move onto an incomplete layer (dense not
          # converged at floor, or — once DATA_CONTRACT=dense+sparse — sparse missing/
          # stale). A failure here fails the bake job → no push → :latest unchanged.
          # Single source of truth shared with the mcp image guard (scripts/data-contract.sh).
          CONTRACT_FLAGS="$(DATA_CONTRACT='${{ vars.DATA_CONTRACT }}' DATA_EMBED_FLOOR="${{ vars.DATA_EMBED_FLOOR || 'Rel-99' }}" bash scripts/data-contract.sh)"
          echo "data-completeness contract: $CONTRACT_FLAGS"
          # shellcheck disable=SC2086
          # NOTE: when DATA_CONTRACT includes sparse, build with -tags onnx so
          # --require-sparse is identity-aware (the bake job already links ORT); the
          # default dense contract needs no ONNX, matching the validate calls above.
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb $CONTRACT_FLAGS --min-clauses 1
          go clean -cache -testcache -modcache 2>/dev/null || true
          rm -rf /tmp/dk /tmp/duckdb.zip /mnt/compact-scratch 2>/dev/null || true
          du -sh image-data image-data/* 2>/dev/null || true
          df -h / /mnt 2>/dev/null || df -h /
          # Provenance handed to the Dockerfile labels + downstream consumers.
          {
            echo "embed_identity=$EMBED_ID"
            echo "rows=$vectorised"
            echo "created=$(date -u +%FT%TZ)"
            echo "datetag=$(date -u +%F)"
            echo "source_corpus=${SRC_CORPUS:-unknown}"
            # The data-completeness contract level this layer PASSED (cmd/validate just
            # ran it). Stamped as a label below so the mcp image can assert completeness
            # by LABEL — no need to re-read the ~22 GB DB at image-build time.
            echo "contract=${{ vars.DATA_CONTRACT || 'dense' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Disk before image build (visibility)
        run: df -h / /mnt 2>/dev/null || df -h /

      - name: Install crane (streaming OCI push — low disk, replaces buildx)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/crane" version
      # GHCR_PAT (not github.token): a CI-token push auto-links the package to
      # this PUBLIC repo → PUBLIC visibility. A PAT push stays unlinked → born
      # PRIVATE (same posture as 3gpp-corpus / 3gpp-mcp).
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      # DISK-SAFE build via crane STREAMING (replaces docker buildx). The fused DB
      # is ~33 GB (the frozen HNSW index keeps a fp32 copy of the 2.85M×1024 vectors
      # on top of the column). buildx materialised the context + layer on disk
      # (~50 GB peak) and repeatedly ENOSPC'd the runner ROOT disk (/) — buildkit
      # spills to /tmp/host paths even with data-root on /mnt — killing the agent.
      # crane streams the data layer straight to GHCR (digest computed DURING upload
      # via go-containerregistry stream.Layer), so peak disk ≈ 0 beyond the DB that
      # already exists on disk. Dockerfile.data is just `FROM debian-slim` + LABELs +
      # `COPY --chown=10001:10001 image-data/ /data/mcp-3gpp/`, reproduced here:
      # per-arch append onto the arch's debian base, labels via crane mutate, then
      # fuse the two arch manifests into the multi-arch index. crane authenticates
      # via the docker config written by docker/login-action above.
      - name: Build + push 3gpp-data per-arch (crane streaming, disk-safe) + fuse
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository_owner }}/3gpp-data"
          BASE="debian:bookworm-slim@sha256:96e378d7e6531ac9a15ad505478fcc2e69f371b10f5cdf87857c4b8188404716"
          source scripts/lib/retry.sh
          # Recipe hash stamped as a label so the change-guard can detect a bake-LOGIC
          # change (not just a corpus-content change) and rebake accordingly.
          RECIPE="$(scripts/bake-recipe-hash.sh)"
          # Stage the DB under its in-image path WITHOUT copying 33 GB: a rename on
          # the same filesystem is instant and uses no extra disk. The tar then
          # streams these paths verbatim into the layer (data/mcp-3gpp/… → /data/mcp-3gpp/).
          rm -rf data-stage && mkdir -p data-stage/data
          mv image-data data-stage/data/mcp-3gpp
          digests=""
          for arch in amd64 arm64; do
            echo "=== crane append linux/$arch ==="; df -h / 2>/dev/null | tail -1
            bdig="$(retry crane digest --platform "linux/$arch" "$BASE")"
            # Stream the data layer: no intermediate tarball, no buildx, no /tmp blob.
            # --owner/--group mirror Dockerfile.data's COPY --chown=10001:10001.
            # RETRY-SAFE: the WHOLE tar|crane pipe is retried so each attempt
            # re-streams a FRESH tar. The earlier `tar | retry crane` consumed stdin on
            # the first attempt, so a transient GHCR 504 made the retry push a 23-byte
            # EMPTY layer (Verify caught it, but only after :latest had moved — run
            # 27483215599). Re-streaming (no intermediate file) keeps it disk-safe.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if tar -C data-stage --owner=10001 --group=10001 -cf - data \
                   | crane append -b "debian:bookworm-slim@$bdig" -f - -t "$REPO:stage-$arch"; then
                pushed=1; break
              fi
              echo "::warning::data layer push linux/$arch attempt $attempt failed — re-streaming in 10s"
              sleep 10
            done
            [ "$pushed" = 1 ] || { echo "::error::data layer push linux/$arch failed after 5 attempts"; exit 1; }
            # LABELs (metadata-only re-push to the same tag; mirrors Dockerfile.data).
            retry crane mutate "$REPO:stage-$arch" \
              --label org.opencontainers.image.description="3GPP corpus data (fused DuckDB + BGE-M3 fp16) base for 3gpp-mcp (PRIVATE — verbatim 3GPP text)" \
              --label io.kodflow.3gpp.data.created="${{ steps.bake.outputs.created }}" \
              --label io.kodflow.3gpp.embedding.identity="${{ steps.bake.outputs.embed_identity }}" \
              --label io.kodflow.3gpp.duckdb.rows="${{ steps.bake.outputs.rows }}" \
              --label io.kodflow.3gpp.source.corpus="${{ steps.bake.outputs.source_corpus }}" \
              --label io.kodflow.3gpp.bake.recipe="$RECIPE" \
              --label io.kodflow.3gpp.data.contract="${{ steps.bake.outputs.contract }}" \
              -t "$REPO:stage-$arch"
            d="$(retry crane digest "$REPO:stage-$arch")"
            test -n "$d" || { echo "::error::no digest for linux/$arch"; exit 1; }
            echo "linux/$arch -> $d"
            digests="$digests -m $REPO@$d"
          done
          # Fuse the two arch manifests into a multi-arch index (metadata-only).
          # shellcheck disable=SC2086
          retry crane index append -t "$REPO:latest" $digests
          retry crane tag "$REPO:latest" "${{ steps.bake.outputs.datetag }}"
          echo "fused multi-arch:"; crane manifest "$REPO:latest" | jq -r '.manifests[]|"\(.platform.os)/\(.platform.architecture)"'

      # FAIL-LOUD multi-arch assertion: the pushed index must carry BOTH
      # linux/amd64 and linux/arm64, and each platform's last layer (the data
      # COPY) must be the big data blob (>1 GiB). Per-arch by design now (the mcp
      # full image inherits the matching arch's layer via FROM); the previous
      # single-blob property no longer applies.
      - name: Verify multi-platform manifests each carry a data layer
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          set -euo pipefail
          REF="ghcr.io/${{ github.repository_owner }}/3gpp-data:latest"
          idx="$(crane manifest "$REF")"
          fail=0
          for p in amd64 arm64; do
            d="$(printf '%s' "$idx" | jq -r --arg a "$p" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')"
            test -n "$d" || { echo "::error::no linux/$p manifest on $REF"; fail=1; continue; }
            m="$(crane manifest "$REF@$d")"
            l="$(printf '%s' "$m" | jq -r '.layers[-1].digest')"
            sz="$(printf '%s' "$m" | jq -r '.layers[-1].size')"
            echo "linux/$p -> data layer $l (${sz} bytes)"
            [ "${sz:-0}" -gt 1073741824 ] || { echo "::error::linux/$p last layer is ${sz:-0} bytes (< 1 GiB) — data layer missing"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK: both platforms carry a >1 GiB data layer"
          exit "$fail"

      # ANTI-LEAK, fail-loud: the PAT push posture makes the package born
      # PRIVATE, but posture is not proof — verify after EVERY push, self-heal
      # (PATCH to private) if it ever shows public, and fail if the heal fails.
      # Runs with the PAT: only the package owner's token can read/patch it.
      - name: Assert 3gpp-data is PRIVATE (self-heal then fail-loud)
        if: ${{ github.event.inputs.push != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-data" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-data visibility: $vis"
          if [ "$vis" = "public" ]; then
            echo "::warning::3gpp-data is PUBLIC — attempting self-heal to private"
            gh api -X PATCH "/user/packages/container/3gpp-data/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-data" --jq '.visibility' 2>/dev/null || echo absent)"
            echo "after heal: $vis"
          fi
          [ "$vis" = "private" ] || { echo "::error::3gpp-data is '$vis' (must be private — verbatim 3GPP text). Fix in the UI: Packages → 3gpp-data → Settings → Change visibility."; exit 1; }
