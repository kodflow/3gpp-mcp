# =============================================================================
#  Corpus · Sparse (Kaggle GPU)   — ADDITIVE learned-lexical pass, NO dense re-embed
# =============================================================================
#  WHAT it does    Produces the BGE-M3 SPARSE (learned-lexical) layer for the whole
#                  corpus: exports the dense+sparse model, pulls the private lexical
#                  base, runs `cmd/embed --sparse-only` on Kaggle GPU (fills
#                  clause_sparse from heading+text — the dense `embedding` column is
#                  NEVER touched), then publishes sparse-index.json to `latest` so the
#                  self-heal signal (discover --sparse-check) CONVERGES, plus a compact
#                  clause_sparse overlay artifact the data-image bake folds in.
#
#  WHEN it runs    MANUAL (workflow_dispatch) OR auto-dispatched by corpus-matrix's
#                  `dispatch-sparse` job when the published sparse layer differs from
#                  what the build expects AND repo var AUTO_SPARSE_ON_BUILD=='true'.
#
#  ⚠ UNVALIDATED   Like the dense Kaggle campaign, a real run needs a phone-verified
#                  Kaggle account (GPU + Internet), KAGGLE_API_TOKEN + KAGGLE_USERNAME,
#                  and a GHCR read token (GHCR_READ_PAT / GHCR_PAT) for the private base
#                  pull. Dormant by default (dispatch-sparse is gated off). Each run
#                  is a BOUNDED slice (embed_limit, fits under Kaggle's 12 h cap): the
#                  kernel pulls the previously published 3gpp-sparse shard, overlays it,
#                  embeds only the remaining gap, then republishes the CUMULATIVE shard.
#                  Re-dispatch until RESULT shows clause_sparse_rows == clauses_total.
# =============================================================================
name: Corpus · Sparse (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      embed_floor:
        description: "Release floor (informational; sparse covers all clauses)."
        required: false
        default: "Rel-99"
      embed_limit:
        description: "Clauses to embed THIS session (bounded slice fitting under the 12 h cap; the kernel resumes from the published shard). Re-dispatch until converged. 0 = whole remaining gap."
        required: false
        default: "80000"
      publish:
        description: "Publish sparse-index.json to `latest` (convergence) + the overlay artifact. Default true."
        required: false
        default: "true"
      kaggle_account:
        description: "Kaggle account to try FIRST (the other is the automatic fallback; run stops only if BOTH fail auth)."
        required: false
        default: "primary"
        type: choice
        options: [primary, fallback]

concurrency:
  group: corpus-sparse-kaggle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sparse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Two Kaggle accounts: the run step below loops over them (order = KAGGLE_ACCOUNT),
      # auth-probes each, and on GPU-quota exhaustion falls back to the other; it stops
      # only if NO account gets a GPU. scripts/kaggle-gpu-check.sh classifies gpu vs quota.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_API_TOKEN_FALLBACK: ${{ secrets.KAGGLE_API_TOKEN_FALLBACK }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_USERNAME_FALLBACK: ${{ vars.KAGGLE_USERNAME_FALLBACK || secrets.KAGGLE_USERNAME_FALLBACK }}
      KAGGLE_ACCOUNT: ${{ github.event.inputs.kaggle_account || 'primary' }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PAT: ${{ secrets.GHCR_READ_PAT || secrets.GHCR_PAT }}
      BRANCH: ${{ github.ref_name }}
      EMBED_FLOOR: ${{ github.event.inputs.embed_floor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install kaggle CLI (pin 2.2.0 — access-token auth)
        run: |
          pipx install 'kaggle==2.2.0' || pip install --user 'kaggle==2.2.0'
          kaggle --version
      - name: Guard — GHCR token present
        run: |
          [ -n "$GHCR_PAT" ] || { echo "::error::GHCR_READ_PAT/GHCR_PAT not set — needed to pull the private lexical base."; exit 1; }
      - name: Run sparse pass on Kaggle GPU (auto-fallback across accounts on quota)
        run: |
          set -euo pipefail
          # Two-account GPU fallback (see corpus-rust-embed-kaggle.yml): try each account's
          # GPU; if one is out of weekly quota (no GPU → kernel logs gpu=absent / no output,
          # scripts/kaggle-gpu-check.sh reports "quota") fall back to the other. Stop only if
          # NO account is granted a GPU.
          PRIM_TOK="${KAGGLE_API_TOKEN:-}"; PRIM_USER="${KAGGLE_USERNAME:-}"
          FB_TOK="${KAGGLE_API_TOKEN_FALLBACK:-}"; FB_USER="${KAGGLE_USERNAME_FALLBACK:-}"
          case "${KAGGLE_ACCOUNT:-primary}" in
            fallback) ORDER="fallback primary" ;;
            *) ORDER="primary fallback" ;;
          esac
          dispatch() {
          dir="$RUNNER_TEMP/sparse-kernel"; rm -rf "$dir"; mkdir -p "$dir"
          slug="${KAGGLE_USER}/3gpp-sparse-corpus"
          # Generated kernel = env prepend (GHCR token reaches crane; kernel stays
          # is_private:true so the token is never exposed) + the committed kernel body.
          {
            echo "import os"
            echo "os.environ.setdefault('GHCR_OWNER', '${GHCR_OWNER}')"
            echo "os.environ.setdefault('GHCR_PAT', '${GHCR_PAT}')"
            echo "os.environ.setdefault('BRANCH', '${BRANCH}')"
            echo "os.environ.setdefault('EMBED_FLOOR', '${EMBED_FLOOR:-Rel-99}')"
            echo "os.environ.setdefault('EMBED_LIMIT', '${{ github.event.inputs.embed_limit }}')"
            cat scripts/kaggle/kernel-sparse-corpus.py
          } > "$dir/kernel.py"
          printf '{\n "id": "%s",\n "title": "3gpp sparse corpus",\n "code_file": "kernel.py",\n "language": "python",\n "kernel_type": "script",\n "is_private": true,\n "enable_gpu": true,\n "enable_internet": true,\n "dataset_sources": [],\n "competition_sources": [],\n "kernel_sources": []\n}\n' "$slug" > "$dir/kernel-metadata.json"
          kaggle kernels push -p "$dir" --accelerator NvidiaTeslaT4
          # Poll until terminal (the CLI exit code is unreliable; parse the status string).
          for _ in $(seq 1 660); do
            st="$(kaggle kernels status "$slug" 2>&1 || true)"
            case "$st" in
              *complete*|*COMPLETE*) echo "kernel complete"; break ;;
              *error*|*ERROR*|*cancel*|*CANCEL*) echo "::warning::kernel ended: $st"; break ;;
            esac
            sleep 30
          done
          mkdir -p out
          # Retry the output pull: a large committed output can break mid-download
          # (IncompleteRead). The kernel keeps /kaggle/working tiny, but retry anyway.
          for a in 1 2 3 4; do
            kaggle kernels output "$slug" -p out && break
            echo "output pull attempt $a failed — retrying"; sleep 15
          done
          echo "=== output files ==="; ls -la out || true
          # Kaggle does NOT commit /kaggle/working on an ERROR'd kernel, so RESULT.txt
          # may be absent — but the kernel LOG (stdout/stderr) is always retrievable and
          # is the actual error. Print it so a failed run is debuggable from CI alone.
          echo "=== KERNEL LOG (tail) ==="; tail -n 120 out/*.log 2>/dev/null || echo "(no .log pulled)"
          echo "=== RESULT ==="; cat out/RESULT.txt 2>/dev/null || echo "(no RESULT.txt — see log above)"
          }
          # Try each account until one is granted a GPU. quota → fall back; gpu → keep it.
          got_gpu=0
          for acct in $ORDER; do
            case "$acct" in
              primary)  export KAGGLE_API_TOKEN="$PRIM_TOK" KAGGLE_USER="$PRIM_USER" ;;
              fallback) export KAGGLE_API_TOKEN="$FB_TOK"   KAGGLE_USER="$FB_USER" ;;
            esac
            if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USER" ]; then
              echo "account '$acct' not configured (token/username empty) — skipping"; continue
            fi
            echo "::group::Kaggle account=$acct user=$KAGGLE_USER"
            if ! kaggle kernels list -m -p 1 >/dev/null 2>&1; then
              echo "::warning::account '$acct' auth failed — trying next"; echo "::endgroup::"; continue
            fi
            rm -rf out
            dispatch || echo "::warning::dispatch on account '$acct' errored — judging by output"
            status="$(bash scripts/kaggle-gpu-check.sh out)"
            echo "account '$acct' gpu-check=$status"; echo "::endgroup::"
            if [ "$status" = gpu ]; then echo "GPU obtained on account '$acct'"; got_gpu=1; break; fi
            echo "::warning::account '$acct' got NO GPU (quota) — falling back to the next account"
          done
          [ "$got_gpu" = 1 ] || { echo "::error::no Kaggle account had GPU quota this run — stopping"; exit 1; }
          # The winning account had a GPU; require the sparse pass to have produced its index.
          test -f out/sparse-index.json || { echo "::error::an account got a GPU but produced no sparse-index.json (see log)"; exit 1; }
          echo "sparse-index: $(cat out/sparse-index.json)"
      - name: Upload sparse overlay + index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-sparse
          path: |
            out/sparse-index.json
            out/sparse-shard.duckdb
            out/RESULT.txt
            out/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---- publish-sparse: update sparse-index.json on `latest` so discover
  # --sparse-check CONVERGES (otherwise dispatch-sparse re-fires every build). The
  # clause_sparse overlay artifact is what the data-image bake folds via cmd/overlay
  # overlaySparse. ----------------------------------------------------------------
  publish-sparse:
    needs: sparse
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the `latest` release asset
      packages: write # push the 3gpp-sparse channel
    env:
      GH_TOKEN: ${{ github.token }}
      ORAS_VERSION: "1.2.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: 3gpp-sparse
          path: out
      - name: Publish sparse-index.json to `latest` (convergence)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          test -f out/sparse-index.json || { echo "::error::no sparse-index.json to publish"; exit 1; }
          echo "publishing sparse-index: $(cat out/sparse-index.json)"
          retry gh release upload latest out/sparse-index.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Push the sparse shard to GHCR 3gpp-sparse (the bake folds it via cmd/overlay)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          test -f out/sparse-shard.duckdb || { echo "::notice::no sparse-shard.duckdb in output — channel left untouched"; exit 0; }
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends zstd
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          retry bash -c 'echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin'
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-sparse:latest"
          mkdir -p sparse && cp out/sparse-index.json sparse/
          zstd -19 -T0 -f out/sparse-shard.duckdb -o sparse/sparse-shard.duckdb.zst
          cd sparse
          retry oras push "$REF" \
            --artifact-type application/vnd.kodflow.3gpp-sparse.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            sparse-index.json:application/json sparse-shard.duckdb.zst:application/zstd
      - name: Assert 3gpp-sparse is PRIVATE (verbatim clause text in the shard)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::notice::GHCR_PAT absent — skipping visibility check"; exit 0; }
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-sparse" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-sparse visibility: $vis"
          if [ "$vis" = "public" ]; then
            gh api -X PATCH "/user/packages/container/3gpp-sparse/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-sparse" --jq '.visibility' 2>/dev/null || echo absent)"
          fi
          [ "$vis" != "public" ] || { echo "::error::3gpp-sparse is public (clause text). Make it private."; exit 1; }
