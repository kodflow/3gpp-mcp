# Auto-rerun corpus-matrix when build-shards hit the GitHub-hosted-runner 6h
# job cap. Pairs with the --resume infrastructure shipped in PR #47:
#
#   1. corpus-matrix dispatches → build-shards run
#   2. big series (e.g. 24, 196 specs) ~8-10h ingest → killed at 360 min
#      with conclusion="cancelled" (NOT failure — the platform terminates the
#      runner, doesn't error the step), whole run becomes "cancelled"
#   3. THIS workflow fires on the workflow_run completion event, detects
#      cancelled build-shards, calls `gh run rerun --failed` (which reruns
#      cancelled AND failed jobs)
#   4. the rerun's `Restore prior shard artifact` pulls back the partial DB
#      uploaded by the previous attempt's `if: always()` step; --resume skips
#      'done' specs and purges+redoes 'started' ones — so the rerun makes
#      ADDITIONAL progress in its next 6h slot
#   5. repeat until either all shards green (publish-vec fires) or the
#      max_attempts safety cap kicks in
#
# Why this beats per-(series,release) matrix splitting: it's a single ~50-line
# YAML, requires zero code change, and ANY future 6h-bound shard auto-recovers
# regardless of which spec made it big.
name: Corpus Matrix — auto-rerun on 6h cap

on:
  workflow_run:
    workflows: ["Corpus Matrix"]
    types: [completed]

# Serialize per source run so two completion events in quick succession can't
# race to dispatch overlapping reruns of the same shards (each rerun bumps
# run_attempt; a double-fire would skip the safety cap or worse trigger
# duplicate work).
concurrency:
  group: corpus-matrix-autorerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  # actions:write is REQUIRED by `gh run rerun` (called below) — the default
  # GITHUB_TOKEN is actions:read, which lets us READ the failed jobs list via
  # `gh api .../jobs` but NOT trigger a rerun. contents:read keeps everything
  # else (e.g. the implicit checkout-action footprint) at the minimum scope.
  actions: write
  contents: read

jobs:
  rerun:
    # Fire only when the source run ended non-success AND it was a dispatch
    # (manual triggers are the only ones that hit this path — PR validations
    # use a tiny scope that fits in 6h, so they never end cancelled).
    if: >-
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      # Hard cap to avoid an infinite rerun loop on a genuinely-broken state.
      # 12 attempts × {shard_timeout_minutes} each. With timeout=60 that's 12h
      # of cumulative runner time per shard — comfortably above series 24's
      # ~5h ingest projection AND leaves headroom for partial-progress
      # restarts. With timeout=360 it caps the cumulative wall-clock at 72h
      # which is still a real cap; a job genuinely broken won't loop forever.
      MAX_ATTEMPTS: "12"
    steps:
      - name: Decide whether to rerun
        id: decide
        run: |
          set -eu
          echo "source run=$SOURCE_RUN_ID attempt=$SOURCE_ATTEMPT conclusion=${{ github.event.workflow_run.conclusion }}"
          if [ "$SOURCE_ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::warning::source run already at attempt $SOURCE_ATTEMPT/$MAX_ATTEMPTS — refusing further reruns"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull the source run's input shard_timeout_minutes so we can
          # distinguish a platform-cap kill from a user-cancel. The platform
          # always kills runners EXACTLY at the configured timeout-minutes;
          # a user cancel happens at an arbitrary elapsed time (usually
          # much less). Defaults to 360 if not present (older dispatches
          # without the input).
          TIMEOUT_MIN=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID" \
            --jq '.referenced_workflows | length' 2>/dev/null >/dev/null; \
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/corpus-matrix.yml/runs/$SOURCE_RUN_ID" 2>/dev/null \
              | jq -r '.inputs.shard_timeout_minutes // "360"' 2>/dev/null || echo "360")
          # Fallback if the above didn't work (the workflow_run object's
          # inputs field shape varies across API versions): just use 360.
          [ -z "$TIMEOUT_MIN" ] && TIMEOUT_MIN=360
          echo "source timeout=${TIMEOUT_MIN} min"
          # Pull all cancelled/failed build-shards with their elapsed time.
          # A platform-cap kill has elapsed_min == TIMEOUT_MIN (within 1 min
          # of slack for runner teardown). A user cancel has elapsed_min
          # strictly less. We refuse to rerun if MAJORITY of cancellations
          # look like user-cancels (this protects against an operator who
          # `gh run cancel`'d a run from being auto-resurrected — exactly
          # the bug the prod v1 26661646421 hit after I cancelled it).
          CANCELLED_AT_CAP=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq "[.jobs[] | select(.name | startswith(\"build-shard\"))
                          | select(.run_attempt == $SOURCE_ATTEMPT)
                          | select(.conclusion==\"cancelled\")
                          | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor)
                          | select(. >= $TIMEOUT_MIN - 1)] | length")
          USER_CANCELLED=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq "[.jobs[] | select(.name | startswith(\"build-shard\"))
                          | select(.run_attempt == $SOURCE_ATTEMPT)
                          | select(.conclusion==\"cancelled\")
                          | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor)
                          | select(. < $TIMEOUT_MIN - 1)] | length")
          echo "cancelled @ cap: $CANCELLED_AT_CAP   user-cancelled: $USER_CANCELLED"
          if [ "$USER_CANCELLED" -gt "$CANCELLED_AT_CAP" ]; then
            echo "::warning::source run looks USER-cancelled (most shards elapsed < timeout=$TIMEOUT_MIN) — refusing to rerun"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count build-shard jobs that ended cancelled or failure on THIS
          # attempt. The GH API endpoint defaults to `filter=latest` (only
          # the most-recent attempt's jobs), but we pin it explicitly: a
          # default change would silently start summing across all prior
          # attempts and inflate the count.
          #
          # Note: `gh api --jq` accepts ONE argument (the jq expression). We
          # can't use jq's --argjson here (that's a flag of the standalone
          # jq binary, not of gh's --jq wrapper — the previous attempt PR #48
          # tried that and got "accepts 1 arg(s), received 4"). So we inline
          # $SOURCE_ATTEMPT into the jq expression via shell expansion (double
          # quotes), which is safe because the variable comes from a trusted
          # GitHub-controlled context (workflow_run.run_attempt is always a
          # small integer set by the platform itself).
          to_rerun=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq "[.jobs[] | select(.name | startswith(\"build-shard\"))
                          | select(.run_attempt == $SOURCE_ATTEMPT)
                          | select(.conclusion==\"cancelled\" or .conclusion==\"failure\")] | length")
          echo "build-shards needing rerun: $to_rerun"
          if [ "$to_rerun" -eq 0 ]; then
            echo "::notice::no cancelled/failed build-shards on attempt $SOURCE_ATTEMPT — nothing to rerun"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rerun=true" >> "$GITHUB_OUTPUT"
      - name: Re-run failed/cancelled jobs (resumes via --resume)
        if: steps.decide.outputs.rerun == 'true'
        run: |
          set -eu
          # `gh run rerun --failed` is the documented "rerun only failed AND
          # cancelled jobs" call. It bumps run_attempt by 1 and re-executes
          # those jobs in-place; the Restore-prior-artifact step in the
          # rerun then pulls the partial shard DB the previous attempt
          # uploaded via its `if: always()` upload step.
          #
          # --repo is REQUIRED here: this workflow has no actions/checkout
          # step (it doesn't need the repo code, only the API), so gh CLI
          # has no .git in cwd to infer the remote from — without --repo it
          # crashes with "failed to determine base repo". The same context-
          # variable is used for the upstream gh api calls.
          gh run rerun "$SOURCE_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo "::notice::rerun dispatched for run $SOURCE_RUN_ID (was attempt $SOURCE_ATTEMPT)"
