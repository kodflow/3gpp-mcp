# =============================================================================
#  Corpus · Auto-resume   (re-runs shards killed by the 6h runner cap)
# =============================================================================
#
#  WHEN it runs   AUTOMATICALLY, on every completion of "Corpus · Build"
#                 (workflow_run trigger). You never start it by hand.
#
#  WHAT it does   When a build-shard is killed at the 360-min GitHub cap (status
#                 "cancelled", not "failure"), it calls `gh run rerun --failed`
#                 to relaunch ONLY the cancelled/failed shards. The rerun's
#                 "Restore prior shard artifact" pulls back the partial DB the
#                 killed attempt uploaded, and --resume skips already-'done'
#                 specs (and, for embed, already-vectorised clauses via
#                 embedding_hash) → each slot makes additional forward progress.
#                 Repeats until all shards are green or MAX_ATTEMPTS is hit.
#
#  WHAT it does NOT do   It does NOT resurrect a run the operator cancelled on
#                 purpose (the user-cancel heuristic compares elapsed vs the
#                 timeout). It does not change inputs or publish anything itself
#                 — it just re-runs the source "Corpus · Build" jobs.
#
#  NOTE   Sub-sharding big series by (series|release) via series_scope is the
#         pro-active way to stay UNDER the cap; this workflow is the safety net
#         for whatever still overruns.
# =============================================================================
name: Corpus · Auto-resume (6h cap)

on:
  workflow_run:
    workflows: ["Corpus · Build"]
    types: [completed]

# Serialize per source run so two completion events in quick succession can't
# race to dispatch overlapping reruns of the same shards (each rerun bumps
# run_attempt; a double-fire would skip the safety cap or worse trigger
# duplicate work).
concurrency:
  group: corpus-matrix-autorerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  # actions:write is REQUIRED by `gh run rerun` (called below) — the default
  # GITHUB_TOKEN is actions:read, which lets us READ the failed jobs list via
  # `gh api .../jobs` but NOT trigger a rerun. contents:read keeps everything
  # else (e.g. the implicit checkout-action footprint) at the minimum scope.
  actions: write
  contents: read

jobs:
  rerun:
    # Fire only when the source run ended non-success AND it was a dispatch
    # (manual triggers are the only ones that hit this path — PR validations
    # use a tiny scope that fits in 6h, so they never end cancelled).
    if: >-
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      # Rerun cap. Set high (999) on purpose: the corpus build must keep
      # resuming until every shard is green — a big series (or an embed=true
      # run at ~1 clause/s on CPU) legitimately needs many 6h slots, and
      # --resume makes real forward progress on each one (skips 'done' specs).
      # The genuine-breakage guard is NOT this counter but the user-cancel
      # heuristic below (a run cancelled well under the timeout is treated as
      # an operator stop and NOT resurrected). So a truly-broken job that dies
      # fast looks like a user-cancel pattern and stops; only jobs that burn
      # their full slot (= real progress or a hard cap) get rerun. 999 ≈ "until
      # it's done".
      MAX_ATTEMPTS: "999"
      # Source run's effective shard_timeout_minutes. workflow_run events DO NOT
      # propagate workflow_dispatch inputs (`github.event.workflow_run.inputs` is
      # not a valid expression on this trigger — the parser rejects the YAML), so
      # we read it from the `shard-timeout` artifact every build-shard stamps
      # (PR-1, timeout-min-drift-resurrects-operator-cancel). This is drift-proof:
      # the value the cap-vs-user-cancel heuristic compares against is the SAME
      # value the source run actually applied as timeout-minutes, regardless of
      # which default corpus-matrix.yml ships. TIMEOUT_FALLBACK only applies when
      # the artifact is absent (an old source run from before the stamp existed);
      # it matches corpus-matrix.yml's shard_timeout_minutes default AND the free-
      # runner hard cap (both 360) so a pre-stamp run is treated conservatively.
      TIMEOUT_FALLBACK: "360"
    steps:
      - name: Decide whether to rerun
        id: decide
        run: |
          set -eu
          echo "source run=$SOURCE_RUN_ID attempt=$SOURCE_ATTEMPT conclusion=${{ github.event.workflow_run.conclusion }}"
          if [ "$SOURCE_ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::warning::source run already at attempt $SOURCE_ATTEMPT/$MAX_ATTEMPTS — refusing further reruns"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the EFFECTIVE timeout from the stamp the source run uploaded
          # (PR-1). workflow_run can't see the dispatch inputs but CAN download
          # the source run's artifacts. Fall back to TIMEOUT_FALLBACK only when
          # the stamp is missing (a pre-stamp source run).
          TIMEOUT_MIN="$TIMEOUT_FALLBACK"
          if gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n shard-timeout -D _stamp 2>/dev/null \
             && [ -f _stamp/shard-timeout.txt ]; then
            stamped="$(tr -dc '0-9' < _stamp/shard-timeout.txt)"
            if printf '%s' "$stamped" | grep -qE '^[1-9][0-9]*$'; then
              TIMEOUT_MIN="$stamped"
              echo "read effective shard timeout from stamp: ${TIMEOUT_MIN} min"
            else
              echo "::warning::shard-timeout stamp present but unparseable ('$stamped') — using fallback ${TIMEOUT_FALLBACK}"
            fi
          else
            echo "::notice::no shard-timeout stamp on source run — using fallback ${TIMEOUT_FALLBACK} min"
          fi
          echo "source timeout=${TIMEOUT_MIN} min"
          # Sanity: TIMEOUT_MIN must be a positive integer before arithmetic.
          if ! printf '%s' "$TIMEOUT_MIN" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::TIMEOUT_MIN='$TIMEOUT_MIN' is not a positive integer"; exit 1
          fi
          # Pull this attempt's jobs ONCE and classify each terminal state.
          # `filter=latest` (the API default, pinned here so a default change
          # can't silently sum across prior attempts) restricts to the most
          # recent attempt; we also re-filter on run_attempt for safety.
          #
          # Note: `gh api --jq` accepts ONE jq-expression argument (no jq
          # --argjson — PR #48 tried that and got "accepts 1 arg(s)"), so
          # $SOURCE_ATTEMPT / $TIMEOUT_MIN are inlined via shell expansion;
          # both come from trusted small-integer contexts.
          JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100")
          jqcount() { printf '%s' "$JOBS" | jq "$1"; }
          ATT="$SOURCE_ATTEMPT"; CAP="$TIMEOUT_MIN"
          # build-shard, cancelled, ran to (near) the cap → genuine 6h-cap kill, resumable.
          SHARD_CAP=$(jqcount "[.jobs[] | select(.name|startswith(\"build-shard\")) | select(.run_attempt==$ATT) | select(.conclusion==\"cancelled\") | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor) | select(.>=$CAP-1)] | length")
          # build-shard, cancelled, ended well under the cap → an operator `gh run cancel`.
          SHARD_USER_CANCEL=$(jqcount "[.jobs[] | select(.name|startswith(\"build-shard\")) | select(.run_attempt==$ATT) | select(.conclusion==\"cancelled\") | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor) | select(.<$CAP-1)] | length")
          # build-shard, FAILED at (near) the cap → resource exhaustion near the
          # deadline (OOM/disk) — resumable, treat like a cap kill.
          SHARD_FAIL_CAP=$(jqcount "[.jobs[] | select(.name|startswith(\"build-shard\")) | select(.run_attempt==$ATT) | select(.conclusion==\"failure\") | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor) | select(.>=$CAP-1)] | length")
          # build-shard, FAILED fast (well under the cap) → almost always a real
          # bug; auto-rerunning it would be the fast-failure-infinite-rerun loop.
          SHARD_FAIL_FAST=$(jqcount "[.jobs[] | select(.name|startswith(\"build-shard\")) | select(.run_attempt==$ATT) | select(.conclusion==\"failure\") | (((.completed_at|fromdate)-(.started_at|fromdate))/60|floor) | select(.<$CAP-1)] | length")
          # Non-build-shard jobs that failed (merge / publish-vec / preflight / model):
          # the rerun-failed-blast-radius — `gh run rerun --failed` WILL relaunch
          # these too, so the decide step must count them or it would skip a run
          # whose only failure was a transient merge/publish step.
          OTHER_FAIL=$(jqcount "[.jobs[] | select(.name|startswith(\"build-shard\")|not) | select(.run_attempt==$ATT) | select(.conclusion==\"cancelled\" or .conclusion==\"failure\")] | length")
          echo "classification: shard_cap=$SHARD_CAP shard_user_cancel=$SHARD_USER_CANCEL shard_fail_cap=$SHARD_FAIL_CAP shard_fail_fast=$SHARD_FAIL_FAST other_fail=$OTHER_FAIL (timeout=${CAP}m)"
          # GUARD: refuse to resurrect when the dominant signal is a deliberate
          # stop or a fast failure. This bounds BOTH `cancelled` (operator cancel)
          # AND `failure` (fast-failing shard) so neither can spin the rerun loop.
          STOP_SIGNALS=$((SHARD_USER_CANCEL + SHARD_FAIL_FAST))
          GO_SIGNALS=$((SHARD_CAP + SHARD_FAIL_CAP))
          if [ "$STOP_SIGNALS" -gt "$GO_SIGNALS" ]; then
            echo "::warning::source run looks USER-cancelled or fast-failing (stop=$STOP_SIGNALS > cap=$GO_SIGNALS, timeout=${CAP}m) — refusing to rerun"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rerun when there is anything `gh run rerun --failed` would make
          # forward progress on: a capped/failed-at-cap shard (--resume resumes),
          # or any other failed job in the blast radius (transient merge/publish).
          to_rerun=$((SHARD_CAP + SHARD_FAIL_CAP + OTHER_FAIL))
          echo "jobs eligible for rerun: $to_rerun"
          if [ "$to_rerun" -eq 0 ]; then
            echo "::notice::no cap-killed shards or transient post-shard failures on attempt $SOURCE_ATTEMPT — nothing to rerun"
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rerun=true" >> "$GITHUB_OUTPUT"
      - name: Re-run failed/cancelled jobs (resumes via --resume)
        if: steps.decide.outputs.rerun == 'true'
        run: |
          set -eu
          # `gh run rerun --failed` is the documented "rerun only failed AND
          # cancelled jobs" call. It bumps run_attempt by 1 and re-executes
          # those jobs in-place; the Restore-prior-artifact step in the
          # rerun then pulls the partial shard DB the previous attempt
          # uploaded via its `if: always()` upload step.
          #
          # --repo is REQUIRED here: this workflow has no actions/checkout
          # step (it doesn't need the repo code, only the API), so gh CLI
          # has no .git in cwd to infer the remote from — without --repo it
          # crashes with "failed to determine base repo". The same context-
          # variable is used for the upstream gh api calls.
          gh run rerun "$SOURCE_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo "::notice::rerun dispatched for run $SOURCE_RUN_ID (was attempt $SOURCE_ATTEMPT)"
