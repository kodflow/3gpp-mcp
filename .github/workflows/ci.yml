# CI — fmt, vet, test. Linting is handled by ktn-linter (hooks), not golangci-lint.
# CGO is required (DuckDB; optional ONNX behind -tags onnx). No cross-compile:
# tests run natively per-OS. Default build stays lexical (no -tags onnx).
#
# Runs on PULL REQUESTS ONLY — the tests gate the merge there. Re-running the same
# OS test matrix on the merge commit (push to main) is redundant (the merge is the
# already-tested PR head), so push to main is intentionally NOT a trigger: a merge
# leaves only "Release" (binaries, if code changed) and "Corpus · Build" (if a
# pipeline file changed).

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14] # linux/amd64 + darwin/arm64 (native CGO)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Test (race + coverage)
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
