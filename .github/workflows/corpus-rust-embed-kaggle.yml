# =============================================================================
#  Corpus · Rust embed (Kaggle GPU)   — the RUST dense campaign (replaces Go embed)
# =============================================================================
#  WHAT it does    Dispatches scripts/kaggle/kernel-rust-embed.py to Kaggle GPU: pulls
#                  the private GHCR 3gpp-corpus base, slices this shard (one SERIES or an
#                  explicit EMBED_RELEASES set), downloads BGE-M3 from HF, builds the Go
#                  bridge (cmd/embed-io) + the Rust embedder crate (ort CUDA EP → T4),
#                  then embed-io export → embedder (live progress bar) → embed-io import
#                  --build-hnsw, and versions the embedded DB + the vecs.jsonl RESUME
#                  ledger back to a per-shard Kaggle Dataset. This is the Rust path the
#                  mandate asks for, and now the SOLE dense path: the Go corpus-embed-kaggle.yml
#                  was RETIRED (its embed driver hard-exits "RETIRED (Phase 11b)") and deleted;
#                  its 3gpp-vec publish step was ported here (publish-vec job, fp16).
#
#  WHEN it runs    MANUAL (workflow_dispatch) ONLY. One dispatch = one shard, BOUNDED and
#                  RESUMABLE (the vecs.jsonl ledger skips already-embedded chunk_ids), so
#                  re-dispatch the same shard until RESULT shows null_after=0.
#
#  ⚠ UNVALIDATED   A real run needs a phone-verified Kaggle account (GPU + Internet),
#                  KAGGLE_API_TOKEN + KAGGLE_USERNAME, and a GHCR read token
#                  (GHCR_READ_PAT / GHCR_PAT) for the private base pull. Dormant by
#                  default — nothing fires this automatically.
# =============================================================================
name: Corpus · Rust embed (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      series:
        description: "2-digit series to embed this shard (e.g. 23). Empty when using releases."
        required: false
        default: ""
      embed_releases:
        description: "Explicit release set (comma-separated, e.g. 'Rel-19,Rel-18') instead of a series shard. Empty = use series."
        required: false
        default: ""
      lot:
        description: "Short lot tag (A/B/…) naming the resume Dataset when using a release set."
        required: false
        default: ""
      batch:
        description: "Clauses per ONNX batch on the GPU."
        required: false
        default: "64"
      limit:
        description: "Cap clauses embedded this session (0 = all). Set small (e.g. 1000) for a fast GPU/throughput diagnostic."
        required: false
        default: "0"
      kaggle_account:
        description: "Kaggle account to try FIRST (the other is the automatic fallback; run stops only if BOTH fail auth)."
        required: false
        default: "primary"
        type: choice
        options: [primary, fallback]
      publish:
        description: "Publish the embedded sub-base to GHCR 3gpp-vec:latest-fp16 (additive). Default true. Only a single 2-digit series dispatch publishes; lot/release runs persist to the Kaggle Dataset only."
        required: false
        default: "true"

concurrency:
  group: corpus-rust-embed-kaggle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Two Kaggle accounts: primary + fallback. The embed step below loops over them
      # (order set by KAGGLE_ACCOUNT), auth-probes each, runs the kernel, and on GPU-quota
      # exhaustion (no GPU allocated) falls back to the other — stopping only if NO account
      # gets a GPU. scripts/kaggle-gpu-check.sh classifies each run as gpu vs quota.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_API_TOKEN_FALLBACK: ${{ secrets.KAGGLE_API_TOKEN_FALLBACK }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_USERNAME_FALLBACK: ${{ vars.KAGGLE_USERNAME_FALLBACK || secrets.KAGGLE_USERNAME_FALLBACK }}
      KAGGLE_ACCOUNT: ${{ github.event.inputs.kaggle_account || 'primary' }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PAT: ${{ secrets.GHCR_READ_PAT || secrets.GHCR_PAT }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install kaggle CLI (pin 2.2.0 — access-token auth)
        run: |
          pipx install 'kaggle==2.2.0' || pip install --user 'kaggle==2.2.0'
          kaggle --version
      - name: Guard — GHCR token present
        run: |
          [ -n "$GHCR_PAT" ] || { echo "::error::GHCR_READ_PAT/GHCR_PAT not set — needed to pull the private base."; exit 1; }
      - name: Embed on Kaggle GPU (auto-fallback across accounts on quota)
        env:
          SERIES: ${{ github.event.inputs.series }}
          EMBED_RELEASES: ${{ github.event.inputs.embed_releases }}
          LOT: ${{ github.event.inputs.lot }}
          EMBED_BATCH: ${{ github.event.inputs.batch }}
          EMBED_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail
          # Two-account GPU fallback: try each account's GPU; if one is out of its weekly
          # quota (no GPU allocated) the kernel logs gpu=absent / yields no output, and
          # scripts/kaggle-gpu-check.sh reports "quota" → fall back to the other account.
          # Stop only if NO account gets a GPU. Capture both accounts up front; the loop
          # swaps the exported KAGGLE_API_TOKEN/KAGGLE_USER per attempt.
          PRIM_TOK="${KAGGLE_API_TOKEN:-}"; PRIM_USER="${KAGGLE_USERNAME:-}"
          FB_TOK="${KAGGLE_API_TOKEN_FALLBACK:-}"; FB_USER="${KAGGLE_USERNAME_FALLBACK:-}"
          case "${KAGGLE_ACCOUNT:-primary}" in
            fallback) ORDER="fallback primary" ;;
            *) ORDER="primary fallback" ;;
          esac
          dispatch() {
          dir="$RUNNER_TEMP/rust-embed-kernel"; rm -rf "$dir"; mkdir -p "$dir"
          # Kaggle slugifies the TITLE (lowercase + dashes) and REQUIRES it to resolve to
          # the metadata id, else `kernels push` 409s. So lowercase the shard and build the
          # title from it ("3gpp rust embed 23" → slug "3gpp-rust-embed-23" == id).
          shard="$(printf '%s' "${SERIES:-${LOT:-all}}" | tr '[:upper:]' '[:lower:]')"
          slug="${KAGGLE_USER}/3gpp-rust-embed-${shard}"
          # Generated kernel = env prepend (GHCR token reaches crane; kernel stays
          # is_private:true so the token is never exposed) + the committed kernel body.
          {
            echo "import os"
            echo "os.environ.setdefault('GHCR_OWNER', '${GHCR_OWNER}')"
            echo "os.environ.setdefault('GHCR_PAT', '${GHCR_PAT}')"
            echo "os.environ.setdefault('BRANCH', '${BRANCH}')"
            echo "os.environ.setdefault('SERIES', '${SERIES:-21}')"
            echo "os.environ.setdefault('EMBED_RELEASES', '${EMBED_RELEASES}')"
            echo "os.environ.setdefault('LOT', '${LOT}')"
            echo "os.environ.setdefault('EMBED_BATCH', '${EMBED_BATCH:-64}')"
            echo "os.environ.setdefault('EMBED_LIMIT', '${EMBED_LIMIT:-0}')"
            cat scripts/kaggle/kernel-rust-embed.py
          } > "$dir/kernel.py"
          # RESUME: if a prior shard dataset exists, MOUNT it so the kernel restores the
          # partially-embedded DB and continues (export-worklist --resume → only the still
          # -NULL clauses). First run = no dataset → fresh slice. Persistence is below.
          RESUME_DS="${KAGGLE_USER}/3gpp-rust-embedded-${shard}"
          ds_src=""
          if kaggle datasets status "$RESUME_DS" >/dev/null 2>&1; then
            ds_src="\"$RESUME_DS\""
            echo "resume dataset present → mounting $RESUME_DS"
          else
            echo "no resume dataset yet ($RESUME_DS) → fresh slice"
          fi
          printf '{\n "id": "%s",\n "title": "3gpp rust embed %s",\n "code_file": "kernel.py",\n "language": "python",\n "kernel_type": "script",\n "is_private": true,\n "enable_gpu": true,\n "enable_internet": true,\n "dataset_sources": [%s],\n "competition_sources": [],\n "kernel_sources": []\n}\n' "$slug" "$shard" "$ds_src" > "$dir/kernel-metadata.json"
          kaggle kernels push -p "$dir" --accelerator NvidiaTeslaT4
          # Let the NEW version enter "running" before polling: re-pushing an existing
          # slug leaves the PRIOR version's terminal status visible for a few seconds, so
          # an immediate poll sees a stale "complete"/"error", breaks, and pulls the old
          # (or empty) output — the 7-second false-failure we hit. Wait it out first.
          echo "waiting 90s for the new kernel version to start…"; sleep 90
          # Poll until terminal. The CLI exit code is unreliable, so parse the status and
          # ECHO it every iteration (a stuck poll must be diagnosable — the first version
          # hung 40 min because no pattern matched). running/queued → wait; complete → done;
          # error/cancel/fail/not-found → stop; unknown → wait but BOUNDED by the cap.
          done_poll=""
          for i in $(seq 1 400); do
            st="$(kaggle kernels status "$slug" 2>&1 || true)"
            echo "poll $i: $st"
            case "$st" in
              *running*|*RUNNING*|*queued*|*QUEUED*) sleep 30; continue ;;
              *complete*|*COMPLETE*) echo "kernel complete"; done_poll=1; break ;;
              *error*|*ERROR*|*cancel*|*CANCEL*|*fail*|*FAIL*|*"not found"*|*404*) echo "::warning::kernel ended: $st"; done_poll=1; break ;;
              *) sleep 30 ;;
            esac
          done
          [ -n "$done_poll" ] || echo "::warning::poll cap reached without a terminal status — pulling output anyway"
          mkdir -p out
          for a in 1 2 3 4; do
            kaggle kernels output "$slug" -p out && break
            echo "output pull attempt $a failed — retrying"; sleep 15
          done
          echo "=== KERNEL LOG (tail) ==="; tail -n 120 out/*.log 2>/dev/null || echo "(no .log pulled)"
          echo "=== RESULT ==="; cat out/RESULT.txt 2>/dev/null || echo "(no RESULT.txt — see log above)"
          }
          # Try each account until one is granted a GPU. quota (no GPU) → fall back to the
          # next; gpu → keep that account and proceed. dispatch is best-effort (|| true):
          # a failed push/pull leaves no usable output → gpu-check reports quota → fall back.
          got_gpu=0
          for acct in $ORDER; do
            case "$acct" in
              primary)  export KAGGLE_API_TOKEN="$PRIM_TOK" KAGGLE_USER="$PRIM_USER" ;;
              fallback) export KAGGLE_API_TOKEN="$FB_TOK"   KAGGLE_USER="$FB_USER" ;;
            esac
            if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USER" ]; then
              echo "account '$acct' not configured (token/username empty) — skipping"; continue
            fi
            echo "::group::Kaggle account=$acct user=$KAGGLE_USER"
            if ! kaggle kernels list -m -p 1 >/dev/null 2>&1; then
              echo "::warning::account '$acct' auth failed — trying next"; echo "::endgroup::"; continue
            fi
            rm -rf out
            dispatch || echo "::warning::dispatch on account '$acct' errored — judging by output"
            status="$(bash scripts/kaggle-gpu-check.sh out)"
            echo "account '$acct' gpu-check=$status"; echo "::endgroup::"
            if [ "$status" = gpu ]; then
              echo "GPU obtained on account '$acct'"; got_gpu=1; SEL_ACCT="$acct"; break
            fi
            echo "::warning::account '$acct' got NO GPU (quota) — falling back to the next account"
          done
          [ "$got_gpu" = 1 ] || { echo "::error::no Kaggle account had GPU quota this run — stopping"; exit 1; }
          # The winning account had a GPU; now require the run to have made progress on it
          # (a GPU-present run that did not step=OK is a real error, not a quota fallback).
          grep -q 'step=OK' out/RESULT.txt 2>/dev/null || { echo "::error::account '$SEL_ACCT' got a GPU but the kernel did not reach step=OK (real error, see log)"; exit 1; }
          # PERSIST the embedded shard DB to the SELECTED account's resume/output dataset
          # (creds stay in CI, never in the kernel). shard/RESUME_DS were set by dispatch on
          # the winning account, so this lands in that account's namespace. The DB is BOTH
          # the resume point for the next dispatch AND the consumable output the bake folds.
          db="$(find out -name '3gpp-embedded.duckdb' | head -1)"
          if [ -n "$db" ] && [ -s "$db" ]; then
            rm -rf state && mkdir -p state && cp "$db" state/3gpp-embedded.duckdb
            printf '{"title":"3gpp rust embedded %s","id":"%s","licenses":[{"name":"CC0-1.0"}]}\n' "$shard" "$RESUME_DS" > state/dataset-metadata.json
            if kaggle datasets status "$RESUME_DS" >/dev/null 2>&1; then
              kaggle datasets version -p state -m "shard=$shard embedded" --dir-mode zip || echo "::warning::dataset version failed (resume not saved)"
            else
              kaggle datasets create -p state --dir-mode zip || echo "::warning::dataset create failed (resume not saved)"
            fi
            echo "persisted resume/output dataset: $RESUME_DS"
          else
            echo "::error::no embedded DB in kernel output — vectors NOT persisted (resume impossible)"; exit 1
          fi
      # Stage the embedded sub-base as a SERIES-KEYED vec artifact so publish-vec can
      # ORAS-push it to 3gpp-vec — the SAME contract the (now-retired) corpus-embed-kaggle
      # used. ONLY for a single 2-digit series dispatch (the orchestrator's mode); lot/release
      # runs keep their multi-series sub-base in the Kaggle Dataset only (not series-keyable).
      - name: Stage sub-base under its series-keyed name (if any)
        if: always()
        run: |
          s="${{ github.event.inputs.series }}"
          if ! printf '%s' "$s" | grep -qE '^[0-9]{2}$'; then
            echo "not a single 2-digit series ($s) — no vec artifact (Dataset-only)"; exit 0
          fi
          src="$(find out -name '3gpp-embedded.duckdb' 2>/dev/null | head -1 || true)"
          if [ -n "$src" ] && [ -s "$src" ]; then
            mkdir -p stage-vec
            ln "$src" "stage-vec/s$s.duckdb" 2>/dev/null || cp "$src" "stage-vec/s$s.duckdb"
            ls -la stage-vec/
          else
            echo "no embedded sub-base found for series $s (nothing to stage)"
          fi
      - name: Upload vec sub-base artifact (if any)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vec-s${{ github.event.inputs.series }}
          path: stage-vec/s${{ github.event.inputs.series }}.duckdb
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload RESULT + log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-rust-embed-${{ github.event.inputs.series || github.event.inputs.lot || 'all' }}
          path: |
            out/RESULT.txt
            out/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---- publish-vec: ORAS-push the staged sub-base to GHCR 3gpp-vec (ADDITIVE, never
  # clobber) — the proven contract ported from the now-RETIRED corpus-embed-kaggle, so the
  # autonomous dense campaign actually reaches the served channel. fp16 is FIXED: the Rust
  # kernel always converts the model to fp16 in-kernel and the served data-image bake is
  # fp16, so the EmbedIdentity matches (an fp16 corpus + fp32 query is refused at serve). ----
  publish-vec:
    needs: rust-embed
    if: ${{ github.event.inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      ORAS_VERSION: "1.2.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: vec-s*
      - name: Install zstd + jq + ORAS (pinned)
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends zstd jq
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          oras version
      - name: Merge with the existing channel, then push (ADDITIVE — never clobber)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c 'echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin'
          # fp16 FIXED (see job header): publish to the fp16 channel the bake consumes.
          PREC="fp16"; TAG="latest-$PREC"; MODEL="bge-m3-$PREC"
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-vec:$TAG"
          echo "publishing to $REF (embedding_model=$MODEL)"
          mkdir -p vec
          # 1) Seed vec/ from the EXISTING channel so OTHER series' sub-bases survive a
          #    single-series re-publish (absent → first publish, start empty).
          if RETRY_MAX=2 retry oras pull "$REF" -o vec 2>/dev/null; then
            echo "pulled existing channel:"; ls -1 vec || true
          else
            echo "no existing channel — first publish"
          fi
          existing='[]'
          if [ -f vec/vec-manifest.json ]; then
            existing="$(jq -c '[(.sub_bases // [])[] | select(. != "3gpp-embedded.duckdb")]' vec/vec-manifest.json)"
          fi
          rm -f vec/3gpp-embedded.duckdb.zst vec/vec-manifest.json
          # 2) Overlay THIS run's shard as s<series>.duckdb.zst (series from the filename).
          new='[]'
          found=0
          while IFS= read -r f; do
            found=$((found+1))
            base="$(basename "$f" .duckdb)"
            if printf '%s' "$base" | grep -qE '^s[0-9]{2}$'; then
              s="${base#s}"
            else
              d="$(basename "$(dirname "$f")")"
              s="${d#vec-s}"
              if ! printf '%s' "$s" | grep -qE '^[0-9]{2}$'; then
                echo "::warning::cannot derive a series for $f — skipped"; continue
              fi
            fi
            # Refuse to fold an invalid/empty artifact (DUCK magic at offset 8); the existing
            # channel copy survives via the union below.
            if [ "$(dd if="$f" bs=1 skip=8 count=4 2>/dev/null)" != "DUCK" ]; then
              echo "::warning::series $s artifact is not a valid DuckDB ($f) — NOT published"; continue
            fi
            zstd -19 -T0 -f "$f" -o "vec/s$s.duckdb.zst"
            new="$(printf '%s' "$new" | jq --arg n "s$s.duckdb" '. + [$n]')"
          done < <(find shards -name '*.duckdb' 2>/dev/null | sort)
          processed="$(printf '%s' "$new" | jq 'length')"
          echo "shards found=$found processed=$processed"
          if [ "$found" -eq 0 ]; then
            echo "::notice::no fresh sub-bases in this run — channel left untouched (no re-push)"; exit 0
          fi
          if [ "$processed" -eq 0 ]; then
            echo "::error::$found shard artifact(s) downloaded but NONE processed — refusing to silently re-push"; exit 1
          fi
          # 3) Union existing ∪ new (new wins), keeping only entries whose .zst exists.
          subs="$(jq -cn --argjson e "$existing" --argjson n "$new" '($e + $n) | unique')"
          present="$(cd vec && ls -1 ./*.duckdb.zst 2>/dev/null | sed 's#^\./##; s#\.zst$##' | jq -R . | jq -cs .)"
          subs="$(jq -cn --argjson s "$subs" --argjson p "$present" '[ $s[] | select(. as $x | $p | any(. == $x)) ]')"
          printf '%s' "$subs" | jq --arg model "$MODEL" '{embedding_model:$model, embed_floor:"", sub_bases:.}' > vec/vec-manifest.json
          cat vec/vec-manifest.json
          test "$(jq '.sub_bases|length' vec/vec-manifest.json)" -gt 0 || { echo "::error::no sub-bases to publish"; exit 1; }
          # 4) Push the MERGED set (existing survivors + this run's series).
          cd vec
          args="vec-manifest.json:application/json"
          for z in *.duckdb.zst; do args="$args $z:application/zstd"; done
          retry oras push "$REF" \
            --artifact-type application/vnd.kodflow.3gpp-vec.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            $args
      # ANTI-LEAK, fail-loud: 3gpp-vec sub-bases carry verbatim clause TEXT → must be PRIVATE.
      - name: Assert 3gpp-vec is PRIVATE (self-heal then fail-loud)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-vec" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-vec visibility: $vis"
          if [ "$vis" = "public" ]; then
            echo "::warning::3gpp-vec is PUBLIC — attempting self-heal to private"
            gh api -X PATCH "/user/packages/container/3gpp-vec/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-vec" --jq '.visibility' 2>/dev/null || echo absent)"
          fi
          [ "$vis" = "private" ] || { echo "::error::3gpp-vec is '$vis' (must be private — verbatim 3GPP clause text). Fix in UI: Packages → 3gpp-vec → Settings → Change visibility."; exit 1; }
