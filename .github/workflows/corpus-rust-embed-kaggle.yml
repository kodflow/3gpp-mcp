# =============================================================================
#  Corpus · Rust embed (Kaggle GPU)   — the RUST dense campaign (replaces Go embed)
# =============================================================================
#  WHAT it does    Dispatches scripts/kaggle/kernel-rust-embed.py to Kaggle GPU: pulls
#                  the private GHCR 3gpp-corpus base, slices this shard (one SERIES or an
#                  explicit EMBED_RELEASES set), downloads BGE-M3 from HF, builds the Go
#                  bridge (cmd/embed-io) + the Rust embedder crate (ort CUDA EP → T4),
#                  then embed-io export → embedder (live progress bar) → embed-io import
#                  --build-hnsw, and versions the embedded DB + the vecs.jsonl RESUME
#                  ledger back to a per-shard Kaggle Dataset. This is the Rust path the
#                  mandate asks for; the Go corpus-embed-kaggle.yml stays for fallback.
#
#  WHEN it runs    MANUAL (workflow_dispatch) ONLY. One dispatch = one shard, BOUNDED and
#                  RESUMABLE (the vecs.jsonl ledger skips already-embedded chunk_ids), so
#                  re-dispatch the same shard until RESULT shows null_after=0.
#
#  ⚠ UNVALIDATED   A real run needs a phone-verified Kaggle account (GPU + Internet),
#                  KAGGLE_API_TOKEN + KAGGLE_USERNAME, and a GHCR read token
#                  (GHCR_READ_PAT / GHCR_PAT) for the private base pull. Dormant by
#                  default — nothing fires this automatically.
# =============================================================================
name: Corpus · Rust embed (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      series:
        description: "2-digit series to embed this shard (e.g. 23). Empty when using releases."
        required: false
        default: ""
      embed_releases:
        description: "Explicit release set (comma-separated, e.g. 'Rel-19,Rel-18') instead of a series shard. Empty = use series."
        required: false
        default: ""
      lot:
        description: "Short lot tag (A/B/…) naming the resume Dataset when using a release set."
        required: false
        default: ""
      batch:
        description: "Clauses per ONNX batch on the GPU."
        required: false
        default: "64"
      limit:
        description: "Cap clauses embedded this session (0 = all). Set small (e.g. 1000) for a fast GPU/throughput diagnostic."
        required: false
        default: "0"

concurrency:
  group: corpus-rust-embed-kaggle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PAT: ${{ secrets.GHCR_READ_PAT || secrets.GHCR_PAT }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Guard — secrets present
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::KAGGLE_API_TOKEN not set (Settings → API → Generate New Token)."; exit 1; }
          [ -n "$KAGGLE_USER" ]      || { echo "::error::KAGGLE_USERNAME not set (repo variable or secret) — namespaces the kernel slug."; exit 1; }
          [ -n "$GHCR_PAT" ]         || { echo "::error::GHCR_READ_PAT/GHCR_PAT not set — needed to pull the private base."; exit 1; }
      - name: Install kaggle CLI (pin 2.2.0 — access-token auth)
        run: |
          pipx install 'kaggle==2.2.0' || pip install --user 'kaggle==2.2.0'
          kaggle --version
      - name: Stage + run kernel-rust-embed.py (GPU, resumable)
        env:
          SERIES: ${{ github.event.inputs.series }}
          EMBED_RELEASES: ${{ github.event.inputs.embed_releases }}
          LOT: ${{ github.event.inputs.lot }}
          EMBED_BATCH: ${{ github.event.inputs.batch }}
          EMBED_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rust-embed-kernel"; mkdir -p "$dir"
          # Kaggle slugifies the TITLE (lowercase + dashes) and REQUIRES it to resolve to
          # the metadata id, else `kernels push` 409s. So lowercase the shard and build the
          # title from it ("3gpp rust embed 23" → slug "3gpp-rust-embed-23" == id).
          shard="$(printf '%s' "${SERIES:-${LOT:-all}}" | tr '[:upper:]' '[:lower:]')"
          slug="${KAGGLE_USER}/3gpp-rust-embed-${shard}"
          # Generated kernel = env prepend (GHCR token reaches crane; kernel stays
          # is_private:true so the token is never exposed) + the committed kernel body.
          {
            echo "import os"
            echo "os.environ.setdefault('GHCR_OWNER', '${GHCR_OWNER}')"
            echo "os.environ.setdefault('GHCR_PAT', '${GHCR_PAT}')"
            echo "os.environ.setdefault('BRANCH', '${BRANCH}')"
            echo "os.environ.setdefault('SERIES', '${SERIES:-21}')"
            echo "os.environ.setdefault('EMBED_RELEASES', '${EMBED_RELEASES}')"
            echo "os.environ.setdefault('LOT', '${LOT}')"
            echo "os.environ.setdefault('EMBED_BATCH', '${EMBED_BATCH:-64}')"
            echo "os.environ.setdefault('EMBED_LIMIT', '${EMBED_LIMIT:-0}')"
            cat scripts/kaggle/kernel-rust-embed.py
          } > "$dir/kernel.py"
          printf '{\n "id": "%s",\n "title": "3gpp rust embed %s",\n "code_file": "kernel.py",\n "language": "python",\n "kernel_type": "script",\n "is_private": true,\n "enable_gpu": true,\n "enable_internet": true,\n "dataset_sources": [],\n "competition_sources": [],\n "kernel_sources": []\n}\n' "$slug" "$shard" > "$dir/kernel-metadata.json"
          kaggle kernels push -p "$dir" --accelerator NvidiaTeslaT4
          # Let the NEW version enter "running" before polling: re-pushing an existing
          # slug leaves the PRIOR version's terminal status visible for a few seconds, so
          # an immediate poll sees a stale "complete"/"error", breaks, and pulls the old
          # (or empty) output — the 7-second false-failure we hit. Wait it out first.
          echo "waiting 90s for the new kernel version to start…"; sleep 90
          # Poll until terminal. The CLI exit code is unreliable, so parse the status and
          # ECHO it every iteration (a stuck poll must be diagnosable — the first version
          # hung 40 min because no pattern matched). running/queued → wait; complete → done;
          # error/cancel/fail/not-found → stop; unknown → wait but BOUNDED by the cap.
          done_poll=""
          for i in $(seq 1 400); do
            st="$(kaggle kernels status "$slug" 2>&1 || true)"
            echo "poll $i: $st"
            case "$st" in
              *running*|*RUNNING*|*queued*|*QUEUED*) sleep 30; continue ;;
              *complete*|*COMPLETE*) echo "kernel complete"; done_poll=1; break ;;
              *error*|*ERROR*|*cancel*|*CANCEL*|*fail*|*FAIL*|*"not found"*|*404*) echo "::warning::kernel ended: $st"; done_poll=1; break ;;
              *) sleep 30 ;;
            esac
          done
          [ -n "$done_poll" ] || echo "::warning::poll cap reached without a terminal status — pulling output anyway"
          mkdir -p out
          for a in 1 2 3 4; do
            kaggle kernels output "$slug" -p out && break
            echo "output pull attempt $a failed — retrying"; sleep 15
          done
          echo "=== KERNEL LOG (tail) ==="; tail -n 120 out/*.log 2>/dev/null || echo "(no .log pulled)"
          echo "=== RESULT ==="; cat out/RESULT.txt 2>/dev/null || echo "(no RESULT.txt — see log above)"
          grep -q 'step=OK' out/RESULT.txt 2>/dev/null || { echo "::error::kernel did not reach step=OK (see log)"; exit 1; }
      - name: Upload RESULT + log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-rust-embed-${{ github.event.inputs.series || github.event.inputs.lot || 'all' }}
          path: |
            out/RESULT.txt
            out/*.log
          if-no-files-found: ignore
          retention-days: 7
