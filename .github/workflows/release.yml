# Release — single rolling "latest" GitHub Release, built with GoReleaser in a
# NATIVE per-OS matrix. CGO can't cross-compile DuckDB (its prebuilt libs are
# tied to each OS's C++ stdlib), so each runner builds its own targets with the
# native toolchain; a final job publishes every archive to the `latest` release
# (clobber). The DB asset (corpus-sync/corpus-matrix) is never touched here.
#
# Targets: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64.
# (windows/arm64 absent — DuckDB ships no windows-arm64 lib.)

name: Release (latest binaries)

on:
  push:
    branches: [main]
    # Only when the SHIPPED binary's sources change. cmd/server is the only binary
    # GoReleaser builds, so a change to CI-only tooling (cmd/discover, cmd/embed, …)
    # must NOT rebuild identical binaries; internal/** stays (cmd/server imports it).
    paths: ["cmd/server/**", "internal/**", "go.mod", "go.sum", ".goreleaser*.yaml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read # build is read-only; only publish elevates (per-job)

concurrency:
  group: release-latest
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: .goreleaser.yaml
            id: linux
          - os: macos-14
            config: .goreleaser.darwin.yaml
            id: darwin
          - os: windows-latest
            config: .goreleaser.windows.yaml
            id: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install linux toolchains (native amd64 + GNU arm64 cross)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --skip=publish --clean --config ${{ matrix.config }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.id }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-*.txt
          retention-days: 1

  publish:
    needs: build
    # Never publish from a PR run — only real pushes / manual dispatch may
    # clobber the public 'latest' assets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only publish may write release assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish binaries to the rolling 'latest' release (clobber)
        run: |
          ls -lh dist/
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --latest \
              --title "latest" --notes "Rolling release — mcp-3gpp binaries + indexed 3GPP DB."
          gh release upload latest --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.zip dist/checksums-*.txt --clobber
