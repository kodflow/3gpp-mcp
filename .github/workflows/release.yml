# Release — single rolling "latest" GitHub Release. NO version tags, ever.
# One release holds the current binaries (linux/amd64, darwin/arm64) AND the
# indexed DB (published by corpus-sync). Each run *clobbers* its own assets;
# the release is never deleted (so it never wipes the DB asset), and old
# versions never accumulate — exactly one of each artifact exists.
#
# CGO can't cross-compile DuckDB/ONNX → build natively per-OS.

name: Release (latest binaries)

on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "go.mod", "go.sum", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config zstd
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Build + package
        run: |
          name="mcp-3gpp_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=latest-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" -o dist/mcp-3gpp ./cmd/server
          tar -C dist -cf - mcp-3gpp | zstd -19 -o "dist/${name}.tar.zst"
          rm dist/mcp-3gpp
          ( cd dist && shasum -a 256 "${name}.tar.zst" > "${name}.tar.zst.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload binaries to the rolling 'latest' release (clobber)
        run: |
          # Ensure the single 'latest' release exists; never delete it (would
          # wipe the DB asset published by corpus-sync). Only clobber binaries.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --latest \
              --title "latest" \
              --notes "Rolling release — current mcp-3gpp binaries + indexed 3GPP DB. Always exactly one version; assets are replaced in place."
          gh release upload latest dist/*.tar.zst dist/*.sha256 --clobber
