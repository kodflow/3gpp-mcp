# Release — on tag v*, build the mcp-3gpp binary natively per-OS (CGO can't
# cross-compile DuckDB/ONNX cleanly) and attach tar.zst + .sha256 to a GitHub
# Release. V1 targets: linux/amd64 + darwin/arm64.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config zstd
      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Build + package
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          name="mcp-3gpp_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${ver}" -o "dist/mcp-3gpp" ./cmd/server
          tar -C dist -cf - mcp-3gpp | zstd -19 -o "dist/${name}.tar.zst"
          ( cd dist && shasum -a 256 "${name}.tar.zst" > "${name}.tar.zst.sha256" )
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.zst
            dist/*.sha256
