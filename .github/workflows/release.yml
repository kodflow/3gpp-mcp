# Release — single rolling "latest" GitHub Release, built with GoReleaser in a
# NATIVE per-OS matrix. CGO can't cross-compile DuckDB (its prebuilt libs are
# tied to each OS's C++ stdlib), so each runner builds its own targets with the
# native toolchain; a final job publishes every archive to the `latest` release
# (clobber). The DB asset (corpus-sync/corpus-matrix) is never touched here.
#
# Targets: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64.
# (windows/arm64 absent — DuckDB ships no windows-arm64 lib.)

name: Release (latest binaries)

on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "go.mod", "go.sum", ".goreleaser*.yaml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: .goreleaser.yaml
            id: linux
          - os: macos-14
            config: .goreleaser.darwin.yaml
            id: darwin
          - os: windows-latest
            config: .goreleaser.windows.yaml
            id: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install linux toolchains (native amd64 + GNU arm64 cross)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --skip=publish --clean --config ${{ matrix.config }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.id }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-*.txt
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish binaries to the rolling 'latest' release (clobber)
        run: |
          ls -lh dist/
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --latest \
              --title "latest" --notes "Rolling release — mcp-3gpp binaries + indexed 3GPP DB."
          gh release upload latest --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.zip dist/checksums-*.txt --clobber
