# =============================================================================
#  Corpus · Embed (Kaggle GPU)      — PR-11b, DEDICATED semantic-vector campaign
# =============================================================================
#  WHAT it does    Drives the sharded BGE-M3 embed campaign on Kaggle's free GPU,
#                  one kernel per SERIES, RESUMABLE across the 12h cap, then
#                  publishes the per-series vectorized sub-bases to GHCR 3gpp-vec.
#
#  WHEN it runs    MANUAL ONLY (workflow_dispatch). Optionally on a cron to keep
#                  nibbling the weekly Kaggle quota — DISABLED by default.
#
#  DECOUPLING      This NEVER builds or republishes the lexical DB. It CONSUMES the
#                  immutable `latest` lexical Release (the resume baseline) and only
#                  writes the GHCR 3gpp-vec semantic channel. Lexical = corpus-matrix.yml.
#
#  CREDENTIALS     KAGGLE_API_TOKEN repository secret — the modern access token
#                  (KGAT_… from Settings → API → "Generate New Token"). The rewritten
#                  kaggle CLI (2.x) DROPPED the old KAGGLE_USERNAME/KAGGLE_KEY env
#                  auth; it reads KAGGLE_API_TOKEN directly (or ~/.kaggle/access_token)
#                  and introspects it server-side. KAGGLE_USERNAME is still consumed,
#                  but only as the handle that namespaces the kernel/dataset slugs
#                  (KAGGLE_USER), never for auth. Creds are never written into a kernel.
#
#  ⚠ UNVALIDATED   A real run needs a phone-verified Kaggle account (GPU + Internet),
#                  the KAGGLE_API_TOKEN secret, and KAGGLE_USERNAME (the handle). The
#                  kernel runs up to ~12h on Kaggle, longer
#                  than a GitHub runner's 6h cap, so each job is time-boxed and the
#                  campaign resumes on the next dispatch (lossless via embedding_hash).
# =============================================================================
name: Corpus · Embed (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      series_list:
        description: "Space-separated series, priority order (empty = driver default, core-network first)"
        required: false
        default: ""
      embed_floor:
        description: "Release floor to embed (vectors are recent-only; lexical unaffected). First campaign: Rel-17 (Rel-17..20); a later MR lowers it toward Rel-99."
        required: false
        default: "Rel-17"
      max_retries:
        description: "Per-series ERROR retries before moving on"
        required: false
        default: "3"
      runner_minutes:
        description: "Per-series GitHub-runner time box (< 360, the runner cap). Resume continues next dispatch."
        required: false
        default: "330"
      publish:
        description: "Push the pulled sub-bases to GHCR 3gpp-vec:latest when done. Default true — there is no point spending GPU on an embed you don't publish. Set false only for a throwaway shakedown."
        required: false
        default: "true"
  # Keep nibbling the weekly Kaggle quota unattended. Disabled by default — uncomment
  # and rely on Kaggle Secrets attached to the kernels for self-versioning.
  # schedule:
  #   - cron: "17 3 * * *"

concurrency:
  group: corpus-embed-kaggle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- plan: turn the series list into a matrix (recent-first is handled inside
  # the kernel via --order recent; this is the per-series fan-out). --------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SERIES_LIST: ${{ github.event.inputs.series_list }}
        run: |
          list="${SERIES_LIST:-23 24 29 33 38 21 22 25 26 27 28 31 32 35 36 37}"
          json="[]"
          for s in $list; do json=$(printf '%s' "$json" | python3 -c "import json,sys;a=json.load(sys.stdin);a.append('$s');print(json.dumps(a))"); done
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "series matrix: $json"

  # ---- embed: one job per series, ≤2 concurrent (Kaggle ~2 GPU sessions). Each
  # drives kaggle-rel15-20.sh, time-boxed under the runner cap; a box-out leaves a
  # resumable Dataset for the next dispatch. continue-on-error so one stuck series
  # never sinks the matrix. --------------------------------------------------------
  embed:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Modern access-token auth (kaggle CLI 2.x). The CLI reads KAGGLE_API_TOKEN
      # directly and introspects it; KAGGLE_USER is only the slug namespace handle.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: ${{ secrets.KAGGLE_USERNAME }}
      EMBED_FLOOR: ${{ github.event.inputs.embed_floor }}
      MAX_RETRIES: ${{ github.event.inputs.max_retries }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Guard — secrets present
        run: |
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::error::KAGGLE_API_TOKEN secret is not set. Generate one at https://www.kaggle.com/settings/api → 'Generate New Token' (KGAT_…) and add it under Settings → Secrets and variables → Actions. See docs/automation/kaggle-rel15-20-ci.md."
            exit 1
          fi
          if [ -z "${KAGGLE_USER}" ]; then
            echo "::error::KAGGLE_USERNAME secret is not set — needed as the handle that namespaces the kernel/dataset slugs."
            exit 1
          fi
      - name: Install kaggle CLI (pin 2.2.0 — access-token auth)
        run: |
          pipx install 'kaggle==2.2.0' || pip install --user 'kaggle==2.2.0'
          kaggle --version
      - name: Drive series ${{ matrix.series }} (time-boxed; resumes next dispatch)
        run: |
          mins="${{ github.event.inputs.runner_minutes }}"
          timeout "${mins:-330}m" scripts/kaggle-rel15-20.sh one "${{ matrix.series }}" || \
            echo "::notice::series ${{ matrix.series }} timed out / incomplete — resume on next dispatch (lossless)"
      - name: Upload pulled sub-base (if any)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vec-s${{ matrix.series }}
          path: .kaggle-campaign/out-${{ matrix.series }}/**/*.duckdb
          if-no-files-found: ignore
          retention-days: 7

  # ---- publish-vec: ORAS-push the pulled sub-bases to the rolling GHCR semantic
  # channel (same contract corpus-matrix.yml uses). Gated on the publish input. ----
  publish-vec:
    needs: embed
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      ORAS_VERSION: "1.2.0"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: vec-s*
          # NO merge-multiple: every shard's file is named 3gpp-embedded.duckdb, so
          # merging would collide across series. Keep each artifact in its own dir
          # (shards/vec-s<NN>/) and key the sub-base by the dir's series number.
      - name: Install zstd + jq + ORAS (pinned)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zstd jq
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version
      - name: Merge with the existing channel, then push (ADDITIVE — never clobber)
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-vec:latest"
          mkdir -p vec
          # 1) Seed vec/ from the EXISTING channel so OTHER series' sub-bases survive a
          #    single-series re-publish (absent → first publish, start empty).
          if oras pull "$REF" -o vec 2>/dev/null; then
            echo "pulled existing channel:"; ls -1 vec || true
          else
            echo "no existing channel — first publish"
          fi
          existing='[]'
          if [ -f vec/vec-manifest.json ]; then
            # Drop the legacy collision-prone name; the new scheme is s<NN>.duckdb.
            existing="$(jq -c '[(.sub_bases // [])[] | select(. != "3gpp-embedded.duckdb")]' vec/vec-manifest.json)"
          fi
          rm -f vec/3gpp-embedded.duckdb.zst vec/vec-manifest.json
          # 2) Overlay THIS run's shards as s<series>.duckdb.zst (series from the dir name).
          new='[]'
          for d in shards/vec-s*/; do
            [ -d "$d" ] || continue
            s="$(basename "$d" | sed 's/^vec-s//')"
            f="$(find "$d" -name '*.duckdb' | head -1)"; [ -n "$f" ] || continue
            zstd -19 -T0 -f "$f" -o "vec/s$s.duckdb.zst"
            new="$(printf '%s' "$new" | jq --arg n "s$s.duckdb" '. + [$n]')"
          done
          # 3) Union existing ∪ new (new wins on dup), keeping only entries whose .zst exists.
          subs="$(jq -cn --argjson e "$existing" --argjson n "$new" '($e + $n) | unique')"
          present="$(cd vec && ls -1 ./*.duckdb.zst 2>/dev/null | sed 's#^\./##; s#\.zst$##' | jq -R . | jq -cs .)"
          subs="$(jq -cn --argjson s "$subs" --argjson p "$present" '[ $s[] | select(. as $x | $p | any(. == $x)) ]')"
          printf '%s' "$subs" | jq \
            --arg floor "${{ github.event.inputs.embed_floor }}" \
            '{embedding_model:"bge-m3", embed_floor:$floor, sub_bases:.}' > vec/vec-manifest.json
          cat vec/vec-manifest.json
          test "$(jq '.sub_bases|length' vec/vec-manifest.json)" -gt 0 || { echo "::error::no sub-bases to publish"; exit 1; }
          # 4) Push the MERGED set (existing survivors + this run's series).
          cd vec
          args="vec-manifest.json:application/json"
          for z in *.duckdb.zst; do args="$args $z:application/zstd"; done
          oras push "$REF" \
            --artifact-type application/vnd.kodflow.3gpp-vec.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            $args
      - name: Upload artifact (vectorized sub-bases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-vec
          path: vec/
          retention-days: 7
