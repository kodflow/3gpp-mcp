# =============================================================================
#  Corpus · Embed (Kaggle GPU)      — PR-11b, DEDICATED semantic-vector campaign
# =============================================================================
#  WHAT it does    Drives the sharded BGE-M3 embed campaign on Kaggle's free GPU,
#                  one kernel per SERIES, RESUMABLE across the 12h cap, then
#                  publishes the per-series vectorized sub-bases to GHCR 3gpp-vec.
#
#  WHEN it runs    MANUAL ONLY (workflow_dispatch). Optionally on a cron to keep
#                  nibbling the weekly Kaggle quota — DISABLED by default.
#
#  DECOUPLING      This NEVER builds or republishes the lexical DB. It CONSUMES the
#                  immutable `latest` lexical Release (the resume baseline) and only
#                  writes the GHCR 3gpp-vec semantic channel. Lexical = corpus-matrix.yml.
#
#  CREDENTIALS     KAGGLE_API_TOKEN repository secret — the modern access token
#                  (KGAT_… from Settings → API → "Generate New Token"). The rewritten
#                  kaggle CLI (2.x) DROPPED the old KAGGLE_USERNAME/KAGGLE_KEY env
#                  auth; it reads KAGGLE_API_TOKEN directly (or ~/.kaggle/access_token)
#                  and introspects it server-side. KAGGLE_USERNAME is still consumed,
#                  but only as the handle that namespaces the kernel/dataset slugs
#                  (KAGGLE_USER), never for auth. Creds are never written into a kernel.
#
#  ⚠ UNVALIDATED   A real run needs a phone-verified Kaggle account (GPU + Internet),
#                  the KAGGLE_API_TOKEN secret, and KAGGLE_USERNAME (the handle). The
#                  kernel runs up to ~12h on Kaggle, longer
#                  than a GitHub runner's 6h cap, so each job is time-boxed and the
#                  campaign resumes on the next dispatch (lossless via embedding_hash).
# =============================================================================
name: Corpus · Embed (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      series_list:
        description: "Space-separated series, priority order (empty = driver default, core-network first)"
        required: false
        default: ""
      embed_floor:
        description: "Release floor to embed (vectors are recent-only; lexical unaffected). Rel-99 = all real releases (R99..R20). Rel-17 = R17..R20 only."
        required: false
        default: "Rel-99"
      precision:
        description: "fp16 (default; ~2-6x on T4 Tensor Cores, converted in-kernel from the pinned fp32 ONNX) or fp32 (slower, the proven baseline). Switching precision re-embeds (EmbedIdentity flips)."
        required: false
        default: "fp16"
      accelerator:
        description: "Kaggle GPU to request: NvidiaTeslaT4 (default; fp16 Tensor Cores) or NvidiaTeslaP100."
        required: false
        default: "NvidiaTeslaT4"
      max_retries:
        description: "Per-series ERROR retries before moving on"
        required: false
        default: "3"
      runner_minutes:
        description: "Per-series GitHub-runner time box (< 360, the runner cap). Resume continues next dispatch."
        required: false
        default: "330"
      publish:
        description: "Push the pulled sub-bases to GHCR 3gpp-vec:latest when done. Default true — there is no point spending GPU on an embed you don't publish. Set false only for a throwaway shakedown."
        required: false
        default: "true"
      kaggle_account:
        description: "Kaggle account to try FIRST (the other is the automatic fallback; run stops only if BOTH fail auth)."
        required: false
        default: "primary"
        type: choice
        options: [primary, fallback]
  # Keep nibbling the weekly Kaggle quota unattended. Disabled by default — uncomment
  # and rely on Kaggle Secrets attached to the kernels for self-versioning.
  # schedule:
  #   - cron: "17 3 * * *"

concurrency:
  group: corpus-embed-kaggle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- plan: turn the series list into a matrix (recent-first is handled inside
  # the kernel via --order recent; this is the per-series fan-out). --------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SERIES_LIST: ${{ github.event.inputs.series_list }}
        run: |
          list="${SERIES_LIST:-23 24 29 33 38 21 22 25 26 27 28 31 32 35 36 37}"
          json="[]"
          for s in $list; do json=$(printf '%s' "$json" | python3 -c "import json,sys;a=json.load(sys.stdin);a.append('$s');print(json.dumps(a))"); done
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "series matrix: $json"

  # ---- embed: one job per series, ≤2 concurrent (Kaggle ~2 GPU sessions). Each
  # drives kaggle-embed-campaign.sh, time-boxed under the runner cap; a box-out leaves a
  # resumable Dataset for the next dispatch. continue-on-error so one stuck series
  # never sinks the matrix. --------------------------------------------------------
  embed:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Modern access-token auth (kaggle CLI 2.x). Two accounts: the drive step below loops
      # over them (order = KAGGLE_ACCOUNT), auth-probes each, and on GPU-quota exhaustion
      # falls back to the other; it stops only if NO account gets a GPU.
      # scripts/kaggle-gpu-check.sh classifies a run as gpu vs quota (KAGGLE_USER = handle).
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_API_TOKEN_FALLBACK: ${{ secrets.KAGGLE_API_TOKEN_FALLBACK }}
      # The handle is NOT sensitive, so it may live as a repo VARIABLE (preferred) or a
      # secret. Read the variable first; fall back to the secret.
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_USERNAME_FALLBACK: ${{ vars.KAGGLE_USERNAME_FALLBACK || secrets.KAGGLE_USERNAME_FALLBACK }}
      KAGGLE_ACCOUNT: ${{ github.event.inputs.kaggle_account || 'primary' }}
      EMBED_FLOOR: ${{ github.event.inputs.embed_floor }}
      EMBED_PRECISION: ${{ github.event.inputs.precision }}
      KAGGLE_ACCELERATOR: ${{ github.event.inputs.accelerator }}
      MAX_RETRIES: ${{ github.event.inputs.max_retries }}
      BRANCH: ${{ github.ref_name }}
      # Read-scoped GHCR token for the kernel's fresh-slice base pull (private
      # 3gpp-corpus image). Prefer a dedicated read:packages-only GHCR_READ_PAT;
      # fall back to GHCR_PAT so the loop works before the read-only token is added.
      # A resume-only dispatch never pulls the base, so this can be empty then.
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PAT: ${{ secrets.GHCR_READ_PAT || secrets.GHCR_PAT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install kaggle CLI (pin 2.2.0 — access-token auth)
        run: |
          pipx install 'kaggle==2.2.0' || pip install --user 'kaggle==2.2.0'
          kaggle --version
      - name: Drive series ${{ matrix.series }} on Kaggle GPU (auto-fallback on quota)
        run: |
          set -uo pipefail
          # Two-account GPU fallback (see corpus-rust-embed-kaggle.yml): run the series on
          # the first account; if it got NO GPU (weekly quota exhausted → the kernel logs
          # gpu=absent / the session errors with no output, scripts/kaggle-gpu-check.sh
          # reports "quota") automatically re-drive it on the other account. Stop only if
          # NO account is granted a GPU. The driver is resumable, so a fallback re-drive
          # continues from the account's own state (idempotent via embedding_hash).
          PRIM_TOK="${KAGGLE_API_TOKEN:-}"; PRIM_USER="${KAGGLE_USERNAME:-}"
          FB_TOK="${KAGGLE_API_TOKEN_FALLBACK:-}"; FB_USER="${KAGGLE_USERNAME_FALLBACK:-}"
          case "${KAGGLE_ACCOUNT:-primary}" in
            fallback) ORDER="fallback primary" ;;
            *) ORDER="primary fallback" ;;
          esac
          series="${{ matrix.series }}"
          mins="${{ github.event.inputs.runner_minutes }}"
          got_gpu=0
          for acct in $ORDER; do
            case "$acct" in
              primary)  export KAGGLE_API_TOKEN="$PRIM_TOK" KAGGLE_USER="$PRIM_USER" ;;
              fallback) export KAGGLE_API_TOKEN="$FB_TOK"   KAGGLE_USER="$FB_USER" ;;
            esac
            if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USER" ]; then
              echo "account '$acct' not configured (token/username empty) — skipping"; continue
            fi
            echo "::group::Kaggle account=$acct user=$KAGGLE_USER (series $series)"
            if ! kaggle kernels list -m -p 1 >/dev/null 2>&1; then
              echo "::warning::account '$acct' auth failed — trying next"; echo "::endgroup::"; continue
            fi
            rm -rf ".kaggle-campaign/out-$series"
            timeout "${mins:-330}m" scripts/kaggle-embed-campaign.sh one "$series" \
              || echo "::notice::series $series timed out / incomplete on account '$acct' (judging by GPU marker)"
            status="$(bash scripts/kaggle-gpu-check.sh ".kaggle-campaign/out-$series" 2>/dev/null || echo quota)"
            echo "account '$acct' gpu-check=$status"; echo "::endgroup::"
            if [ "$status" = gpu ]; then echo "GPU obtained on account '$acct' for series $series"; got_gpu=1; break; fi
            echo "::warning::account '$acct' got NO GPU (quota) for series $series — falling back to the next account"
          done
          [ "$got_gpu" = 1 ] || { echo "::error::no Kaggle account had GPU quota for series $series — stopping"; exit 1; }
      # Stage the sub-base under its SERIES-KEYED filename before upload:
      # download-artifact extracts a SINGLE matched artifact directly into the
      # destination (no per-artifact dir), so a one-series dispatch used to land
      # a bare 3gpp-embedded.duckdb whose series was unrecoverable — publish-vec
      # silently skipped it and re-pushed the seeded channel copy (the s31 heal
      # no-op). With s<NN>.duckdb the series travels IN the filename.
      - name: Stage sub-base under its series-keyed name (if any)
        if: always()
        run: |
          src="$(find .kaggle-campaign/out-${{ matrix.series }} -name '*.duckdb' 2>/dev/null | head -1 || true)"
          if [ -n "$src" ]; then
            mkdir -p stage-vec
            ln "$src" "stage-vec/s${{ matrix.series }}.duckdb" 2>/dev/null \
              || cp "$src" "stage-vec/s${{ matrix.series }}.duckdb"
            ls -la stage-vec/
          else
            echo "no sub-base pulled for series ${{ matrix.series }} (nothing to upload)"
          fi
      - name: Upload pulled sub-base (if any)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vec-s${{ matrix.series }}
          path: stage-vec/s${{ matrix.series }}.duckdb
          if-no-files-found: ignore
          retention-days: 7

  # ---- publish-vec: ORAS-push the pulled sub-bases to the rolling GHCR semantic
  # channel (same contract corpus-matrix.yml uses). Gated on the publish input. ----
  publish-vec:
    needs: embed
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      ORAS_VERSION: "1.2.0"
      EMBED_PRECISION: ${{ github.event.inputs.precision }}
    steps:
      # checkout so the run: steps can source scripts/lib/retry.sh (shared backoff).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: vec-s*
          # NO merge-multiple: every shard's file is named 3gpp-embedded.duckdb, so
          # merging would collide across series. Keep each artifact in its own dir
          # (shards/vec-s<NN>/) and key the sub-base by the dir's series number.
      - name: Install zstd + jq + ORAS (pinned)
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends zstd jq
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          oras version
      - name: Merge with the existing channel, then push (ADDITIVE — never clobber)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c 'echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin'
          # Channel + manifest model are PRECISION-SCOPED so fp16 and fp32 sub-bases
          # can never share one OCI tag (and thus one HNSW): an fp16 corpus and an
          # fp32 query must never mix (EmbedIdentity invariant). fp32 keeps :latest.
          PREC="${EMBED_PRECISION:-fp32}"
          if [ "$PREC" = fp32 ]; then TAG="latest"; MODEL="bge-m3"; else TAG="latest-$PREC"; MODEL="bge-m3-$PREC"; fi
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-vec:$TAG"
          echo "publishing to $REF (embedding_model=$MODEL)"
          mkdir -p vec
          # 1) Seed vec/ from the EXISTING channel so OTHER series' sub-bases survive a
          #    single-series re-publish (absent → first publish, start empty).
          if RETRY_MAX=2 retry oras pull "$REF" -o vec 2>/dev/null; then
            echo "pulled existing channel:"; ls -1 vec || true
          else
            echo "no existing channel — first publish"
          fi
          existing='[]'
          if [ -f vec/vec-manifest.json ]; then
            # Drop the legacy collision-prone name; the new scheme is s<NN>.duckdb.
            existing="$(jq -c '[(.sub_bases // [])[] | select(. != "3gpp-embedded.duckdb")]' vec/vec-manifest.json)"
          fi
          rm -f vec/3gpp-embedded.duckdb.zst vec/vec-manifest.json
          # 2) Overlay THIS run's shards as s<series>.duckdb.zst (series from the dir name).
          new='[]'
          # Iterate over FILES, keyed by their series-keyed filename (s<NN>.duckdb),
          # NOT over per-artifact directories: download-artifact extracts a SINGLE
          # matched artifact flat into shards/ (no subdir), so the old
          # `for d in shards/vec-s*/` glob matched nothing on a one-series dispatch
          # and SILENTLY re-pushed the seeded channel copy (the s31 heal no-op).
          # Legacy layout (vec-s<NN>/3gpp-embedded.duckdb) stays accepted: the
          # series then comes from the parent dir name.
          found=0
          while IFS= read -r f; do
            found=$((found+1))
            base="$(basename "$f" .duckdb)"
            if printf '%s' "$base" | grep -qE '^s[0-9]{2}$'; then
              s="${base#s}"
            else
              d="$(basename "$(dirname "$f")")"
              s="${d#vec-s}"
              if ! printf '%s' "$s" | grep -qE '^[0-9]{2}$'; then
                echo "::warning::cannot derive a series for $f — skipped"
                continue
              fi
            fi
            # Refuse to fold an invalid/empty artifact into the channel: a flaky
            # `kernels output` pull once shipped an EMPTY s31 blob that poisoned
            # every downstream consumer (the image bake died mid-fusion on it).
            # The DUCK magic at offset 8 cheaply rejects garbage; the existing
            # channel copy survives (the union below keeps prior entries).
            if [ "$(dd if="$f" bs=1 skip=8 count=4 2>/dev/null)" != "DUCK" ]; then
              echo "::warning::series $s artifact is not a valid DuckDB ($f, $(stat -c%s "$f" 2>/dev/null || echo '?') bytes) — NOT published"
              continue
            fi
            zstd -19 -T0 -f "$f" -o "vec/s$s.duckdb.zst"
            new="$(printf '%s' "$new" | jq --arg n "s$s.duckdb" '. + [$n]')"
          done < <(find shards -name '*.duckdb' 2>/dev/null | sort)
          processed="$(printf '%s' "$new" | jq 'length')"
          echo "shards found=$found processed=$processed"
          if [ "$found" -eq 0 ]; then
            echo "::notice::no fresh sub-bases in this run — channel left untouched (no re-push)"
            exit 0
          fi
          if [ "$processed" -eq 0 ]; then
            echo "::error::$found shard artifact(s) downloaded but NONE processed — refusing to silently re-push the seeded channel"
            exit 1
          fi
          # 3) Union existing ∪ new (new wins on dup), keeping only entries whose .zst exists.
          subs="$(jq -cn --argjson e "$existing" --argjson n "$new" '($e + $n) | unique')"
          present="$(cd vec && ls -1 ./*.duckdb.zst 2>/dev/null | sed 's#^\./##; s#\.zst$##' | jq -R . | jq -cs .)"
          subs="$(jq -cn --argjson s "$subs" --argjson p "$present" '[ $s[] | select(. as $x | $p | any(. == $x)) ]')"
          printf '%s' "$subs" | jq \
            --arg floor "${{ github.event.inputs.embed_floor }}" \
            --arg model "$MODEL" \
            '{embedding_model:$model, embed_floor:$floor, sub_bases:.}' > vec/vec-manifest.json
          cat vec/vec-manifest.json
          test "$(jq '.sub_bases|length' vec/vec-manifest.json)" -gt 0 || { echo "::error::no sub-bases to publish"; exit 1; }
          # 4) Push the MERGED set (existing survivors + this run's series).
          cd vec
          args="vec-manifest.json:application/json"
          for z in *.duckdb.zst; do args="$args $z:application/zstd"; done
          retry oras push "$REF" \
            --artifact-type application/vnd.kodflow.3gpp-vec.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            $args
      # ANTI-LEAK, fail-loud (3gpp-vec was found PUBLIC on 2026-06-12 — the
      # sub-bases carry the clause TEXT verbatim, not just vectors): verify
      # after every publish, self-heal (PATCH to private), fail if the heal
      # fails. NB: flipping private only degrades the legacy opt-in anonymous
      # `serve -vec-ghcr` path; every CI consumer authenticates.
      - name: Assert 3gpp-vec is PRIVATE (self-heal then fail-loud)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-vec" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-vec visibility: $vis"
          if [ "$vis" = "public" ]; then
            echo "::warning::3gpp-vec is PUBLIC — attempting self-heal to private"
            gh api -X PATCH "/user/packages/container/3gpp-vec/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-vec" --jq '.visibility' 2>/dev/null || echo absent)"
            echo "after heal: $vis"
          fi
          [ "$vis" = "private" ] || { echo "::error::3gpp-vec is '$vis' (must be private — verbatim 3GPP clause text in the sub-bases). Fix in the UI: Packages → 3gpp-vec → Settings → Change visibility."; exit 1; }
      - name: Upload artifact (vectorized sub-bases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-vec
          path: vec/
          retention-days: 7
