name: Corpus · Coverage ledger

# Produces the absent-index.json ledger merging TWO accounted-for buckets:
#   C2 genuine-absent — (spec,release) the status report lists but with NO
#      downloadable file in the archive (no same-release version);
#   C1 drafts — (spec,release) listed only at a v0/v1/v2 draft version 3GPP never
#      publishes as a stable file.
# Published to the rolling `latest` Release so the `Corpus · Build` discover step
# subtracts it (`--absent-index`) and actionable drift converges to 0
# ("100% accounted": indexed | fallback-recoverable | draft | genuine-absent).
#
# It verifies the WHOLE worklist with verify-coverage.sh (range-GET + the real
# download_zip resolution: exact URL, then same-release archive-highest fallback,
# 3-char + 6-digit codes). ~20k light requests → run weekly, off-peak; the absent
# set changes slowly. Manual dispatch any time.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 0" # Sundays ~02:23 UTC

permissions:
  contents: write # upload absent-index.json to the `latest` Release

concurrency:
  group: corpus-coverage
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build rust/discover (Phase 10/11b — the sole discoverer; Go retired)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" build --release --manifest-path rust/discover/Cargo.toml
      - name: Emit the worklist from the live status report (rust/discover)
        run: |
          source scripts/lib/discover.sh
          discover_fetch_status "https://www.3gpp.org/DynaReport/status-report.htm" status.htm
          discover_run status.htm ./rust/discover/target/release/discover raw \
            --emit-worklist --floor Rel-99 > worklist.txt
      - name: Verify coverage (exact + same-release fallback) over the whole worklist
        run: JOBS=10 bash scripts/verify-coverage.sh worklist.txt coverage
      - name: Build absent-index.json from the genuine-absent rows (C2)
        run: |
          bash scripts/build-absent-index.sh coverage/results.tsv absent-index.json
          echo "genuine-absent ledger size: $(grep -c '\": \"' absent-index.json || echo 0)"
      - name: Add draft keys (v0/v1/v2) to the ledger (C1)
        # 3GPP lists many specs only at a draft version it never publishes as a
        # stable file → they re-flag as "missing" forever. Ledger them at their
        # draft version (offline, from the status report) and MERGE into the single
        # absent-index.json so the Build's `discover --absent-index` subtracts both
        # genuine-absent and drafts → actionable drift converges to the real residue.
        # Drafts are still FETCHED (emit-worklist includes them); this only quiets
        # drift reporting. A frozen (major>=3) version re-flags naturally.
        run: |
          source scripts/lib/discover.sh
          discover_run status.htm ./rust/discover/target/release/discover json \
            --emit-draft-ledger --floor Rel-99 > draft-ledger.json
          jq -s 'reduce .[] as $o ({}; . * $o)' absent-index.json draft-ledger.json > merged.json
          mv merged.json absent-index.json
          echo "ledger size after drafts: $(grep -c '\": \"' absent-index.json || echo 0)"
      - name: Upload artifact (audit copy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ledger
          path: |
            absent-index.json
            draft-ledger.json
            coverage/results.tsv
          retention-days: 14
      - name: Publish absent-index.json to `latest`
        run: |
          # Retry the Release ops — a transient GitHub API 401/5xx here drops the
          # freshly-regenerated ledger and the daily delta stops converging.
          source scripts/lib/retry.sh
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            retry gh release create latest --repo "$GITHUB_REPOSITORY" --latest --title "latest" \
              --notes "Rolling release — mcp-3gpp binaries + indexed 3GPP DB."
          retry gh release upload latest --repo "$GITHUB_REPOSITORY" absent-index.json --clobber
