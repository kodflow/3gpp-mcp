name: Corpus Image

# Bake the VALIDATED global corpus DB into the 3gpp-mcp server image and push to GHCR.
# Per the locked design (plan §3, §6.1, §9): the image CI does **bake only — ZERO merge**.
# The single source of truth is the OCI artifact ghcr.io/<owner>/3gpp-corpus:latest, which
# is produced + validated by the corpus pipeline (manual bootstrap, then Corpus Maintenance).
#
# GATED: this only runs on manual dispatch and FAILS FAST with a clear message if the
# corpus artifact does not exist yet (true until the first private publish). The image is
# PRIVATE by default — it embeds verbatim 3GPP text (plan §2). Keep the GHCR package private.

on:
  workflow_dispatch:
    inputs:
      build_tags:
        description: "Go build tags (empty = lexical; 'onnx' = semantic query path)"
        type: string
        default: ""
      release_tag:
        description: "GitHub Release to bake the corpus from (its 3gpp.duckdb.zst asset)"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Auto-bake: after each successful 'Corpus · Build' (the daily lexical publish to
  # `latest`), rebuild the runtime image from the freshly published 3gpp.duckdb.zst
  # so the image tracks the corpus with no manual step. Gated on success below.
  workflow_run:
    workflows: ["Corpus · Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  bake-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on manual dispatch, or only when the chained Corpus · Build SUCCEEDED.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Pull the published corpus → image-data/ (from the Release, bake-only, no merge)
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_run (auto-bake) carries no inputs → default to the rolling 'latest'.
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p image-data
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd
          # The corpus DB is published as the 3gpp.duckdb.zst asset on the rolling
          # Release by `Corpus · Build` (corpus-matrix.yml). Bake it as-is — NO merge,
          # NO rebuild. Lexical today; the same asset path carries the embedded DB
          # later. Fails fast with an actionable message if the build hasn't run.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 3gpp.duckdb.zst -D image-data/; then
            echo "::error::no 3gpp.duckdb.zst on Release '$TAG' — run 'Corpus · Build' first to publish it." >&2
            exit 1
          fi
          zstd -d --long=27 -f image-data/3gpp.duckdb.zst -o image-data/3gpp.duckdb
          rm -f image-data/3gpp.duckdb.zst
          test -f image-data/3gpp.duckdb || { echo "::error::no 3gpp.duckdb after decompress" >&2; exit 1; }

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the baked DB before building (gate — plan §5)
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event.inputs.push != 'false' }}
          build-args: |
            BUILD_TAGS=${{ github.event.inputs.build_tags }}
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: ${{ github.event.inputs.push != 'false' && steps.build.outputs.digest != '' }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
