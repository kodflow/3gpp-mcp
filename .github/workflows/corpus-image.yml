name: Corpus Image

# Bake the VALIDATED global corpus DB into the 3gpp-mcp server image and push to GHCR.
# Per the locked design (plan §3, §6.1, §9): the image CI does **bake only — ZERO merge**.
# The single source of truth is the OCI artifact ghcr.io/<owner>/3gpp-corpus:latest, which
# is produced + validated by the corpus pipeline (manual bootstrap, then Corpus Maintenance).
#
# GATED: this only runs on manual dispatch and FAILS FAST with a clear message if the
# corpus artifact does not exist yet (true until the first private publish). The image is
# PRIVATE by default — it embeds verbatim 3GPP text (plan §2). Keep the GHCR package private.

on:
  workflow_dispatch:
    inputs:
      build_tags:
        description: "Go build tags (empty = lexical; 'onnx' = semantic query path)"
        type: string
        default: ""
      release_tag:
        description: "GitHub Release to bake the corpus from (its 3gpp.duckdb.zst asset)"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Auto-bake: after each successful 'Corpus · Build' (the daily lexical publish to
  # `latest`), rebuild the runtime image from the freshly published 3gpp.duckdb.zst
  # so the image tracks the corpus with no manual step. Gated on success below.
  workflow_run:
    workflows: ["Corpus · Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  bake-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on manual dispatch, or only when the chained Corpus · Build SUCCEEDED.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Pull the published corpus image → image-data/ (bake-only, no merge)
        env:
          # workflow_run (auto-bake) carries no inputs → default to the rolling 'latest'.
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p image-data
          # The corpus DB is published as the PRIVATE data-only image
          # ghcr.io/<owner>/3gpp-corpus:<tag> by `Corpus · Build` (corpus-matrix.yml).
          # Pull it and extract /3gpp.duckdb — NO merge, NO rebuild. Fails fast with
          # an actionable message if the build hasn't published it yet.
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          if ! docker pull "$img"; then
            echo "::error::no $img — run 'Corpus · Build' first to publish it." >&2
            exit 1
          fi
          # FROM-scratch image → docker create needs a (never-run) command arg.
          cid=$(docker create "$img" /3gpp.duckdb)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          test -f image-data/3gpp.duckdb || { echo "::error::no 3gpp.duckdb after extract" >&2; exit 1; }
          ls -lh image-data/3gpp.duckdb

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the baked DB before building (gate — plan §5)
        run: |
          set -euo pipefail
          # --max-empty-meta surfaces the catalog-coverage count (specs with
          # clauses but no title/WG); the threshold is intentionally generous so
          # it reports without blocking the protected publish — tighten once the
          # steady-state baseline is known.
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # GHCR_PAT (not github.token): pushing with the CI token auto-links the image
      # to this PUBLIC repo → it inherits PUBLIC visibility. A PAT push stays
      # unlinked → born PRIVATE. (Same reason as corpus-matrix.)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          # NO org.opencontainers.image.source label: it LINKS the package to the
          # public repo and forces PUBLIC inheritance (the leak). Keep only a
          # description; the image must stay PRIVATE (it bakes verbatim 3GPP text).
          labels: |
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event.inputs.push != 'false' }}
          build-args: |
            BUILD_TAGS=${{ github.event.inputs.build_tags }}
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: ${{ github.event.inputs.push != 'false' && steps.build.outputs.digest != '' }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
