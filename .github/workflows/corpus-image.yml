name: Corpus Image

# Bake the VALIDATED global corpus DB into the 3gpp-mcp server image and push to GHCR.
# Per the locked design (plan §3, §6.1, §9): the image CI does **bake only — ZERO merge**.
# The single source of truth is the OCI artifact ghcr.io/<owner>/3gpp-corpus:latest, which
# is produced + validated by the corpus pipeline (manual bootstrap, then Corpus Maintenance).
#
# GATED: this only runs on manual dispatch and FAILS FAST with a clear message if the
# corpus artifact does not exist yet (true until the first private publish). The image is
# PRIVATE by default — it embeds verbatim 3GPP text (plan §2). Keep the GHCR package private.

on:
  workflow_dispatch:
    inputs:
      build_tags:
        description: "Go build tags (empty = lexical; 'onnx' = semantic query path)"
        type: string
        default: ""
      release_tag:
        description: "GitHub Release to bake the corpus from (its 3gpp.duckdb.zst asset)"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Auto-bake: after each successful 'Corpus · Build' (the daily lexical publish to
  # `latest`), rebuild the runtime image from the freshly published 3gpp.duckdb.zst
  # so the image tracks the corpus with no manual step. Gated on success below.
  workflow_run:
    workflows: ["Corpus · Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  bake-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # full bakes DB + ONNX Runtime + BGE-M3 (~25 GB provision)
    # Two image variants per run:
    #   light → binary only; corpus bootstrapped from the network on first run.
    #   full  → onnx binary + DB + vector sub-bases + BGE-M3 model baked as .zst
    #           (entrypoint decompresses on first start) → offline semantic. = :latest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light
            build_tags: ""
            tag_lines: type=raw,value=light
          - variant: full
            build_tags: onnx
            tag_lines: |
              type=raw,value=latest
              type=raw,value=full
    # Run on manual dispatch, or only when the chained Corpus · Build SUCCEEDED.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # LIGHT: bake the SAME lexical corpus DB as full, but WITHOUT the vector
      # sub-bases or the BGE-M3 model → offline lexical (BM25), small image. The
      # distributed corpus DB is already lexical (vectors are the separate 3gpp-vec
      # Option-B overlay, not an embedding column), so "light" = full minus the
      # vec/model, NOT a strip step. (Baking is required: the runtime DB-bootstrap
      # URL — releases/latest/download — 404s, so an empty light would have no DB.)
      - name: Light — bake the lexical DB only (zst), no vectors/model
        if: matrix.variant == 'light'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          rm -rf image-data && mkdir -p image-data
          echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          docker pull "$img"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          test -s image-data/3gpp.duckdb
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          zstd -q --long=27 image-data/3gpp.duckdb -o image-data/3gpp.duckdb.zst
          rm -f image-data/3gpp.duckdb
          du -sh image-data/* 2>/dev/null || true

      # FULL: bake the corpus DB + ONNX Runtime + BGE-M3 model + vector sub-bases into
      # image-data/ so the image is offline-semantic on pull. The DB + vectors are kept
      # as .zst (the entrypoint decompresses them into /data on first start) to keep the
      # image small; the model/ORT are stored raw (they don't compress).
      - name: Full — bake DB + ONNX Runtime + BGE-M3 + vectors (zst) into image-data/
        if: matrix.variant == 'full'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          rm -rf image-data && mkdir -p image-data/vec
          # 1) DB = the CURRENT lexical corpus from the PRIVATE GHCR image (the Release
          #    asset is frozen/older and its /releases/latest/download/ path 404s). The
          #    corpus image is FROM scratch → `docker create` needs a (never-run) cmd arg.
          echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          docker pull "$img"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          test -s image-data/3gpp.duckdb
          # 2) ONNX Runtime + BGE-M3 embedder via the binary's own provisioner.
          #    --skip-db: the DB is provided above (no stale refetch).
          #    --no-reranker: the reranker is optional (axis #7) — skipping it keeps the
          #    image smaller and removes the flaky 2nd large HF fetch that TLS-timed-out.
          #    Retry: the HF/CDN fetch is occasionally slow → up to 3 attempts.
          CGO_ENABLED=1 go build -tags onnx -o /tmp/mcp ./cmd/server
          ok=0
          for attempt in 1 2 3; do
            if /tmp/mcp bootstrap --cache "$PWD/image-data" --semantic --skip-db --no-reranker; then ok=1; break; fi
            echo "::warning::bootstrap attempt $attempt failed (transient HF/CDN?) — retrying"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::model/ORT bootstrap failed after 3 attempts"; exit 1; }
          # 3) gate on the baked DB BEFORE compressing it.
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          # 4) keep the DB as .zst (small image; entrypoint decompresses on first start).
          zstd -q --long=27 image-data/3gpp.duckdb -o image-data/3gpp.duckdb.zst
          rm -f image-data/3gpp.duckdb
          # 4) vector sub-bases (already .zst) from the fp16 channel; degrade to lexical
          #    if none are published yet (coverage is being completed series by series).
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          echo "$GHCR_PAT" | oras login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          if oras pull "ghcr.io/${{ github.repository_owner }}/3gpp-vec:latest-fp16" -o image-data/vec; then
            echo "vectors baked: $(ls image-data/vec)"
          else
            echo "::warning::no 3gpp-vec:latest-fp16 yet — full image ships lexical until vectors are published"
          fi
          du -sh image-data image-data/* 2>/dev/null || true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # GHCR_PAT (not github.token): pushing with the CI token auto-links the image
      # to this PUBLIC repo → it inherits PUBLIC visibility. A PAT push stays
      # unlinked → born PRIVATE. (Same reason as corpus-matrix.)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            ${{ matrix.tag_lines }}
            type=sha,prefix=${{ matrix.variant }}-,format=short
          # NO org.opencontainers.image.source label: it LINKS the package to the
          # public repo and forces PUBLIC inheritance (the leak). Keep only a
          # description; the image must stay PRIVATE (it bakes verbatim 3GPP text).
          labels: |
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event.inputs.push != 'false' }}
          build-args: |
            BUILD_TAGS=${{ matrix.build_tags }}
            VARIANT=${{ matrix.variant }}
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: ${{ github.event.inputs.push != 'false' && steps.build.outputs.digest != '' }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
