name: Corpus Image

# Bake the VALIDATED global corpus DB into the 3gpp-mcp server image and push to GHCR.
# Per the locked design (plan §3, §6.1, §9): the image CI does **bake only — ZERO merge**.
# The single source of truth is the OCI artifact ghcr.io/<owner>/3gpp-corpus:latest, which
# is produced + validated by the corpus pipeline (manual bootstrap, then Corpus Maintenance).
#
# GATED: this only runs on manual dispatch and FAILS FAST with a clear message if the
# corpus artifact does not exist yet (true until the first private publish). The image is
# PRIVATE by default — it embeds verbatim 3GPP text (plan §2). Keep the GHCR package private.

on:
  workflow_dispatch:
    inputs:
      build_tags:
        description: "Go build tags (empty = lexical; 'onnx' = semantic query path)"
        type: string
        default: ""
      release_tag:
        description: "GitHub Release to bake the corpus from (its 3gpp.duckdb.zst asset)"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Auto-bake: after each successful 'Corpus · Build' (the daily lexical publish to
  # `latest`), rebuild the runtime image from the freshly published 3gpp.duckdb.zst
  # so the image tracks the corpus with no manual step. Gated on success below.
  workflow_run:
    workflows: ["Corpus · Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  # Materialise the BGE-M3 model ONCE per run and hand it to every build leg as
  # a run artifact, so the legs never each hit HuggingFace (three 429 bake
  # deaths in one day). Source order inside restore-bge.sh: the durable
  # 'models' release cache first, one pinned HF fetch at most. The weights are
  # arch-independent ONNX, so a single artifact serves amd64 AND arm64.
  model:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Best-effort by design: a failed prefetch must NEVER gate the matrix — each
    # full leg falls back to restore-bge.sh on a missing artifact anyway.
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Materialise BGE-M3 (models release → HF once)
        run: scripts/restore-bge.sh bge-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bge-m3-model
          path: bge-cache/bge-m3
          retention-days: 1
          if-no-files-found: warn

  build:
    needs: model
    # MULTI-ARCH via NATIVE runners (NOT QEMU): each arch builds on its own runner so
    # the CGO/DuckDB compile is native (fast) AND the full bake fetches the CORRECT
    # ONNX Runtime for that arch (the bootstrap is arch-aware) — a QEMU build would bake
    # the amd64 ORT into the arm64 image. Each (variant,arch) pushes BY DIGEST; the
    # `manifest` job then fuses the per-arch digests into the multi-arch tags.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180 # full bakes DB + ONNX Runtime + BGE-M3 (~25 GB provision)
    strategy:
      fail-fast: false
      matrix:
        variant: [light, full]
        arch: [amd64, arm64]
        include:
          - variant: light # binary only; corpus bootstrapped from the network on first run.
            build_tags: ""
          - variant: full # onnx + DB + vectors + BGE-M3 baked → offline semantic. = :latest.
            build_tags: onnx
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Run on manual dispatch, or only when the chained Corpus · Build SUCCEEDED.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # The model prefetched ONCE by the `model` job (arch-independent weights).
      # Missing artifact is tolerated — the bake step falls back to restore-bge.sh.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.variant == 'full'
        continue-on-error: true
        with:
          name: bge-m3-model
          path: bge-cache/bge-m3

      # LIGHT: bake the SAME lexical corpus DB as full, but WITHOUT the vector
      # sub-bases or the BGE-M3 model → offline lexical (BM25), small image. The
      # distributed corpus DB is already lexical (vectors are the separate 3gpp-vec
      # Option-B overlay, not an embedding column), so "light" = full minus the
      # vec/model, NOT a strip step. (Baking is required: the runtime DB-bootstrap
      # URL — releases/latest/download — 404s, so an empty light would have no DB.)
      - name: Light — bake the lexical DB only (zst), no vectors/model
        if: matrix.variant == 'light'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          rm -rf image-data && mkdir -p image-data
          retry bash -c 'echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          retry docker pull "$img"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          test -s image-data/3gpp.duckdb
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          zstd -q --long=27 image-data/3gpp.duckdb -o image-data/3gpp.duckdb.zst
          rm -f image-data/3gpp.duckdb
          du -sh image-data/* 2>/dev/null || true

      # FULL: bake ONE fused, RAW corpus DB (lexical + vectors overlaid by natural
      # identity — issue #125) + the fp16 BGE-M3 + ONNX Runtime into image-data/, so
      # serve reads everything IN PLACE, read-only, with no volume and no first-start
      # decompression. Raw on purpose: the registry compresses layers for transfer
      # anyway, while baking .zst forced a decompress-into-volume copy that doubled
      # the on-disk footprint (issue #124). The model is converted to fp16 AT BAKE
      # (same onnxruntime.transformers recipe as the Kaggle kernel) so the client
      # EmbedIdentity matches the fp16 vectors — with the registry-default fp32
      # model the serve coherence guard refused the vectors (silently lexical).
      - name: Full — bake fused raw DB (identity overlay) + fp16 BGE-M3 + ORT
        if: matrix.variant == 'full'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
          # gh CLI auth for the 'models' release restore (BGE-M3 cache, step 2a).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          # Free runner disk FIRST: the full bake stages ~15 GB (raw DB 6.4G + model
          # 2.3G + vectors 3.4G + DB.zst 3G) and the default runner only has ~14 GB
          # free on /. Reclaim the pre-installed toolchains we don't use.
          echo "disk before:"; df -h / | tail -1
          # Reclaim every big pre-installed toolchain we don't use + the swapfile, so the
          # buildx export of the ~15 GB image-data layer never hits "No space left" (the
          # full/amd64 bake runs right at the edge otherwise).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true; sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "disk after free:"; df -h / | tail -1
          rm -rf image-data && mkdir -p image-data
          # 1) DB = the CURRENT lexical corpus from the PRIVATE GHCR image (the Release
          #    asset is frozen/older and its /releases/latest/download/ path 404s). The
          #    corpus image is FROM scratch → `docker create` needs a (never-run) cmd arg.
          retry bash -c 'echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          retry docker pull "$img"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          docker rmi "$img" >/dev/null 2>&1 || true   # DISK: the pulled copy is consumed
          test -s image-data/3gpp.duckdb
          # 2a) BGE-M3 WITHOUT touching HuggingFace: the run artifact prefetched
          #     ONCE by the `model` job, else restore-bge.sh (the durable 'models'
          #     release first, one pinned HF fetch as the very last resort). ORT is
          #     NOT covered on purpose: that asset is arch-specific and bootstrap
          #     fetches it arch-natively from the Microsoft GitHub release (which
          #     has never rate-limited us).
          if [ -s bge-cache/bge-m3/model.onnx_data ]; then
            mkdir -p image-data/models
            cp -a bge-cache/bge-m3 image-data/models/
            echo "BGE-M3 from the run artifact (prefetched once by the model job)"
          else
            echo "::warning::bge-m3-model artifact absent — restoring directly"
            scripts/restore-bge.sh image-data/models
          fi
          # 2b) ONNX Runtime (+ BGE-M3 only if 2a fell through) via the binary's own
          #    provisioner — Fetch() is idempotent, a present file with a matching
          #    hash is kept, so a successful restore means NO HuggingFace traffic.
          #    --skip-db: the DB is provided above (no stale refetch).
          #    --no-reranker: the reranker is optional (axis #7) — skipping it keeps the
          #    image smaller and removes the flaky 2nd large HF fetch that TLS-timed-out.
          #    Retry: the HF/CDN fetch is occasionally slow/429 → shared backoff policy.
          CGO_ENABLED=1 go build -tags onnx -o /tmp/mcp ./cmd/server
          RETRY_MAX=4 RETRY_BASE=15 RETRY_LABEL="bootstrap model/ORT" \
            retry /tmp/mcp bootstrap --cache "$PWD/image-data" --semantic --skip-db --no-reranker
          # 3) fp16 conversion of OUR pinned fp32 ONNX (keep_io_types) — the exact
          #    recipe the Kaggle kernel uses, so the resulting EmbedIdentity equals the
          #    one stamped in the published sub-bases. The fp32 source is then DROPPED
          #    (the image ships fp16 only: half the weight, matching vectors).
          # sympy + packaging: onnxruntime.transformers needs them for the symbolic
          # shape inference a >2GB model requires — Kaggle's image preinstalls them,
          # a GitHub runner does NOT (the first fused-bake run died on exactly this).
          python3 -m pip install --quiet onnx onnxruntime sympy packaging
          mkdir -p image-data/models/bge-m3-fp16
          cat > /tmp/convfp16.py <<'PY'
          import onnx
          from onnxruntime.transformers.onnx_model import OnnxModel
          m = onnx.load("image-data/models/bge-m3/model.onnx")
          om = OnnxModel(m)
          om.convert_float_to_float16(keep_io_types=True)
          onnx.save(om.model, "image-data/models/bge-m3-fp16/model.onnx",
                    save_as_external_data=True, all_tensors_to_one_file=True,
                    location="model.onnx_data")
          print("fp16_saved")
          PY
          python3 /tmp/convfp16.py
          cp image-data/models/bge-m3/tokenizer.json image-data/models/bge-m3-fp16/
          rm -rf image-data/models/bge-m3
          # Registry override baked alongside the model: ABSOLUTE paths at the image's
          # cache location; field values mirror the kernel's models.yaml exactly so
          # the EmbedIdentity digest equals the sub-bases' embedding_model stamp.
          cat > image-data/models/models.yaml <<'YAML'
          active: bge-m3-fp16
          models:
            - name: bge-m3-fp16
              family: bge-m3
              dir: /data/mcp-3gpp/models/bge-m3-fp16
              precision: fp16
              dim: 1024
              normalization: l2
              revision: 5617a9f
              tokenizer_revision: 5617a9f
              tokenizer_dir: /data/mcp-3gpp/models/bge-m3-fp16
              inputs: [input_ids, attention_mask]
              output: sentence_embedding
          YAML
          # 4) gate on the baked DB BEFORE fusing vectors into it.
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          # 5) FUSE the published vectors INTO the DB (issue #125): pull the fp16
          #    channel's sub-bases ONE AT A TIME (manifest + per-blob fetch — never the
          #    whole channel at once: runner-disk peak stays ≈ final DB + 1 sub-base)
          #    and overlay each by natural identity. cmd/overlay also stamps the
          #    shards' embedding_model into the DB meta (coherence-checked).
          # oras CLI must match the RUNNER arch (this step runs natively, not in QEMU).
          case "$(uname -m)" in
            x86_64)  oras_arch=amd64 ;;
            aarch64) oras_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m) for oras"; exit 1 ;;
          esac
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_${oras_arch}.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          retry bash -c 'echo "$GHCR_PAT" | oras login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          CGO_ENABLED=1 go build -o /tmp/overlay ./cmd/overlay
          VREF="ghcr.io/${{ github.repository_owner }}/3gpp-vec:latest-fp16"
          retry oras manifest fetch "$VREF" > /tmp/vec-manifest.json
          # Both naming schemes can coexist on the channel (s<NN> from the Kaggle
          # publish, shard-<NN>[-Rel-X] from on-runner embeds) — accept both.
          jq -r '.layers[] | select((.annotations["org.opencontainers.image.title"] // "") | test("^(s|shard-)[0-9]{2}.*\\.duckdb\\.zst$")) | .digest + " " + .annotations["org.opencontainers.image.title"]' \
            /tmp/vec-manifest.json > /tmp/subs.txt
          test -s /tmp/subs.txt || { echo "::error::no vector sub-bases on $VREF — refusing to ship a silently-lexical :full"; exit 1; }
          echo "fusing $(wc -l < /tmp/subs.txt) sub-bases:"; cat /tmp/subs.txt
          : > /tmp/overlay.log
          skipped=0
          while read -r digest title; do
            echo "--- $title ---"; df -h / | tail -1
            retry oras blob fetch "$VREF@$digest" --output /tmp/sub.duckdb.zst
            # Tolerate ONE bad sub-base (warn + skip) instead of sinking the whole
            # bake: the channel once carried an EMPTY s31 blob (a corrupt embed
            # artifact published unchecked) and the fusion died at 1.5M/2.8M. The
            # DUCK magic (offset 8) cheaply rejects empty/garbage files; global
            # integrity is still enforced by the >=2M assertion below.
            if ! zstd -d -q -f --long=31 /tmp/sub.duckdb.zst -o /tmp/sub.duckdb 2>/dev/null \
               || [ "$(dd if=/tmp/sub.duckdb bs=1 skip=8 count=4 2>/dev/null)" != "DUCK" ] \
               || ! /tmp/overlay --base image-data/3gpp.duckdb --vec /tmp/sub.duckdb 2>&1 | tee -a /tmp/overlay.log; then
              echo "::warning::sub-base $title is invalid or failed to overlay — SKIPPED (its series stays lexical until the channel republishes it)"
              skipped=$((skipped+1))
            fi
            rm -f /tmp/sub.duckdb.zst /tmp/sub.duckdb
          done < /tmp/subs.txt
          echo "sub-bases skipped: $skipped"
          # HARD ASSERTIONS — never ship a :full that is silently lexical (the first
          # publish DID exactly that). The DB stays RAW (no .zst — serve reads in place).
          echo "=== image-data tree ==="; { ls -laR image-data | head -60; } 2>/dev/null || true
          echo "=== sizes ==="; du -sh image-data image-data/* image-data/*/* 2>/dev/null || true
          vectorised="$(grep -oE 'done: [0-9]+ clauses vectorised' /tmp/overlay.log | tail -1 | grep -oE '[0-9]+' || echo 0)"
          echo "fused vectorised clauses: $vectorised"
          [ "$vectorised" -ge 2000000 ] || { echo "::error::fused DB has only $vectorised vectorised clauses (< 2,000,000) — channel incomplete or overlay mis-matched"; exit 1; }
          grep -q 'embedding_model stamped:' /tmp/overlay.log || { echo "::error::embedding_model not stamped — serve would refuse semantic"; exit 1; }
          test -s image-data/3gpp.duckdb                          || { echo "::error::baked DB missing"; exit 1; }
          test -s image-data/models/bge-m3-fp16/model.onnx_data   || { echo "::error::fp16 BGE-M3 weights missing"; exit 1; }
          test -s image-data/models/models.yaml                   || { echo "::error::baked model registry missing"; exit 1; }

      # Warm the buildkit image with a retry'd pull so the buildx builder boot does
      # not hard-fail on a transient Docker Hub timeout (the exact class of break
      # that killed the scheduled corpus build). build-push then finds it cached.
      - name: Pre-pull buildkit (retry; Docker Hub flakes)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry docker pull moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # GHCR_PAT (not github.token): pushing with the CI token auto-links the image
      # to this PUBLIC repo → it inherits PUBLIC visibility. A PAT push stays
      # unlinked → born PRIVATE. (Same reason as corpus-matrix.)
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # NO org.opencontainers.image.source label: it LINKS the package to the
          # public repo and forces PUBLIC inheritance (the leak). Keep only a
          # description; the image must stay PRIVATE (it bakes verbatim 3GPP text).
          labels: |
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
      # Build the SINGLE-arch image and push it BY DIGEST (no tags here — the `manifest`
      # job fuses the per-arch digests into the multi-arch tags). provenance:false keeps
      # the per-arch push a plain manifest so `imagetools` composes it cleanly.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_TAGS=${{ matrix.build_tags }}
            VARIANT=${{ matrix.variant }}
            VERSION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/3gpp-mcp,push-by-digest=true,name-canonical=true,push=${{ github.event.inputs.push != 'false' }}
      - name: Export digest for the manifest job
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ github.event.inputs.push != 'false' }}
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Fuse the per-arch (amd64 + arm64) digests of each variant into the multi-arch tags.
  manifest:
    needs: build
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light
            tag_lines: type=raw,value=light
          - variant: full
            tag_lines: |
              type=raw,value=latest
              type=raw,value=full
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            ${{ matrix.tag_lines }}
            type=sha,prefix=${{ matrix.variant }}-,format=short
      - name: Create multi-arch manifest from the per-arch digests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # DOCKER_METADATA_OUTPUT_JSON holds the JSON string itself (not a path);
          # feed it on stdin, otherwise jq treats the JSON as a filename to open.
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${REPO}@sha256:%s " *)
      - name: Verify multi-arch
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/3gpp-mcp:${{ matrix.variant == 'full' && 'latest' || 'light' }}" \
            | grep -E "Platform|MediaType" | head
