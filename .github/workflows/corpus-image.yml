name: Corpus Image

# Build the 3gpp-mcp server image (light + full, multi-arch) and push to GHCR.
#
# split-data-image design: the FULL variant does NOT bake the corpus anymore —
# it INHERITS the ~22 GB fused data layer from ghcr.io/<owner>/3gpp-data
# (resolved BY DIGEST in the `resolve` job; baked by corpus-data-image.yml).
# A code-only change therefore rebuilds ~150 MB of top layers in ~10 min,
# and the registry/pull dedupe the unchanged data blob. The `gate` job asserts
# that property on every push (manifest-based, fail-loud).
#
# The image is PRIVATE — it embeds verbatim 3GPP text. Keep the package private.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "3gpp-corpus tag the LIGHT variant bakes its lexical DB from"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Code-only rebuilds (split-data-image): a change to the shipped binary or the
  # image scaffolding rebuilds ONLY the small top layers (~150 MB push) — the
  # ~22 GB data layer is inherited from 3gpp-data by digest and never recreated.
  push:
    branches: [main]
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/corpus-image.yml"
  # Data rebuilds: after each successful 'Corpus Data Image' bake (itself chained
  # to the corpus/vec publishes), re-point the mcp image at the fresh data digest.
  workflow_run:
    workflows: ["Corpus Data Image"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  # Resolve the data base BY DIGEST + the ORT pins, once for every build leg.
  # The mcp image must never consume a moving 3gpp-data:latest inside the
  # Dockerfile: the digest resolved here is what gets built against, stamped
  # into the io.kodflow.3gpp.data.digest label, and asserted by the gate job.
  resolve:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    outputs:
      data_image: ${{ steps.r.outputs.data_image }}
      data_digest: ${{ steps.r.outputs.data_digest }}
      data_layer: ${{ steps.r.outputs.data_layer }}
      ort_version: ${{ steps.r.outputs.ort_version }}
      ort_sha_amd64: ${{ steps.r.outputs.ort_sha_amd64 }}
      ort_sha_arm64: ${{ steps.r.outputs.ort_sha_arm64 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Resolve 3gpp-data digest + data-layer + ORT pins
        id: r
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          REPO="ghcr.io/${{ github.repository_owner }}/3gpp-data"
          DATA_DIGEST="$(retry crane digest "$REPO:latest")"
          # The data layer = the LAST layer of any platform manifest of 3gpp-data
          # (its own workflow asserts all platforms share that single blob).
          PM="$(crane manifest "$REPO:latest" | jq -r '.manifests[0].digest // empty')"
          if [ -n "$PM" ]; then
            DATA_LAYER="$(crane manifest "$REPO@$PM" | jq -r '.layers[-1].digest')"
          else
            DATA_LAYER="$(crane manifest "$REPO:latest" | jq -r '.layers[-1].digest')"
          fi
          # ORT pins single-sourced from scripts/fetch-model.sh (ort_pin_test keeps
          # them in lockstep with the Go DefaultORTVersion).
          ORT_V="$(grep -oE 'ORT_VERSION:-[0-9.]+' scripts/fetch-model.sh | head -1 | cut -d- -f2)"
          SHA_A="$(grep -E 'onnxruntime-linux-x64-' scripts/fetch-model.sh | grep -oE '[0-9a-f]{64}' | head -1)"
          SHA_R="$(grep -E 'onnxruntime-linux-aarch64-' scripts/fetch-model.sh | grep -oE '[0-9a-f]{64}' | head -1)"
          test -n "$DATA_DIGEST" && test -n "$DATA_LAYER" && test -n "$ORT_V" && test -n "$SHA_A" && test -n "$SHA_R"
          {
            echo "data_image=$REPO@$DATA_DIGEST"
            echo "data_digest=$DATA_DIGEST"
            echo "data_layer=$DATA_LAYER"
            echo "ort_version=$ORT_V"
            echo "ort_sha_amd64=$SHA_A"
            echo "ort_sha_arm64=$SHA_R"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # MULTI-ARCH via NATIVE runners (NOT QEMU): each arch builds on its own runner so
    # the CGO/DuckDB compile is native (fast) and the full target fetches the CORRECT
    # arch's ONNX Runtime (sha256-pinned in the Dockerfile). Each (variant,arch)
    # pushes BY DIGEST; the `manifest` job fuses them into the multi-arch tags.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90 # no bake anymore — compile + light zst + push
    strategy:
      fail-fast: false
      matrix:
        variant: [light, full]
        arch: [amd64, arm64]
        include:
          - variant: light # binary only; corpus bootstrapped from the network on first run.
            build_tags: ""
          - variant: full # onnx + DB + vectors + BGE-M3 baked → offline semantic. = :latest.
            build_tags: onnx
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Run on manual dispatch / code push, or only when the chained bake SUCCEEDED.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # LIGHT: bake the SAME lexical corpus DB as full, but WITHOUT the vector
      # sub-bases or the BGE-M3 model → offline lexical (BM25), small image. The
      # distributed corpus DB is already lexical (vectors are the separate 3gpp-vec
      # Option-B overlay, not an embedding column), so "light" = full minus the
      # vec/model, NOT a strip step. (Baking is required: the runtime DB-bootstrap
      # URL — releases/latest/download — 404s, so an empty light would have no DB.)
      - name: Light — bake the lexical DB only (zst), no vectors/model
        if: matrix.variant == 'light'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          rm -rf image-data && mkdir -p image-data
          retry bash -c 'echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          img="ghcr.io/${{ github.repository_owner }}/3gpp-corpus:${TAG}"
          retry docker pull "$img"
          cid=$(docker create "$img" /noop)
          docker cp "$cid:/3gpp.duckdb" image-data/3gpp.duckdb
          docker rm "$cid" >/dev/null
          test -s image-data/3gpp.duckdb
          CGO_ENABLED=1 go run ./cmd/validate --db image-data/3gpp.duckdb \
            --require-fts --min-clauses 1 --max-empty-meta 100000
          zstd -q --long=27 image-data/3gpp.duckdb -o image-data/3gpp.duckdb.zst
          rm -f image-data/3gpp.duckdb
          du -sh image-data/* 2>/dev/null || true

      # not hard-fail on a transient Docker Hub timeout (the exact class of break
      # that killed the scheduled corpus build). build-push then finds it cached.
      - name: Pre-pull buildkit (retry; Docker Hub flakes)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry docker pull moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # GHCR_PAT (not github.token): pushing with the CI token auto-links the image
      # to this PUBLIC repo → it inherits PUBLIC visibility. A PAT push stays
      # unlinked → born PRIVATE. (Same reason as corpus-matrix.)
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # NO org.opencontainers.image.source label: it LINKS the package to the
          # public repo and forces PUBLIC inheritance (the leak). Keep only a
          # description; the image must stay PRIVATE (it bakes verbatim 3GPP text).
          # io.kodflow.3gpp.data.digest = the exact 3gpp-data digest this build
          # consumed (provenance; asserted by the gate job on the full variant).
          labels: |
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
            io.kodflow.3gpp.data.digest=${{ needs.resolve.outputs.data_digest }}
      # Build the SINGLE-arch image and push it BY DIGEST (no tags here — the `manifest`
      # job fuses the per-arch digests into the multi-arch tags). provenance:false keeps
      # the per-arch push a plain manifest so `imagetools` composes it cleanly.
      # target = the variant: `light` bakes image-data/ (zst), `full` inherits the
      # ~22 GB data layer from 3gpp-data@digest (stage corpus + COPY --link).
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_TAGS=${{ matrix.build_tags }}
            VARIANT=${{ matrix.variant }}
            VERSION=${{ github.sha }}
            DATA_IMAGE=${{ needs.resolve.outputs.data_image }}
            ORT_VERSION=${{ needs.resolve.outputs.ort_version }}
            ORT_SHA256_AMD64=${{ needs.resolve.outputs.ort_sha_amd64 }}
            ORT_SHA256_ARM64=${{ needs.resolve.outputs.ort_sha_arm64 }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/3gpp-mcp,push-by-digest=true,name-canonical=true,push=${{ github.event.inputs.push != 'false' }}
      - name: Export digest for the manifest job
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ github.event.inputs.push != 'false' }}
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Fuse the per-arch (amd64 + arm64) digests of each variant into the multi-arch tags.
  manifest:
    needs: build
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light
            tag_lines: type=raw,value=light
          - variant: full
            tag_lines: |
              type=raw,value=latest
              type=raw,value=full
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            ${{ matrix.tag_lines }}
            type=sha,prefix=${{ matrix.variant }}-,format=short
      - name: Create multi-arch manifest from the per-arch digests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # DOCKER_METADATA_OUTPUT_JSON holds the JSON string itself (not a path);
          # feed it on stdin, otherwise jq treats the JSON as a filename to open.
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${REPO}@sha256:%s " *)
      - name: Verify multi-arch
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/3gpp-mcp:${{ matrix.variant == 'full' && 'latest' || 'light' }}" \
            | grep -E "Platform|MediaType" | head

  # DEDUPE GATE (split-data-image review) — the whole split is worth nothing if
  # the mcp build RE-CREATES the data blob instead of referencing 3gpp-data's.
  # Manifest-based (never buildx logs): for each platform of :latest, assert
  #   1. the EXACT 3gpp-data blob digest appears in the image's layer list;
  #   2. it is the ONLY layer > 1 GiB (no accidental second giant blob);
  #   3. the io.kodflow.3gpp.data.digest label equals the digest consumed.
  # If this gate fails: COPY --link re-materialised the layer — switch the
  # Dockerfile to per-arch `FROM 3gpp-data` inheritance (layers referenced by
  # digest, guaranteed) and build per-arch data images (documented fallback,
  # plan split-data-image §9).
  gate:
    needs: [resolve, manifest]
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Assert the mcp image references the exact 3gpp-data blob
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DATA_LAYER: ${{ needs.resolve.outputs.data_layer }}
          DATA_DIGEST: ${{ needs.resolve.outputs.data_digest }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          REF="ghcr.io/${{ github.repository_owner }}/3gpp-mcp:latest"
          fail=0
          for p in linux/amd64 linux/arm64; do
            d="$(crane manifest "$REF" | jq -r --arg p "$p" '.manifests[] | select((.platform.os + "/" + .platform.architecture) == $p) | .digest')"
            test -n "$d" || { echo "::error::no $p manifest on $REF"; fail=1; continue; }
            m="$(crane manifest "ghcr.io/${{ github.repository_owner }}/3gpp-mcp@$d")"
            echo "--- $p ($d) layers:"; printf '%s' "$m" | jq -r '.layers[] | (.size|tostring) + "  " + .digest'
            printf '%s' "$m" | jq -e --arg l "$DATA_LAYER" '.layers[] | select(.digest == $l)' >/dev/null \
              || { echo "::error::$p does NOT reference the 3gpp-data blob $DATA_LAYER — COPY --link re-materialised the layer (see fallback in the workflow header of this job)"; fail=1; }
            big="$(printf '%s' "$m" | jq '[.layers[] | select(.size > 1073741824)] | length')"
            bigd="$(printf '%s' "$m" | jq -r '[.layers[] | select(.size > 1073741824)][0].digest // empty')"
            { [ "$big" = "1" ] && [ "$bigd" = "$DATA_LAYER" ]; } \
              || { echo "::error::$p has $big layer(s) >1GiB (first: ${bigd:-none}) — expected exactly the 3gpp-data blob"; fail=1; }
            cfgd="$(crane config "ghcr.io/${{ github.repository_owner }}/3gpp-mcp@$d" | jq -r '.config.Labels["io.kodflow.3gpp.data.digest"] // empty')"
            [ "$cfgd" = "$DATA_DIGEST" ] \
              || { echo "::error::$p label io.kodflow.3gpp.data.digest=$cfgd != consumed $DATA_DIGEST"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "GATE OK: single shared data blob, correctly labeled, on both platforms"
          exit "$fail"
      # ANTI-LEAK, fail-loud (the 3gpp-mcp package was found PUBLIC on 2026-06-11
      # with the verbatim corpus inside — repo-page badge audit): verify after
      # EVERY push, self-heal (PATCH to private), fail if the heal fails.
      - name: Assert 3gpp-mcp is PRIVATE (self-heal then fail-loud)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-mcp" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-mcp visibility: $vis"
          if [ "$vis" = "public" ]; then
            echo "::warning::3gpp-mcp is PUBLIC — attempting self-heal to private"
            gh api -X PATCH "/user/packages/container/3gpp-mcp/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-mcp" --jq '.visibility' 2>/dev/null || echo absent)"
            echo "after heal: $vis"
          fi
          [ "$vis" = "private" ] || { echo "::error::3gpp-mcp is '$vis' (must be private — verbatim 3GPP text). Fix in the UI: Packages → 3gpp-mcp → Settings → Change visibility."; exit 1; }
