name: Corpus Image

# Build the 3gpp-mcp server image (ONE variant, multi-arch) and push to GHCR.
#
# split-data-image design: the image does NOT bake the corpus —
# it INHERITS the ~22 GB fused data layer from ghcr.io/<owner>/3gpp-data
# (resolved BY DIGEST in the `resolve` job; baked by corpus-data-image.yml).
# A code-only change therefore rebuilds ~150 MB of top layers in ~10 min,
# and the registry/pull dedupe the unchanged data blob. The `gate` job asserts
# that property on every push (manifest-based, fail-loud).
#
# The image is PRIVATE — it embeds verbatim 3GPP text. Keep the package private.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "unused since the light variant was removed; kept so saved dispatches keep working"
        type: string
        default: "latest"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true
  # Code-only rebuilds (split-data-image): a change to the shipped binary or the
  # image scaffolding rebuilds ONLY the small top layers (~150 MB push) — the
  # ~22 GB data layer is inherited from 3gpp-data by digest and never recreated.
  push:
    branches: [main]
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/corpus-image.yml"
  # Data rebuilds: after each successful 'Corpus Data Image' bake (itself chained
  # to the corpus/vec publishes), re-point the mcp image at the fresh data digest.
  workflow_run:
    workflows: ["Corpus Data Image"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  # Resolve the data base BY DIGEST + the ORT pins, once for every build leg.
  # The mcp image must never consume a moving 3gpp-data:latest inside the
  # Dockerfile: the digest resolved here is what gets built against, stamped
  # into the io.kodflow.3gpp.data.digest label, and asserted by the gate job.
  resolve:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    outputs:
      data_image: ${{ steps.r.outputs.data_image }}
      data_digest: ${{ steps.r.outputs.data_digest }}
      data_manifest_amd64: ${{ steps.r.outputs.data_manifest_amd64 }}
      data_manifest_arm64: ${{ steps.r.outputs.data_manifest_arm64 }}
      data_layer_amd64: ${{ steps.r.outputs.data_layer_amd64 }}
      data_layer_arm64: ${{ steps.r.outputs.data_layer_arm64 }}
      data_created: ${{ steps.r.outputs.data_created }}
      data_contract: ${{ steps.r.outputs.data_contract }}
      source_corpus: ${{ steps.r.outputs.source_corpus }}
      ort_version: ${{ steps.r.outputs.ort_version }}
      ort_sha_amd64: ${{ steps.r.outputs.ort_sha_amd64 }}
      ort_sha_arm64: ${{ steps.r.outputs.ort_sha_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve 3gpp-data digest + data-layer + ORT pins
        id: r
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          REPO="ghcr.io/${{ github.repository_owner }}/3gpp-data"
          DATA_DIGEST="$(retry crane digest "$REPO:latest")"
          # PER-ARCH data layer = the LAST layer of EACH platform manifest of
          # 3gpp-data (debian-based ⇒ each arch carries its own data blob; full
          # inherits the matching one via FROM). The gate compares each mcp
          # platform against its arch's data blob.
          IDX="$(crane manifest "$REPO:latest")"
          PM_A="$(printf '%s' "$IDX" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')"
          PM_R="$(printf '%s' "$IDX" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')"
          test -n "$PM_A" && test -n "$PM_R" || { echo "::error::3gpp-data:latest is not multi-arch (amd64=$PM_A arm64=$PM_R)"; exit 1; }
          DATA_LAYER_A="$(crane manifest "$REPO@$PM_A" | jq -r '.layers[-1].digest')"
          DATA_LAYER_R="$(crane manifest "$REPO@$PM_R" | jq -r '.layers[-1].digest')"
          # Provenance labels baked into 3gpp-data — forwarded into the mcp image as
          # build-args so `serve` surfaces them on /dashboard.json (WHICH data layer +
          # when it was baked). Read from the amd64 platform config (both arches share
          # the same corpus). Default "unknown" so a label-less legacy data image still
          # builds (the value is diagnostic, not load-bearing).
          DATA_CREATED="$(crane config "$REPO@$PM_A" | jq -r '.config.Labels["io.kodflow.3gpp.data.created"] // "unknown"')"
          SOURCE_CORPUS="$(crane config "$REPO@$PM_A" | jq -r '.config.Labels["io.kodflow.3gpp.source.corpus"] // "unknown"')"
          # COMPLETENESS GATE (label-based, NO 22 GB read): the data bake stamps
          # io.kodflow.3gpp.data.contract with the level it PASSED (cmd/validate). The
          # mcp image must only be built on a layer that meets the level this repo
          # currently requires (vars.DATA_CONTRACT, default dense). A legacy data image
          # with no label, or a level below the requirement, fails here — the cheap
          # equivalent of the old in-image check-data guard, minus materialising the DB.
          DATA_CONTRACT="$(crane config "$REPO@$PM_A" | jq -r '.config.Labels["io.kodflow.3gpp.data.contract"] // ""')"
          WANT_CONTRACT="${{ vars.DATA_CONTRACT || 'dense' }}"
          if [ -z "$DATA_CONTRACT" ]; then
            # TRANSITION: a 3gpp-data image baked before the contract label existed.
            # Don't block (the bake still enforced FTS/HNSW; the label-gate activates
            # once the data image is re-baked with corpus-data-image's stamp). Warn loud.
            echo "::warning::3gpp-data carries NO io.kodflow.3gpp.data.contract label (legacy bake) — proceeding; the completeness gate enforces once the data image is re-baked."
          elif [ "$DATA_CONTRACT" != "$WANT_CONTRACT" ]; then
            echo "::error::3gpp-data contract label='$DATA_CONTRACT' != required '$WANT_CONTRACT' — the data layer is not at the required completeness level (re-bake the data image, or lower vars.DATA_CONTRACT). Refusing to build the mcp image on an under-complete layer."
            exit 1
          fi
          # ORT pins single-sourced from scripts/fetch-model.sh (ort_pin_test keeps
          # them in lockstep with the Go DefaultORTVersion).
          ORT_V="$(grep -oE 'ORT_VERSION:-[0-9.]+' scripts/fetch-model.sh | head -1 | cut -d- -f2)"
          SHA_A="$(grep -E 'onnxruntime-linux-x64-' scripts/fetch-model.sh | grep -oE '[0-9a-f]{64}' | head -1)"
          SHA_R="$(grep -E 'onnxruntime-linux-aarch64-' scripts/fetch-model.sh | grep -oE '[0-9a-f]{64}' | head -1)"
          test -n "$DATA_DIGEST" && test -n "$DATA_LAYER_A" && test -n "$DATA_LAYER_R" && test -n "$ORT_V" && test -n "$SHA_A" && test -n "$SHA_R"
          {
            echo "data_image=$REPO@$DATA_DIGEST"
            echo "data_digest=$DATA_DIGEST"
            echo "data_manifest_amd64=$PM_A"
            echo "data_manifest_arm64=$PM_R"
            echo "data_layer_amd64=$DATA_LAYER_A"
            echo "data_layer_arm64=$DATA_LAYER_R"
            echo "data_created=$DATA_CREATED"
            echo "data_contract=$DATA_CONTRACT"
            echo "source_corpus=$SOURCE_CORPUS"
            echo "ort_version=$ORT_V"
            echo "ort_sha_amd64=$SHA_A"
            echo "ort_sha_arm64=$SHA_R"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # MULTI-ARCH via NATIVE runners (NOT QEMU): each arch builds on its own runner so
    # the CGO/DuckDB compile is native (fast) and the full target fetches the CORRECT
    # arch's ONNX Runtime (sha256-pinned in the Dockerfile). Each (variant,arch)
    # pushes BY DIGEST; the `manifest` job fuses them into the multi-arch tags.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90 # no bake anymore — compile + push
    strategy:
      fail-fast: false
      # ONE IMAGE, EVERYTHING IN IT. The `light` variant is gone.
      #
      # It was lighter only by the model and the ORT stack: it still carried the
      # full data layer, vectors included, and its binary — built with no tags —
      # could never use them. Measured: 7.32 GiB against 11.69, for an image that
      # answers lexically while shipping 821 146 vectors. Publishing a second
      # artefact that silently drops the feature the first one exists for is a
      # choice nobody was making on purpose.
      #
      # Its two legs were also the ones that kept dying on GHCR's rate limit:
      # they pulled the 10.9 GB corpus DIRECTLY, in parallel, while the full legs
      # inherit the same bytes from 3gpp-data by digest and never pull it at all.
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Run on manual dispatch / code push, or only when the chained bake SUCCEEDED.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # pull the private corpus artifact + push the image
      id-token: write # SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true

      # crane: the `full` image is assembled by REBASE, not by `FROM ${DATA_IMAGE}`.
      # We build only the small top layers (target: fulltop, ~200 MB) then crane-rebase
      # them onto 3gpp-data@digest — the ~22 GB data layer is referenced by digest and
      # NEVER materialised in buildkit (that materialisation is what ENOSPC-killed the
      # old full build on stock runners, even with Docker on /mnt). crane streams blobs
      # by reference (cross-repo mount within GHCR), so the build stays small on disk.
      - name: Install crane (rebase the full image onto the data layer, disk-safe)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          # Arch-aware asset (this leg runs on a NATIVE arm64 runner too): the x86_64
          # binary exits 126 on arm64. go-containerregistry assets use x86_64 / arm64.
          case "${{ matrix.arch }}" in
            amd64) crane_arch=x86_64 ;;
            arm64) crane_arch=arm64 ;;
            *) echo "::error::unsupported arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_${crane_arch}.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          crane version

      # not hard-fail on a transient Docker Hub timeout (the exact class of break
      # that killed the scheduled corpus build). build-push then finds it cached.
      - name: Pre-pull buildkit (retry; Docker Hub flakes)
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry docker pull moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # GHCR_PAT (not github.token): pushing with the CI token auto-links the image
      # to this PUBLIC repo → it inherits PUBLIC visibility. A PAT push stays
      # unlinked → born PRIVATE. (Same reason as corpus-matrix.)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # NO org.opencontainers.image.source label: it LINKS the package to the
          # public repo and forces PUBLIC inheritance (the leak). Keep only a
          # description; the image must stay PRIVATE (it bakes verbatim 3GPP text).
          # io.kodflow.3gpp.data.digest = the exact 3gpp-data digest this build
          # consumed (provenance; asserted by the gate job on the full variant).
          labels: |
            org.opencontainers.image.description=3GPP MCP server with the corpus DB baked in (PRIVATE)
            io.kodflow.3gpp.data.digest=${{ needs.resolve.outputs.data_digest }}
      # Build the SINGLE-arch image and push it BY DIGEST (no tags here — the `manifest`
      # job fuses the per-arch digests into the multi-arch tags). provenance:false keeps
      # the per-arch push a plain manifest so `imagetools` composes it cleanly.
      # target: the SMALL `fulltop` stage
      # (FROM the shared debian base, NO data layer) — the data layer is grafted on by
      # the crane rebase step below, never materialised in buildkit (disk-safe).
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          file: Dockerfile
          target: fulltop
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_TAGS=onnx,embed_ffi
            VARIANT=full
            VERSION=${{ github.sha }}
            DATA_IMAGE=${{ needs.resolve.outputs.data_image }}
            DATA_CREATED=${{ needs.resolve.outputs.data_created }}
            SOURCE_CORPUS=${{ needs.resolve.outputs.source_corpus }}
            ORT_VERSION=${{ needs.resolve.outputs.ort_version }}
            ORT_SHA256_AMD64=${{ needs.resolve.outputs.ort_sha_amd64 }}
            ORT_SHA256_ARM64=${{ needs.resolve.outputs.ort_sha_arm64 }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/3gpp-mcp,push-by-digest=true,name-canonical=true,push=${{ github.event.inputs.push != 'false' }}

      # REBASE (full only): graft the just-built fulltop layers onto 3gpp-data@<arch>
      # by reference. crane streams blobs (cross-repo mount in GHCR) — the ~22 GB data
      # layer is NEVER pulled/extracted locally, so this is disk-safe on a stock runner.
      # Both fulltop and 3gpp-data share the SAME pinned debian base, so old_base→new_base
      # is a clean swap. The consumed data digest is stamped as a label (the gate asserts
      # it). The rebased per-arch digest replaces the fulltop digest for the manifest job.
      - name: Rebase full onto 3gpp-data (crane, disk-safe)
        id: rebase
        if: ${{ github.event.inputs.push != 'false' }}
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          DATA_REPO: ghcr.io/${{ github.repository_owner }}/3gpp-data
          NEW_BASE_DIGEST: ${{ matrix.arch == 'amd64' && needs.resolve.outputs.data_manifest_amd64 || needs.resolve.outputs.data_manifest_arm64 }}
          DATA_DIGEST: ${{ needs.resolve.outputs.data_digest }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          deb="$(grep -oE 'debian:bookworm-slim@sha256:[0-9a-f]+' Dockerfile | head -1)"
          test -n "$deb" || { echo "::error::could not read the debian base pin from Dockerfile"; exit 1; }
          oldb="debian:bookworm-slim@$(retry crane digest --platform linux/${{ matrix.arch }} "$deb")"
          orig="$REPO@${{ steps.build.outputs.digest }}"
          newb="$DATA_REPO@$NEW_BASE_DIGEST"
          # Fixed per-arch staging tag (overwritten each run; the docker-image
          # concurrency group serialises runs). The manifest job references the
          # rebased image BY DIGEST, so this tag is just a transient handle.
          dst="$REPO:reb-staging-${{ matrix.arch }}"
          echo "rebase: original=$orig"
          echo "        old_base=$oldb"
          echo "        new_base=$newb"
          # The original image is a POSITIONAL arg (crane >=0.20 deprecated --original
          # and its cobra Args validator requires >=1 positional: passing --original
          # alone fails with "requires at least 1 arg(s), only received 0").
          retry crane rebase "$orig" --old_base "$oldb" --new_base "$newb" -t "$dst"
          # Stamp the consumed 3gpp-data digest (the gate asserts this label).
          retry crane mutate "$dst" --label io.kodflow.3gpp.data.digest="$DATA_DIGEST" -t "$dst"
          reb="$(retry crane digest "$dst")"
          echo "rebased $orig -> $reb (data $NEW_BASE_DIGEST)"
          echo "digest=$reb" | tee -a "$GITHUB_OUTPUT"

      - name: Export digest for the manifest job
        if: ${{ github.event.inputs.push != 'false' }}
        run: |
          mkdir -p /tmp/digests
          # The rebased image, never the built one: `build` produces the ~200 MB top
          # layers alone, and it is the crane rebase that puts them on the data layer.
          d='${{ steps.rebase.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ github.event.inputs.push != 'false' }}
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Fuse the per-arch (amd64 + arm64) digests of each variant into the multi-arch tags.
  manifest:
    needs: [build, resolve]
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tag discipline: a CODE push publishes ONLY :edge (never moves the pullable
          # moving tag), so a code change can never put :latest on top of a stale or
          # incomplete data layer. :latest moves only on the latest-publishing paths
          # (post-data-bake workflow_run / manual dispatch). enable= is resolved at
          # matrix-expansion time from github.event.
          #
          # `:full` is kept as an alias of `:latest` for anyone who pinned it while the
          # two variants existed. It now names the only image there is.
          - tag_lines: |
              type=raw,value=latest,enable=${{ github.event_name != 'push' }}
              type=raw,value=full,enable=${{ github.event_name != 'push' }}
              type=raw,value=edge,enable=${{ github.event_name == 'push' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          tags: |
            ${{ matrix.tag_lines }}
            type=sha,format=short
      - name: Create multi-arch manifest from the per-arch digests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          # DOCKER_METADATA_OUTPUT_JSON holds the JSON string itself (not a path);
          # feed it on stdin, otherwise jq treats the JSON as a filename to open.
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${REPO}@sha256:%s " *)
      - name: Verify multi-arch
        run: |
          set -euo pipefail
          # Inspect the tag actually published this run: moving tag on the latest paths,
          # the *-edge tag on a code push (tag discipline).
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="edge"
          else
            tag="latest"
          fi
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/3gpp-mcp:$tag" \
            | grep -E "Platform|MediaType" | head
      # COORDINATION / DEPLOY SIGNAL — record exactly which mcp image was published
      # and which (indexed) data layer it carries, plus the human action still
      # required: prod must pull + restart. The build already PROVED this layer is
      # fully indexed via the check-data inheritance guard, so the only remaining
      # step to fix a degraded prod is the redeploy. ([[project_served_stale_data_layer]])
      - name: Coordination summary (deploy signal)
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository_owner }}/3gpp-mcp
          if [ "${{ github.event_name }}" = "push" ]; then
            # CODE push: only :edge moved. :latest (the pullable prod tag) is UNCHANGED
            # and still sits on the last COMPLETE data layer — no redeploy implied.
            DIG="$(docker buildx imagetools inspect "$REPO:edge" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
            {
              echo "## 3gpp-mcp:edge published (code change) — :latest UNCHANGED"
              echo ""
              echo "| field | value |"
              echo "|---|---|"
              echo "| edge image | \`$REPO:edge\` ($DIG) |"
              echo "| guard | lenient (FTS+HNSW) — code push does not enforce the full data contract |"
              echo ""
              echo "The pullable \`:latest\` was NOT moved. It only advances after a COMPLETE data bake (workflow_run path). No redeploy required for this code change."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIG="$(docker buildx imagetools inspect "$REPO:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          {
            echo "## 3gpp-mcp:full published on a COMPLETE data layer — DEPLOY required"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| mcp image | \`$REPO:latest\` ($DIG) |"
            echo "| inherited 3gpp-data digest | \`${{ needs.resolve.outputs.data_digest }}\` |"
            echo "| data baked | ${{ needs.resolve.outputs.data_created }} |"
            echo "| source corpus | \`${{ needs.resolve.outputs.source_corpus }}\` |"
            echo ""
            echo "The **check-data** guard proved this image's data layer meets the completeness contract (FTS + frozen HNSW + dense-complete + contract level)."
            echo "**Action**: on the labs host \`docker pull $REPO:latest\` then restart the container to serve this layer."
            echo "Verify after restart: \`curl -s https://labs.making.codes/dashboard.json?token=… | jq '{hnsw_state,fts_index_present,data_image_created}'\` → expect \`hnsw_state:\"frozen\"\`, \`fts_index_present:true\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # DEDUPE GATE (split-data-image) — the whole split is worth nothing if the mcp
  # build RE-CREATES the data blob instead of inheriting 3gpp-data's. Now that
  # full is `FROM ${DATA_IMAGE}`, inheritance lists the base's layers verbatim,
  # so this gate should PASS by construction. Manifest-based (never buildx logs):
  # for EACH platform of :latest, assert
  #   1. THAT ARCH's exact 3gpp-data data blob appears in the image's layer list;
  #   2. it is the ONLY layer > 1 GiB (no accidental second giant blob);
  #   3. the io.kodflow.3gpp.data.digest label equals the index digest consumed.
  # If this gate fails: the Dockerfile stopped inheriting via FROM (e.g. someone
  # reintroduced a COPY of the data) — restore `FROM ${DATA_IMAGE}` for full.
  gate:
    needs: [resolve, manifest]
    if: ${{ github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert the mcp image references the exact 3gpp-data blob
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DATA_LAYER_AMD64: ${{ needs.resolve.outputs.data_layer_amd64 }}
          DATA_LAYER_ARM64: ${{ needs.resolve.outputs.data_layer_arm64 }}
          DATA_DIGEST: ${{ needs.resolve.outputs.data_digest }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          # Assert against the tag actually published this run (tag discipline): the
          # moving :latest on the latest paths, :edge on a code push.
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="ghcr.io/${{ github.repository_owner }}/3gpp-mcp:edge"
          else
            REF="ghcr.io/${{ github.repository_owner }}/3gpp-mcp:latest"
          fi
          fail=0
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) want="$DATA_LAYER_AMD64" ;;
              arm64) want="$DATA_LAYER_ARM64" ;;
            esac
            d="$(crane manifest "$REF" | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')"
            test -n "$d" || { echo "::error::no linux/$arch manifest on $REF"; fail=1; continue; }
            m="$(crane manifest "ghcr.io/${{ github.repository_owner }}/3gpp-mcp@$d")"
            echo "--- linux/$arch ($d) expects data blob $want; layers:"; printf '%s' "$m" | jq -r '.layers[] | (.size|tostring) + "  " + .digest'
            printf '%s' "$m" | jq -e --arg l "$want" '.layers[] | select(.digest == $l)' >/dev/null \
              || { echo "::error::linux/$arch does NOT reference the 3gpp-data blob $want — full stopped inheriting via FROM (a COPY of the data was reintroduced?)"; fail=1; }
            big="$(printf '%s' "$m" | jq '[.layers[] | select(.size > 1073741824)] | length')"
            bigd="$(printf '%s' "$m" | jq -r '[.layers[] | select(.size > 1073741824)][0].digest // empty')"
            { [ "$big" = "1" ] && [ "$bigd" = "$want" ]; } \
              || { echo "::error::linux/$arch has $big layer(s) >1GiB (first: ${bigd:-none}) — expected exactly the 3gpp-data blob"; fail=1; }
            cfgd="$(crane config "ghcr.io/${{ github.repository_owner }}/3gpp-mcp@$d" | jq -r '.config.Labels["io.kodflow.3gpp.data.digest"] // empty')"
            [ "$cfgd" = "$DATA_DIGEST" ] \
              || { echo "::error::linux/$arch label io.kodflow.3gpp.data.digest=$cfgd != consumed $DATA_DIGEST"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "GATE OK: each platform inherits its arch's 3gpp-data blob, correctly labeled"
          exit "$fail"
      # ANTI-LEAK, fail-loud (the 3gpp-mcp package was found PUBLIC on 2026-06-11
      # with the verbatim corpus inside — repo-page badge audit): verify after
      # EVERY push, self-heal (PATCH to private), fail if the heal fails.
      - name: Assert 3gpp-mcp is PRIVATE (self-heal then fail-loud)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-mcp" --jq '.visibility' 2>/dev/null || echo absent)"
          echo "3gpp-mcp visibility: $vis"
          if [ "$vis" = "public" ]; then
            echo "::warning::3gpp-mcp is PUBLIC — attempting self-heal to private"
            gh api -X PATCH "/user/packages/container/3gpp-mcp/visibility" -f visibility=private >/dev/null 2>&1 || true
            vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/3gpp-mcp" --jq '.visibility' 2>/dev/null || echo absent)"
            echo "after heal: $vis"
          fi
          [ "$vis" = "private" ] || { echo "::error::3gpp-mcp is '$vis' (must be private — verbatim 3GPP text). Fix in the UI: Packages → 3gpp-mcp → Settings → Change visibility."; exit 1; }
