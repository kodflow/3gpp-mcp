# =============================================================================
#  Corpus · Seed latest      (ONE-SHOT bootstrap of the GHCR base image)
# =============================================================================
#
#  WHY  The GHCR migration publishes the corpus to ghcr.io/<owner>/3gpp-corpus:latest
#       and the merge job FAIL-CLOSES a delta publish when that base image is absent
#       ("no 3gpp-corpus:latest base image — refusing to clobber latest with a
#       delta-only rebuild"). The image never existed because every scheduled publish
#       died on the docker-create-scratch bug (now fixed, #103) before reaching merge.
#       So the very first delta has nothing to fold over.
#
#  WHAT This job seeds that base ONCE from the frozen public `latest` Release DB
#       (the pre-migration full lexical snapshot, identical pipeline_version to the
#       current code → a delta will ACCEPT it as base and fold the changed series on
#       top, preserving the unchanged series' chunk_ids and thus the already-collected
#       embeds). After this runs, a normal delta (corpus-matrix) publishes the real
#       `latest`, and this workflow is never needed again.
#
#  AFTER Re-run the failed merge of the delta build, or dispatch corpus-matrix again.
#
#  This is a TRANSITION tool. Delete it once `latest` is healthy on GHCR.
# =============================================================================
name: Corpus · Seed latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the full lexical DB to seed from."
        type: string
        default: "latest"

concurrency:
  group: corpus-build # share the corpus-matrix lock — never seed while a build publishes
  cancel-in-progress: false

permissions:
  contents: read # download the Release assets
  packages: write # push the seed image

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the full lexical DB + indexes from the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eu
          mkdir -p seed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p '3gpp.duckdb.zst' -p 'corpus-index.json' -p 'subject-index.json' \
            -p 'build-index.json' -D seed
          # zstd is preinstalled on ubuntu-latest; --long=27 matches the publish window.
          zstd -d --long=27 -f seed/3gpp.duckdb.zst -o seed/3gpp.duckdb
          rm -f seed/3gpp.duckdb.zst
          ls -lh seed/

      - name: Guard — seed carries the whole corpus (no truncated base)
        run: |
          set -eu
          # A seed that is missing series would publish a SHRUNK latest. The Release
          # snapshot has ~2.85M clauses across 31 series; assert a sane floor so a
          # partial download can't poison the base.
          python3 - <<'PY'
          import json, sys
          idx = json.load(open("seed/corpus-index.json"))
          keys = len(idx) if isinstance(idx, dict) else 0
          print(f"corpus-index keys = {keys}")
          if keys < 5000:
              sys.exit(f"::error::corpus-index.json has only {keys} keys — refusing to seed a truncated base")
          PY

      - name: Login + build + push the seed image
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -eu
          echo "$GHCR_PAT" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
          printf 'FROM scratch\nCOPY 3gpp.duckdb /3gpp.duckdb\nCOPY corpus-index.json /corpus-index.json\nCOPY subject-index.json /subject-index.json\nCOPY build-index.json /build-index.json\n' > seed/Dockerfile.corpus
          printf '%s\n' 'Dockerfile.corpus' '.dockerignore' > seed/.dockerignore
          DATE=$(date -u +%Y-%m-%d)
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-corpus"
          # --provenance=false --sbom=false: publish :latest as a SINGLE plain image
          # manifest, NOT a buildx provenance INDEX whose untagged child platform
          # manifest the GHCR retention prune orphans → :latest dangles → pull 404 →
          # the embed kernel's FAIL=ghcr_export. Exactly how the previous latest broke.
          docker buildx build --push --provenance=false --sbom=false -f seed/Dockerfile.corpus \
            -t "${REPO}:latest" -t "${REPO}:${DATE}-seed" seed/
          echo "seeded ${REPO}:latest (+ ${DATE}-seed)"

      - name: Make corpus + shard packages PRIVATE (anti-leak; best-effort)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -eu
          # The package is born PUBLIC on a public repo. The merge anti-leak assertion
          # fail-closes a publish while corpus/shard are public, so flip them now. The
          # visibility endpoint needs an admin-scoped token — GHCR_PAT (delete:packages)
          # usually has it; if not, set them private in the UI (Settings → visibility).
          for pkg in 3gpp-corpus 3gpp-shard; do
            if gh api -X PATCH "/user/packages/container/$pkg/visibility" \
                 -f visibility=private >/dev/null 2>&1; then
              echo "$pkg → private"
            else
              echo "::warning::could not set $pkg private via API — set it private in the UI before the next corpus publish"
            fi
          done
