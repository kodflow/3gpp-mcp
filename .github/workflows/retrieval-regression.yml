# =============================================================================
#  Retrieval · Regression gate  — the NATIVE, GPU-free "suivi" of retrieval quality
# =============================================================================
#  WHY this exists
#    Kaggle (the embed path) is a notebook runner: no webhook, no live tracking —
#    fighting it for "suivi" is the wrong tool. Quality tracking belongs HERE, on
#    GitHub Actions: it runs on every PR, on CPU, against a LEXICAL DuckDB snapshot
#    (no embeddings, no Kaggle, no external service), and gates the merge with
#    native logs + artifacts + a diff-vs-baseline. Embedding the corpus stays a
#    rare, separate job whose only "suivi" need is done/error.
#
#  WHAT it does
#    Pulls the lexical 3gpp.duckdb from the private GHCR corpus image, builds
#    cmd/bench (CGO/DuckDB), scores the graded LI/5GC query set, and compares the
#    macro IR metrics to a committed baseline. -systems lexical keeps it embedding-
#    free; hybrid/rerank are intentionally NOT scored here (they need vectors).
#
#  BASELINE bootstrap (one-time, manual — keeps the gate honest)
#    Until docs/inputs/eval/baseline.json is committed, the gate SELF-SEEDS and stays
#    advisory (never blocks). To make it binding: run this workflow once, download the
#    `retrieval-metrics` artifact, commit it as docs/inputs/eval/baseline.json. From
#    then on any tracked-metric drop > tol fails the PR.
#
#  Fork PRs have no access to GHCR secrets → the DB pull is skipped and the gate
#  is a no-op (a notice explains why). Same-repo branch PRs run fully.
# =============================================================================

name: Retrieval · Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/bench/**"
      - "internal/eval/**"
      - "internal/search/**"
      - "internal/store/**"
      - "internal/rerank/**"
      - "docs/inputs/eval/**"
      - ".github/workflows/retrieval-regression.yml"
  workflow_dispatch:
    inputs:
      tol:
        description: "Absolute regression tolerance for tracked metrics"
        default: "0.02"

permissions:
  contents: read
  packages: read

concurrency:
  group: retrieval-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  CRANE_VER: "v0.20.2"
  OWNER: ${{ github.repository_owner }}
  # Prefer the read:packages-only token; fall back to the broader GHCR_PAT so the
  # gate works before GHCR_READ_PAT is added. Empty on fork PRs → pull skipped.
  GHCR_TOKEN: ${{ secrets.GHCR_READ_PAT || secrets.GHCR_PAT }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - name: Pull lexical DuckDB from private GHCR corpus image
        id: db
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::notice::no GHCR token (fork PR?) — skipping retrieval regression gate"
            echo "have_db=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data
          # Tolerate a missing / broken / unpullable base image: this gate is advisory
          # infra and must NEVER fail a PR because the corpus image is temporarily
          # absent (e.g. a dangling :latest after a prune). The whole pull is the
          # condition of an `if`, so set -e/pipefail can't abort the job mid-pull — any
          # failure just sets have_db=0 and the gate is skipped with a notice.
          # The corpus image is FROM scratch: `crane export` flattens its filesystem
          # to a tar from which we extract just the lexical DB.
          if curl -fsSL --retry 5 -o /tmp/crane.tgz \
                "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz" \
             && tar -xzf /tmp/crane.tgz -C /tmp crane \
             && printf '%s' "$GHCR_TOKEN" | /tmp/crane auth login ghcr.io -u "$OWNER" --password-stdin \
             && /tmp/crane export "ghcr.io/${OWNER}/3gpp-corpus:latest" - | tar -xC data 3gpp.duckdb \
             && test -s data/3gpp.duckdb; then
            echo "have_db=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::could not pull a usable 3gpp-corpus base (broken/absent :latest?) — skipping retrieval gate (advisory)"
            echo "have_db=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Score retrieval + gate vs baseline
        if: steps.db.outputs.have_db == '1'
        run: |
          go build -o /tmp/bench ./cmd/bench
          /tmp/bench \
            -db data/3gpp.duckdb \
            -systems lexical \
            -json retrieval-metrics.json \
            -baseline docs/inputs/eval/baseline.json \
            -tol "${{ github.event.inputs.tol || '0.02' }}" \
            2>&1 | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics (baseline candidate)
        if: steps.db.outputs.have_db == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: retrieval-metrics
          path: retrieval-metrics.json
          if-no-files-found: warn
