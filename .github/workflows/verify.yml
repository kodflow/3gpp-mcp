name: Verify (all)

# Comprehensive verification gate: Go (build+vet+test+gofmt), scripts/config
# (py-compile kernels, bash -n, YAML parse), and a Dockerfile build smoke (lexical,
# no DB, no push). Runs on every push/PR + nightly, so a regression is caught before
# the nightly image build. This is CODE verification — it needs no corpus and no secrets.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 2 * * *" # nightly ~03:11–04:11 Europe/Paris; gates the image build

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt (fail on unformatted)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "::error::unformatted:"; echo "$unformatted"; exit 1; fi
      - name: build
        run: CGO_ENABLED=1 go build ./...
      - name: vet
        run: CGO_ENABLED=1 go vet ./...
      - name: test
        run: CGO_ENABLED=1 go test ./...

  scripts-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: python kernels compile
        run: python3 -m py_compile scripts/kaggle/kernel-embed.py scripts/kaggle/kernel-embed-probe.py
      - name: shell syntax (bash -n)
        run: |
          set -euo pipefail
          for s in $(git ls-files '*.sh'); do bash -n "$s"; done
          [ -f docker-entrypoint.sh ] && bash -n docker-entrypoint.sh || true
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
          # advisory: don't fail the gate on style, only on real errors (-S error)
          for s in $(git ls-files '*.sh') docker-entrypoint.sh; do
            [ -f "$s" ] && shellcheck -S error "$s" || true
          done
      - name: YAML workflows parse
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f)); print("ok", f)
              except Exception as e:
                  print("PARSE ERROR", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build image (lexical, no DB, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
