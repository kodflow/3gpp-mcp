# =============================================================================
#  ETSI · Build   — PARALLEL to "Corpus · Build" (3GPP), same process, own cache
# =============================================================================
#  Mirrors the 3GPP corpus build for the ETSI /deliver archive: discover-etsi →
#  fetch PDFs → convert_pdf (poppler text-layer, NO OCR) → ingest --etsi → publish a
#  private ghcr.io/<owner>/etsi-corpus image. It runs as a SEPARATE workflow from
#  corpus-matrix so the two corpora build INDEPENDENTLY and IN PARALLEL.
#
#  CRASH-SAFETY / RESUME / SPLIT (the user's hard requirement):
#   - the converted-HTML dir (data/sources/convert-etsi) is GH-Actions-cached, so a
#     re-run SKIPS already-converted deliverables (etsi-corpus.sh checks -s target);
#   - `ingest --etsi --resume` skips (spec,version) tuples already 'done';
#   - a runner kill therefore resumes from the last converted/ingested spec, never
#     from zero — exactly like the 3GPP shard cache + ingest resume.
#
#  Scope: the LI suite by default (cmd/discover-etsi), widened via the `specs` input.
#  ETSI is tens of thousands of off-domain PDFs; the scope is an explicit, scalable
#  id list so the job always fits a single runner (no heavy series-sharding needed).
# =============================================================================
name: ETSI · Build

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Override the ETSI scope (comma-separated ids, e.g. '103 221-1,103 280'). Empty = the built-in LI suite."
        required: false
        default: ""
      all:
        description: "Enumerate the WHOLE ETSI /deliver corpus (etsi_ts+tr+en) — latest published of EVERY deliverable, not just the LI suite. Tens of thousands of specs (long run)."
        required: false
        default: "false"
      publish:
        description: "Push the etsi-corpus image to GHCR (private). Default true."
        required: false
        default: "true"
# [local-pipeline] trigger desactive — indexation deplacee en local (make)
#  schedule:
#    - cron: "37 5 * * 1" # weekly (Mon 05:37 UTC) — ETSI moves slowly; the cache makes re-runs cheap
  push:
    branches: [main]
    paths:
      - "cmd/discover-etsi/**"
      - "internal/etsicat/**"
      - "internal/model/etsi.go"
      - "scripts/etsi-corpus.sh"
      - "scripts/lib/convert.sh"
      - ".github/workflows/etsi-matrix.yml"

concurrency:
  group: etsi-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-etsi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the private etsi-corpus image
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # poppler = the text-layer PDF extractor (NOT OCR); zstd for the image layer.
      - name: Install poppler-utils + zstd
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends poppler-utils zstd
          pdftotext -v 2>&1 | head -1 || true

      # RESUME: the converted-HTML dir, keyed by the conversion code so a logic change
      # busts it but a re-run otherwise reuses every already-converted deliverable.
      - name: Restore converted-ETSI cache (resume)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: data/sources/convert-etsi
          key: etsi-convert-v1-${{ hashFiles('scripts/etsi-corpus.sh', 'scripts/lib/convert.sh', 'cmd/discover-etsi/**', 'internal/etsicat/**') }}
          restore-keys: |
            etsi-convert-v1-

      - name: Build the ETSI corpus (discover → fetch → convert → ingest)
        env:
          ETSI_SPECS: ${{ github.event.inputs.specs }}
          # all=true → ETSI_ALL=1 → discover-etsi --all enumerates the whole /deliver
          # corpus (3GPP-parity completeness, not just the LI suite).
          ETSI_ALL: ${{ github.event.inputs.all == 'true' && '1' || '' }}
          ETSI_OUT: data/etsi.duckdb
        run: |
          set -euo pipefail
          scripts/etsi-corpus.sh
          echo "=== clause count ==="
          CGO_ENABLED=1 go run ./cmd/validate --db data/etsi.duckdb --require-fts --min-clauses 1 || {
            echo "::warning::etsi DB failed validation (no clauses yet?) — not publishing"; echo "VALIDATED=0" >> "$GITHUB_ENV"; exit 0; }
          echo "VALIDATED=1" >> "$GITHUB_ENV"

      - name: Upload etsi.duckdb artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etsi-duckdb
          path: data/etsi.duckdb
          if-no-files-found: ignore
          retention-days: 7

      # Publish the private etsi-corpus image (FROM scratch + the DB), mirroring the
      # 3gpp-corpus publish. PAT push (not the CI token) keeps the package PRIVATE
      # (it carries verbatim ETSI text). Only on a validated build + publish=true.
      - name: Publish etsi-corpus image (GHCR, private)
        if: ${{ env.VALIDATED == '1' && github.event.inputs.publish != 'false' }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          source scripts/lib/retry.sh
          [ -n "${GHCR_PAT:-}" ] || { echo "::notice::GHCR_PAT absent — skipping publish"; exit 0; }
          retry bash -c "curl -fsSL 'https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz' | sudo tar -xz -C /usr/local/bin crane"
          retry bash -c 'printf %s "$GHCR_PAT" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
          REPO="ghcr.io/${{ github.repository_owner }}/etsi-corpus"
          work="$(mktemp -d)"; cp data/etsi.duckdb "$work/etsi.duckdb"
          ( cd "$work" && tar -cf layer.tar etsi.duckdb )
          DATE="$(date -u +%F)"
          # No -b: crane's empty base IS scratch. Passing "-b scratch" makes crane try
          # to PULL docker.io/library/scratch (MANIFEST_UNKNOWN) — that 0-clause-publish
          # failure even on a validated 2235-clause DB. Omitting --base = true FROM scratch.
          retry crane append --oci-empty-base -f "$work/layer.tar" -t "$REPO:$DATE"
          retry crane tag "$REPO:$DATE" latest
          echo "published $REPO:$DATE (+ :latest)"
          # Anti-leak: etsi-corpus carries verbatim ETSI text → must be PRIVATE.
          vis="$(GH_TOKEN=$GHCR_PAT gh api "/users/${{ github.repository_owner }}/packages/container/etsi-corpus" --jq '.visibility' 2>/dev/null || echo absent)"
          if [ "$vis" = "public" ]; then
            GH_TOKEN=$GHCR_PAT gh api -X PATCH "/user/packages/container/etsi-corpus/visibility" -f visibility=private >/dev/null 2>&1 || true
          fi
