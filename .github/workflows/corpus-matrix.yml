# =============================================================================
#  Corpus · Build      (3gpp.org → DuckDB → published `latest` release)
# =============================================================================
#
#  WHEN it runs      (1) workflow_dispatch — manual, you choose the inputs;
#                    (2) push to main — only when a corpus/pipeline file changes
#                        (paths filter); a delta build that republishes `latest`;
#                    (3) schedule — weekly hands-off delta (new specs + OpenAPI).
#                    A no-op delta costs ~1 min (empty matrix). A killed shard is
#                    auto-resumed by "Corpus · Auto-resume".
#
#  WHAT it does      Builds the 3GPP corpus into a DuckDB snapshot, in parallel:
#                      discover      → which series to (re)build (delta vs the
#                                      published index, or all on full=true;
#                                      a changed subject also pulls its series in)
#                      build-shard   → 1 runner per series: download → convert
#                                      (LibreOffice) → LEXICAL ingest → shard DB
#                      embed (opt-in)→ embed=true only: cmd/embed vectorises each
#                                      shard, re-embedding ONLY changed clauses
#                      merge         → fuse shards (delta: replace only changed
#                                      (series,release) buckets over the `latest`
#                                      base; full: fresh). Enrich (catalog+API),
#                                      write corpus-index.json + subject-index.json
#                      publish-vec   → embed=true only: push vector sub-bases→GHCR
#
#  WHAT it PUBLISHES Only when publish_to_latest=true AND it's a whole-corpus run
#                    (no series_scope, not a PR): the PRIVATE GHCR data image
#                    ghcr.io/<owner>/3gpp-corpus:<YYYY-MM-DD>+:latest (DB+indexes);
#                    embed=true also pushes GHCR 3gpp-vec. Shards are PRIVATE images
#                    ghcr.io/<owner>/3gpp-shard:<series>[-embed][-<run_id>].
#                    A scoped/test run pushes only its shard image (never :latest).
#
#  OPERATIONAL PREREQS (one-time, GHCR migration — plan velvety-nibbling):
#    1. Make the packages PRIVATE — there is NO REST API for package visibility, it
#       is UI-ONLY: github.com/users/<owner>/packages → 3gpp-corpus (and 3gpp-shard,
#       3gpp-mcp, 3gpp-vec) → Package settings → Change visibility → Private. A
#       package exists only after its first push, so: 1st run creates it (PUBLIC by
#       default) → set it private in the UI ONCE → every later push stays private.
#       The merge job FAIL-CLOSES the publish (read-only visibility assertion) if
#       3gpp-corpus/3gpp-shard are public, so a forgotten/reverted package blocks
#       publication instead of leaking verbatim 3GPP text.
#    2. Retention (the `prune` job) deletes old package versions, which GITHUB_TOKEN
#       CANNOT do → add a classic PAT secret GHCR_PAT (scope: delete:packages).
#       Without it, prune no-ops with a notice (old versions just accumulate).
#
#  WHAT it does NOT  No semantic by default (embed=false → lexical only; embedding
#                    is the separate manual "Corpus · Embed (Kaggle GPU)" job). Does
#                    not build the user binaries (that's "Release"). Does not run on
#                    non-pipeline code changes (paths filter). Free runners cap each
#                    shard at 6h → big series are auto-resumed, not lost.
# =============================================================================

name: Corpus · Build

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full rebuild: index ALL series (ignore the index / no base)."
        type: boolean
        default: false
      series_scope:
        description: "Explicit scope, space-separated. Either a bare series (e.g. '21 33') or a series|release sub-shard to keep big series under the 6h cap (e.g. '24|Rel-19 33|Rel-19'). Empty = auto delta from the index."
        type: string
        default: ""
      release_floor:
        description: "Lowest release to ingest (default Rel-99 = all real 3GPP releases (Rel-99..latest); not frozen)."
        type: string
        default: "Rel-99"
      include_legacy_gsm:
        description: "Also index legacy GSM Phase 1/2 LEXICALLY under the honest 'GSM' bucket (§0; never vectorised). Pair with a legacy series in series_scope, e.g. '04 05 08'."
        type: boolean
        default: false
      publish_to_latest:
        description: "Publish the consolidated DB + index to the rolling 'latest' release (ONLY honoured on a whole-corpus run: no series_scope, not a PR)."
        type: boolean
        default: false
      embed:
        description: "SEMANTIC (off by default): after the lexical ingest, run cmd/embed to vectorise each shard (BGE-M3, -tags onnx) re-embedding only changed clauses; publish the per-series vector sub-bases to GHCR (Option B). Slow on CPU (~1 clause/s)."
        type: boolean
        default: false
      embed_floor:
        description: "Embed only clauses at/above this release (vectors are recent-only; lexical stays full)."
        type: string
        default: "Rel-15"
      shard_timeout_minutes:
        description: "Per-shard timeout (max 360 on free hosted runners; lower to force the auto-resume chain quickly during testing — e.g. 10 to validate resume in ~30min)."
        type: string
        default: "360"
  # AUTOMATIC on merge to main: a delta (append) lexical build — FULL the first time
  # (no published index yet), then only the changed series on later merges. discover
  # diffs the live 3GPP status + the build identities vs the published `latest`, so a
  # no-op merge produces an empty matrix and costs ~1 min. Publishes to `latest` and
  # includes Phase 1/2 (legacy GSM). Embedding is NOT done here — it is the separate,
  # manual Kaggle job (corpus-embed-kaggle.yml).
  push:
    branches: [main]
    # Only auto-run when something that actually affects the corpus changes — so an
    # unrelated merge (docs, the embed/serve code, the Kaggle scripts) does NOT kick
    # off the heavy build. discover still makes a triggered run a near-no-op when the
    # 3GPP site hasn't moved either.
    paths:
      - 'cmd/ingest/**'
      - 'cmd/merge/**'
      - 'cmd/discover/**'
      - 'cmd/ingest-catalog/**'
      - 'rust/ingest/**'
      - 'internal/ingest/**'
      - 'internal/htmlparse/**'
      - 'internal/ooxml/**'
      - 'internal/model/**'
      - 'internal/catalog/**'
      - 'internal/openapi/**'
      - 'internal/subject/**'
      - 'internal/subjectmeta/**'
      - 'internal/registry/**'
      - 'internal/store/schema.sql'
      - 'scripts/corpus.sh'
      - 'scripts/lib/convert.sh'
      - 'scripts/convert-origin.sh'
      - '.github/workflows/corpus-matrix.yml'
  # HANDS-OFF daily refresh: a delta build that picks up new 3GPP spec versions
  # (discover diffs the live status report) AND new 5GC OpenAPI releases (fetch auto).
  # Near-no-op when nothing moved (~1-2 min discover, empty matrix). Publishes `latest`,
  # includes Phase 1/2. CONTINUITY: this lexical build does NOT embed on-runner (CPU is
  # ~1 clause/s); instead, when the repo VARIABLE `AUTO_EMBED_ON_BUILD` == 'true' and a
  # delta was published, the `dispatch-embed` job hands the changed series to the GPU
  # embed (Corpus · Embed (Kaggle GPU)) so vectors track the corpus automatically. With
  # the variable unset (default) the embed stays a separate, independently-dispatchable
  # job — no surprise Kaggle spend. Either way the two halves are one coherent system.
  schedule:
    - cron: "17 4 * * *"   # every day ~04:17 UTC (off-peak, not midnight)

# One corpus build at a time. On back-to-back merges, CANCEL the in-flight build and
# let the newest one supersede it: a delta build diffs against the published `latest`,
# so the superseding run is a SUPERSET (it re-does anything the cancelled run dropped)
# and ends by re-publishing `latest` — the final state is always the newest merge's.
# This guarantees we never stack two identical corpus builds.
concurrency:
  group: corpus-build
  cancel-in-progress: true

permissions:
  contents: read # discover/build-shard read-only; merge elevates per-job

env:
  CGO_ENABLED: "1"
  # Pinned ONNX Runtime version — MUST match DefaultORTVersion in
  # internal/bootstrap/models.go (and scripts/fetch-model.sh). Embedded in the
  # cached model bundle filename so a bump auto-invalidates a stale bundle.
  ORT_VERSION: "1.26.0"
  # Pinned HuggingFace commit SHAs — MUST match the bgeCommit / rerankCommit
  # constants in internal/bootstrap/models.go and the URLs in
  # scripts/fetch-model.sh. The first 8 hex chars are embedded in the per-
  # component asset filenames, so bumping a SHA auto-invalidates the cached
  # asset on the 'models' release. preflight (job below) verifies all three
  # places stay in lockstep.
  BGE_COMMIT: "5617a9f61b028005a4858fdac845db406aefb181"
  RERANK_COMMIT: "87449985a27bbd817f13ee2338df130bdb532bad"

jobs:
  # ---- 0. preflight: ORT_VERSION must be IDENTICAL across YAML / Go / shell.
  # The manual 3-way coupling is exactly the failure mode #41 tries to prevent
  # at the bundle-cache layer — so we fail-closed at the source. Cheap (<5 s).
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Pin sync — ORT_VERSION + HF commit SHAs (YAML env vs Go vs shell)
        run: |
          set -eu
          # check_pin <name> <yaml-value> <go-regex> <shell-regex>
          #   Extracts the same value from internal/bootstrap/models.go and
          #   scripts/fetch-model.sh, compares the trio. Fails CLOSED so a
          #   silent drift never reaches the model-bundle build (a drifted
          #   commit SHA would otherwise reuse a stale cached asset under the
          #   same fixed name and never re-fetch — exactly the bug PR #45
          #   addresses at the cache-key level).
          check_pin() {
            local name="$1" wf="$2" go_re="$3" sh_re="$4"
            local go_ sh_
            go_=$(grep -oE "$go_re" internal/bootstrap/models.go | head -1 | grep -oE '"[^"]+"' | tr -d '"')
            sh_=$(grep -oE "$sh_re" scripts/fetch-model.sh | head -1 | grep -oE '[A-Za-z0-9._-]{8,}' | tail -1)
            if [ -z "$wf" ] || [ -z "$go_" ] || [ -z "$sh_" ]; then
              echo "::error::could not extract $name (workflow=$wf go=$go_ shell=$sh_)"; return 1
            fi
            if [ "$wf" != "$go_" ] || [ "$wf" != "$sh_" ]; then
              echo "::error::$name desync — workflow=$wf, models.go=$go_, fetch-model.sh=$sh_"
              echo "::error::bump all three TOGETHER (see comment near env: $name)"
              return 1
            fi
            echo "OK: $name=$wf (uniform across YAML/Go/shell)"
          }
          # ORT_VERSION: numeric default in fetch-model.sh, const in Go.
          ort_sh=$(grep -oE 'ORT_VERSION:-[0-9][^}]+' scripts/fetch-model.sh | head -1 | sed 's/^ORT_VERSION:-//')
          if [ "$ORT_VERSION" != "$(grep -oE 'DefaultORTVersion = "[^"]+"' internal/bootstrap/models.go | head -1 | grep -oE '"[^"]+"' | tr -d '"')" ] \
             || [ "$ORT_VERSION" != "$ort_sh" ]; then
            echo "::error::ORT_VERSION desync"; exit 1
          fi
          echo "OK: ORT_VERSION=$ORT_VERSION"
          # HF commits: 40-hex sha pinned in 3 places (Go const, shell URL, YAML env).
          check_pin "BGE_COMMIT"    "$BGE_COMMIT"    'BGECommit\s*=\s*"[0-9a-f]+"'    'BAAI/bge-m3/resolve/[0-9a-f]+'
          check_pin "RERANK_COMMIT" "$RERANK_COMMIT" 'rerankCommit\s*=\s*"[0-9a-f]+"' 'celinehoang/bge-reranker-v2-m3-onnx/resolve/[0-9a-f]+'
      # Workflow-dispatch input validation (Qodo PR #49). Fails CLOSED before
      # any expensive job spends a runner-minute on a bad input.
      - name: Validate workflow inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_TIMEOUT: ${{ github.event.inputs.shard_timeout_minutes }}
          IN_EMBED_FLOOR: ${{ github.event.inputs.embed_floor }}
          IN_RELEASE_FLOOR: ${{ github.event.inputs.release_floor }}
        run: |
          set -eu
          # shard_timeout_minutes: positive integer, 1..360. Any value > 360
          # is a no-op (platform hard-caps anyway), so reject loud rather than
          # let the user think 720 means 12h. fromJSON() downstream would also
          # fail on non-numeric, but here we fail with a CLEAR message early.
          if ! printf '%s' "${IN_TIMEOUT:-360}" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::shard_timeout_minutes must be a positive integer (got: '${IN_TIMEOUT}')"; exit 1
          fi
          if [ "${IN_TIMEOUT:-360}" -gt 360 ]; then
            echo "::error::shard_timeout_minutes=${IN_TIMEOUT} exceeds the GitHub free-runner hard cap of 360 — the platform will kill the job at 360 regardless. Lower it or accept default 360."; exit 1
          fi
          # release_floor + embed_floor: must look like Rel-<number> so the
          # cache key + downstream filters can rely on the shape.
          for var in IN_EMBED_FLOOR IN_RELEASE_FLOOR; do
            val=$(eval echo \$$var)
            if [ -n "$val" ] && ! printf '%s' "$val" | grep -qE '^Rel-(99|[0-9]{1,2})$'; then
              echo "::error::$var must match ^Rel-(99|[0-9]{1,2})\$ (got: '$val')"; exit 1
            fi
          done
          echo "OK: shard_timeout=${IN_TIMEOUT:-360}m, embed_floor=${IN_EMBED_FLOOR}, release_floor=${IN_RELEASE_FLOOR}"

  # ---- 1. dynamic, delta-sized discovery → matrix --------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      floor: ${{ steps.set.outputs.floor }}
      full: ${{ steps.set.outputs.full }}
      publish: ${{ steps.set.outputs.publish }}
      sparse_needed: ${{ steps.set.outputs.sparse_needed }}
      sparse_id: ${{ steps.set.outputs.sparse_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - id: set
        run: |
          scope="${{ github.event.inputs.series_scope }}"
          floor="${{ github.event.inputs.release_floor }}"
          full="${{ github.event.inputs.full }}"
          # PR validation: tiny fixed scope.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope="21 24"; floor="Rel-19"; full="false"
          fi
          # AUTO (push to main): no dispatch inputs are present, so default the floor
          # to Rel-99 (whole modern corpus). scope stays empty → delta-or-full discover;
          # publish is enabled below; INCLUDE_LEGACY_GSM (Phase 1/2) is set on convert.
          [ -n "$floor" ] || floor="Rel-99"
          if [ -n "$scope" ]; then
            matrix=$(printf '%s\n' $scope | jq -R . | jq -cs .)   # explicit series
          else
            # Auto: diff the live 3GPP status report vs the indexed state. Pull
            # BOTH the spec index (changed norms) and the subject index (changed
            # subjects) from `latest`; a changed subject forces its series into
            # the delta even when no norm moved (plan TROU #1).
            gh release download latest --repo "$GITHUB_REPOSITORY" -p corpus-index.json -D . 2>/dev/null || true
            gh release download latest --repo "$GITHUB_REPOSITORY" -p subject-index.json -D . 2>/dev/null || true
            # build-index.json carries the three canonical identities; a drift in
            # the embed identity (model weight/tokenizer/dim/precision bump) or the
            # spec-ingest identity forces a full rebuild even when no spec version
            # moved (plan PR-3/PR-6). --embed-model is the FAMILY discover resolves
            # to the canonical EmbedIdentity; keep it in lockstep with EMBEDDER on
            # the build-shard job (default lexical when embed=false).
            gh release download latest --repo "$GITHUB_REPOSITORY" -p build-index.json -D . 2>/dev/null || true
            # absent-index.json (from Corpus · Coverage): the (spec,release) 3GPP
            # lists but never published as a file. Subtracting it stops the genuine
            # residue re-flagging every run, so actionable drift converges to 0.
            gh release download latest --repo "$GITHUB_REPOSITORY" -p absent-index.json -D . 2>/dev/null || true
            absent=""; [ -f absent-index.json ] && absent="--absent-index absent-index.json"
            embed_model=""
            if [ "${{ github.event.inputs.embed }}" = "true" ]; then
              embed_model="bge-m3"
            fi
            # Add the legacy GSM Phase-1/2 series to the matrix under the SAME toggle
            # that turns on INCLUDE_LEGACY_GSM for the convert step (repo variable /
            # dispatch checkbox / auto push) — otherwise discover never surfaces them
            # and Phase 1/2 is never built despite the convert flag.
            legacy="${{ (vars.INCLUDE_LEGACY_GSM == 'true' || vars.INCLUDE_LEGACY_GSM == 'TRUE' || vars.INCLUDE_LEGACY_GSM == '1' || github.event.inputs.include_legacy_gsm == 'true' || github.event_name == 'push' || github.event_name == 'schedule') && '--include-legacy-gsm' || '' }}"
            if [ "$full" = "true" ]; then
              matrix=$(CGO_ENABLED=0 go run ./cmd/discover --all --floor "$floor" $legacy)
            else
              matrix=$(CGO_ENABLED=0 go run ./cmd/discover --index corpus-index.json --subject-index subject-index.json --build-index build-index.json --embed-model "$embed_model" --floor "$floor" $legacy $absent)
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"   >> "$GITHUB_OUTPUT"
          echo "full=$full"     >> "$GITHUB_OUTPUT"

          # PUBLISH GUARD (single source of truth): only a WHOLE-corpus run may
          # ever clobber the rolling `latest` release. A scoped run — an explicit
          # series_scope (the operator's small test like "21 33"), or a PR's tiny
          # fixed scope — produces ARTIFACTS ONLY, even if publish_to_latest=true
          # was passed. This is the guard that stops a "small test scenario" from
          # shrinking latest (e.g. the 3031→149 clobber that motivated it): latest
          # is written exclusively by the job that builds the entire corpus.
          # A whole-corpus run publishes `latest` when EITHER publish_to_latest=true
          # (manual dispatch) OR it's an automatic push-to-main build. Both still
          # require an unscoped (whole-corpus) run — a scoped test never clobbers latest.
          publish=false
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && { [ "${{ github.event.inputs.publish_to_latest }}" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; } \
             && [ -z "$scope" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix  floor=$floor  full=$full  publish=$publish (scope='$scope')"
          if [ "${{ github.event.inputs.publish_to_latest }}" = "true" ] && [ "$publish" != "true" ]; then
            echo "::notice::publish_to_latest=true was IGNORED — this is a scoped/PR run (scope='$scope'); latest is only written by a whole-corpus run. Outputs go to artifacts."
          fi

          # ---- Sparse self-heal signal (independent of the dense matrix) ----------
          # Decide whether the SPARSE (learned-lexical) layer must be (re)produced:
          # compare the expected sparse identity (the FAMILY in the SPARSE_EMBED_MODEL
          # repo var, default bge-m3, resolved via the registry) against the published
          # sparse-index.json on `latest`. Empty expected (the active model has no
          # sparse head — today's dense-only default) => sparse_needed=false, so the
          # dispatch-sparse job below stays DORMANT until a sparse-exported model is
          # made active. This NEVER triggers a dense re-embed (separate identity).
          gh release download latest --repo "$GITHUB_REPOSITORY" -p sparse-index.json -D . 2>/dev/null || true
          sparse_model="${{ vars.SPARSE_EMBED_MODEL || 'bge-m3' }}"
          if ! CGO_ENABLED=0 go run ./cmd/discover --sparse-check --sparse-model "$sparse_model" --sparse-index sparse-index.json >> "$GITHUB_OUTPUT"; then
            { echo "sparse_needed=false"; echo "sparse_id="; } >> "$GITHUB_OUTPUT"
          fi

  # ---- 1b. model bundle (embed only): fetch BGE-M3 + ORT from HuggingFace ONCE
  # and publish to a 'models' release, so the N shards restore it intra-GitHub
  # instead of each hammering HF (~70 GB → 2.3 GB). Always SUCCEEDS (no-op when
  # embed=false) so build-shard can `needs:` it without the skipped-dependency trap.
  model:
    needs: [preflight, discover]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lexical run — no model needed
        if: github.event.inputs.embed != 'true'
        run: echo "embed=false → skipping the model bundle"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: github.event.inputs.embed == 'true'
        with:
          persist-credentials: false
      - name: Build + publish the model bundle (idempotent, version-keyed, per-component)
        if: github.event.inputs.embed == 'true'
        env:
          # Bundle the cross-encoder reranker alongside the embedder so the
          # build-shard ingest can fully populate the rerank path. Toggle off
          # only if disk-pressure on the runner becomes a real problem.
          WITH_RERANKER: "1"
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends zstd
          # GitHub Release assets are CAPPED at 2 GiB (HTTP 422 "size must be less
          # than 2147483648"). A single tarball of BGE-M3 + reranker + ORT is
          # 3.16 GiB compressed (6.4 GiB raw). The fix is to split along the
          # natural component boundaries — each .tar.zst stays well under the cap
          # and the consumer can skip pieces (e.g. when WITH_RERANKER toggles off
          # in the future, the build-shard restore just doesn't pull rerank.tar.zst).
          #
          # Component-keyed names embed BOTH ORT_VERSION (binding API) AND the
          # commit-SHA-pinned model version (deterministic upstream content), so a
          # bump on either side auto-invalidates the cache — no manual cleanup.
          # Cache key encodes the upstream commit SHA (8-hex prefix) so a bump
          # of bgeCommit / rerankCommit (verified in preflight to match Go +
          # shell) auto-invalidates the cached asset — no risk of restoring
          # stale model contents under the same filename (Qodo Bug #45).
          ORT_ASSET="ort-${ORT_VERSION}.tar.zst"
          BGE_ASSET="bge-m3-${BGE_COMMIT:0:8}.tar.zst"
          RERANK_ASSET="bge-reranker-v2-m3-${RERANK_COMMIT:0:8}.tar.zst"
          ASSETS_NEEDED=("$ORT_ASSET" "$BGE_ASSET")
          [ "${WITH_RERANKER:-0}" = "1" ] && ASSETS_NEEDED+=("$RERANK_ASSET")
          # Export the asset names BEFORE any exit path so build-shard's restore
          # step has a stable contract regardless of cache hit vs miss.
          {
            echo "ORT_ASSET=$ORT_ASSET"
            echo "BGE_ASSET=$BGE_ASSET"
            echo "RERANK_ASSET=$RERANK_ASSET"
            echo "WITH_RERANKER=${WITH_RERANKER:-0}"
          } >> "$GITHUB_OUTPUT"
          # Cache-hit: AT LEAST .part00 + .sha256 for every required asset.
          # (A real multi-part asset has .part00..N; we don't know N here, but
          # if any part is missing the consumer's cat-reassemble step fails the
          # sha256 check and falls back to direct HF fetch — graceful degrade.)
          PRESENT=$(gh release view models --repo "$GITHUB_REPOSITORY" --json assets \
                     --jq '.assets[].name' 2>/dev/null || true)
          all_present=1
          for a in "${ASSETS_NEEDED[@]}"; do
            if ! printf '%s\n' "$PRESENT" | grep -Fqx "$a.part00" \
                || ! printf '%s\n' "$PRESENT" | grep -Fqx "$a.sha256"; then
              all_present=0
              break
            fi
          done
          if [ "$all_present" = 1 ]; then
            echo "all model components (part00 + sha256) already on the 'models' release — skipping HF fetch"
            exit 0
          fi
          ./scripts/fetch-model.sh  # honours WITH_RERANKER above
          # One .tar.zst per component. -19 high compression + -T0 multi-threaded.
          tar -C data/models -cf - onnxruntime        | zstd -19 -T0 -o "$ORT_ASSET"
          tar -C data/models -cf - bge-m3             | zstd -19 -T0 -o "$BGE_ASSET"
          [ "${WITH_RERANKER:-0}" = "1" ] && \
            tar -C data/models -cf - bge-reranker-v2-m3 | zstd -19 -T0 -o "$RERANK_ASSET"
          # Even per-component a single archive can blow past the 2 GiB Release
          # cap — the reranker ONNX compresses to ~2.1 GiB (49.5% ratio on ~4.25
          # GiB raw weights). pack_and_split() always produces N >= 1 numbered
          # parts (.part00, .part01, …) so the consumer's restore loop is
          # uniform regardless of original size. Sha256 covers the WHOLE
          # pre-split archive (verified after cat-reassemble on the consumer).
          SPLIT_BYTES=1932735283   # 1.8 GiB — leaves headroom under the 2 GiB cap for HTTP overhead
          pack_and_split() {
            local a="$1"
            [ -e "$a" ] || return 0
            sha256sum "$a" > "$a.sha256"
            local sz
            sz=$(stat -c %s "$a")
            if [ "$sz" -lt "$SPLIT_BYTES" ]; then
              mv "$a" "$a.part00"
            else
              split -d -b "$SPLIT_BYTES" "$a" "$a.part"
              rm "$a"
            fi
            printf '  %-44s %s bytes → %s parts\n' "$a" "$sz" "$(ls "$a".part* | wc -l)"
          }
          for a in "$ORT_ASSET" "$BGE_ASSET" "$RERANK_ASSET"; do
            pack_and_split "$a"
          done
          # Assemble upload list: every .part* + every .sha256 we just produced.
          UPLOAD=()
          for a in "$ORT_ASSET" "$BGE_ASSET" "$RERANK_ASSET"; do
            [ -e "$a.sha256" ] || continue
            UPLOAD+=("$a.sha256")
            # Glob expands lexically (.part00, .part01, …) — guaranteed order
            # for cat-based reassembly on the consumer.
            for p in "$a".part*; do
              UPLOAD+=("$p")
            done
          done
          # Final sanity check: NO single part may still be >= 2 GiB (a future
          # change to SPLIT_BYTES that breaks the invariant should fail loud
          # here rather than in `gh release upload`).
          for p in "${UPLOAD[@]}"; do
            sz=$(stat -c %s "$p")
            if [ "$sz" -ge 2147483648 ]; then
              echo "::error::$p is $sz bytes — split logic is broken"
              exit 1
            fi
          done
          gh release view models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models --repo "$GITHUB_REPOSITORY" --title models \
              --notes "Per-component model bundle: ORT (binding-version keyed) + BGE-M3 + (optional) bge-reranker-v2-m3. Each component < 2 GiB GitHub Release cap. Commit-SHA pinned upstream."
          gh release upload models --repo "$GITHUB_REPOSITORY" "${UPLOAD[@]}" --clobber
        id: bundle
    outputs:
      ort_asset: ${{ steps.bundle.outputs.ORT_ASSET }}
      bge_asset: ${{ steps.bundle.outputs.BGE_ASSET }}
      rerank_asset: ${{ steps.bundle.outputs.RERANK_ASSET }}
      with_reranker: ${{ steps.bundle.outputs.WITH_RERANKER }}

  # ---- 2. one shard per changed series (parallel) --------------------------
  build-shard:
    needs: [discover, model]
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    # packages: write to PUSH this series' shard image to GHCR (replaces the
    # actions/cache shard baseline + artifact); read to PULL the prior shard
    # image as the --resume baseline. (GHCR migration — plan velvety-nibbling.)
    permissions:
      contents: read
      packages: write
    # Per-shard timeout, driven by the workflow input shard_timeout_minutes
    # (default 360, max enforceable on free hosted runners — the platform itself
    # kills the job at exactly that, which is why ANY value > 360 is a no-op).
    # Lowering this is the easiest way to TEST the auto-rerun + --resume chain
    # quickly: set 10 → cap fires within minutes → autorerun engages → full
    # cycle observable in ~30-45 min instead of ~30h.
    # fromJSON() converts the string input to the int the API expects.
    timeout-minutes: ${{ fromJSON(github.event.inputs.shard_timeout_minutes || '360') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      # Warm buildkit with a retry'd pull so the buildx builder boot survives a
      # transient Docker Hub timeout (the exact break that failed this scheduled
      # build on 2026-06-08..10). build-push then finds it locally cached.
      - name: Pre-pull buildkit (retry; Docker Hub flakes)
        run: |
          source scripts/lib/retry.sh
          retry docker pull moby/buildkit:buildx-stable-1
      # buildx (container driver) is required for `docker buildx build --push` of
      # the FROM-scratch shard image to GHCR.
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # A matrix entry is either a bare series ("24") or a series|release sub-shard
      # ("24|Rel-19"). Sub-sharding a big series by release keeps each job under the
      # 6h cap so it finishes in one slot instead of relying on the auto-resume
      # chain. Here we split the entry into:
      #   series   → the --series filter (always set)
      #   relflag  → "--release Rel-19" when a release is pinned, else empty
      #   tag      → filesystem/cache-safe id ("24" or "24-Rel-19"); '|' is not safe
      #              in an artifact name, so we map it to '-'.
      - name: Parse shard key
        id: shard
        env:
          KEY: ${{ matrix.series }}
        run: |
          series="${KEY%%|*}"          # before the '|' (or whole string if none)
          rel=""
          relflag=""
          tag="$series"
          if [ "$KEY" != "$series" ]; then
            rel="${KEY#*|}"            # after the '|'
            relflag="--release $rel"
            tag="${series}-${rel}"
          fi
          echo "series=$series"   >> "$GITHUB_OUTPUT"
          echo "release=$rel"     >> "$GITHUB_OUTPUT"
          echo "relflag=$relflag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "parsed shard key '$KEY' → series=$series release='${rel:-<all>}' tag=$tag"
      - name: Install deps (LibreOffice + .doc/.docx fallback converters + build)
        # pandoc (OOXML soffice can't render) + antiword/catdoc (legacy OLE .doc
        # text salvage) are the convert.sh fallback chain that recovers specs which
        # crash soffice — so they get indexed instead of staying in the drift gap.
        # Retry: a transient apt-mirror hiccup must NOT fail the whole series shard
        # (observed: 6/30 shards died at a ~30s apt flake, zeroing entire series).
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config libreoffice-writer-nogui pandoc antiword catdoc; then ok=1; break; fi
            echo "apt attempt $i failed; retrying in $((i*10))s" >&2; sleep $((i*10))
          done
          [ "$ok" = 1 ]
      # Conversion-determinism guard (advisory): LibreOffice is unpinned by design
      # (apt-pinning on a runner is fragile; ingest normalization absorbs whitespace
      # drift), so instead make any runner-image soffice bump VISIBLE as a warning
      # before it can silently perturb extraction for a few specs.
      - name: Guard — LibreOffice version drift (advisory)
        run: scripts/lib/soffice-guard.sh
      - name: Build ingest (+ decoupled embed binary when embedding)
        run: |
          # Ingest ALWAYS builds lexical (no -tags onnx): embedding is now a
          # separate step (cmd/embed), so ingest just produces the clause text +
          # FTS. When embed=true we ALSO build the onnx-tagged cmd/embed, which
          # vectorises the shard in place, re-embedding ONLY changed clauses.
          go build -trimpath -o bin/ingest ./cmd/ingest
          if [ "${{ github.event.inputs.embed }}" = "true" ]; then
            CGO_ENABLED=1 go build -trimpath -tags onnx -o bin/embed ./cmd/embed
          fi
      - name: Restore model components from the 'models' release (semantic only)
        if: github.event.inputs.embed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Component names come from the model job (single source of truth). The
          # fallbacks below MUST match the model job's naming rule exactly — they
          # only kick in on a `needs.model.outputs.*` glitch (extremely unlikely
          # given preflight gating); the real names always win.
          ORT_ASSET: ${{ needs.model.outputs.ort_asset }}
          BGE_ASSET: ${{ needs.model.outputs.bge_asset }}
          RERANK_ASSET: ${{ needs.model.outputs.rerank_asset }}
          # Whether the model job actually published the reranker — controls
          # whether the restore here pulls it (and whether HF fallback fetches it).
          WITH_RERANKER: ${{ needs.model.outputs.with_reranker || '1' }}
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get install -y --no-install-recommends zstd
          mkdir -p data/models
          ort="${ORT_ASSET:-ort-${ORT_VERSION}.tar.zst}"
          bge="${BGE_ASSET:-bge-m3.tar.zst}"
          rerank="${RERANK_ASSET:-bge-reranker-v2-m3.tar.zst}"
          assets=("$ort" "$bge")
          [ "${WITH_RERANKER:-0}" = "1" ] && assets+=("$rerank")
          echo "restoring components: ${assets[*]}"
          # restore_one <asset>: download every .partNN + .sha256 → cat them in
          # lexical order to reassemble the original archive → verify sha256
          # over the WHOLE archive → extract. Returns 0 on success, 1 on any
          # failure (caller falls back to direct HF fetch). The glob pattern
          # `${asset}.part*` matches every numbered part (split -d makes them
          # .part00, .part01, … in lexical = upload = cat order).
          restore_one() {
            local a="$1"
            # Wipe any leftover parts/archive from a previous failed call so a
            # partial-state retry doesn't cat orphan bytes.
            rm -f "$a" "$a".part* "$a.sha256"
            gh release download models --repo "$GITHUB_REPOSITORY" \
                  -p "$a.part*" -p "$a.sha256" -D . 2>/dev/null || return 1
            [ -f "$a.sha256" ] || return 1
            # Bash globs expand in lexical (= sorted) order by default → cat
            # gets parts in the exact same order they were split (part00,
            # part01, …, partNN). The array indirection keeps each part as a
            # SEPARATE arg even if a filename ever held whitespace — `cat $glob`
            # would word-split on $IFS and break the reassembly.
            local parts=( "$a".part* )
            [ -e "${parts[0]}" ] || return 1
            cat "${parts[@]}" > "$a" || return 1
            sha256sum -c "$a.sha256" || return 1
            zstd -d "$a" -c | tar -C data/models -xf - || return 1
            # Free disk: the parts + reassembled archive aren't needed past extract.
            rm -f "$a" "$a".part*
          }
          restore_ok=1
          for a in "${assets[@]}"; do
            if ! restore_one "$a"; then
              echo "::warning::failed to restore component $a"
              restore_ok=0
            fi
          done
          if [ "$restore_ok" -eq 0 ]; then
            echo "::notice::partial/missing component restore → falling back to direct HF fetch (WITH_RERANKER=$WITH_RERANKER)"
            # Clean any partial extractions so fetch-model.sh starts fresh.
            rm -rf data/models/onnxruntime data/models/bge-m3 data/models/bge-reranker-v2-m3
            ./scripts/fetch-model.sh
          fi
      # ── CONVERT/ORIGIN cache (PR-9 — perf only, NEVER correctness state) ──────
      # The LibreOffice .doc→HTML conversion (data/sources/convert) is the single
      # most expensive phase and the dominant reason a 6h-capped big series (e.g.
      # 24) makes no forward progress on --resume: the shard cache + always-upload
      # artifact persist ONLY dist/shard-*.duckdb, so a resumed run on a FRESH
      # runner re-downloads + re-converts the WHOLE series from zero (corpus.sh
      # skips a file only when its HTML/zip already sits on disk — wiped with the
      # runner) before ingest can skip its 'done' specs. Restoring the converted
      # HTML (and the origin zips) lets corpus.sh convert/download only the delta.
      #
      # This is a PURE optimisation, decoupled from the shard DB on purpose:
      #   - separate cache namespace (`convert-v2-…`), separate from `shard-v2-…`,
      #     so a convert-cache miss/eviction NEVER affects shard correctness and a
      #     stale convert restore is harmless — corpus.sh re-converts anything
      #     missing and ingest re-reads HTML from disk regardless.
      #   - keyed on the per-shard tag (series OR series-release), so each entry is
      #     bounded to ONE series/release slice → fits the 10 GiB repo cache budget
      #     (a single series' convert+origin is well under it; the shard cache's
      #     ~5 GiB and this share the same TTL-evicted pool).
      #   - hash of the convert scripts only: a converter change (corpus.sh /
      #     lib/convert.sh) busts the HTML cache so the new conversion is produced;
      #     ingest/embed/model bumps do NOT bust it (they don't change the HTML).
      #   - NO pipeline_version / embed_floor in the key: the converted HTML is
      #     identical for lexical and embed runs, so both modes share it.
      - name: Convert/origin cache (resume convert baseline — perf only)
        id: convert_cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            data/sources/convert
            data/sources/origin
          key: convert-v2-${{ steps.shard.outputs.tag }}-${{ hashFiles('scripts/corpus.sh', 'scripts/lib/convert.sh', 'internal/catalog/parse.go', 'cmd/discover/main.go') }}
          restore-keys: |
            convert-v2-${{ steps.shard.outputs.tag }}-
      - name: Download + convert series ${{ steps.shard.outputs.tag }}
        env:
          # default-ON disk cleanup when embedding (the vectorized shard + model
          # crowd the 14 GB runner); harmless for the lexical path.
          CORPUS_DROP_ZIPS: ${{ github.event.inputs.embed == 'true' && '1' || '' }}
          # Index legacy GSM Phase 1/2 lexically under the honest "GSM" bucket. Enabled by
          # ANY of: the repo variable vars.INCLUDE_LEGACY_GSM (case-tolerant true/TRUE/1 —
          # a set-and-forget repo toggle), the per-dispatch include_legacy_gsm checkbox, or
          # an automatic push build (whole corpus Phase 1 → Rel-20). These clauses are below
          # every embed floor → indexed for BM25/LIKE but never vectorised.
          INCLUDE_LEGACY_GSM: ${{ (vars.INCLUDE_LEGACY_GSM == 'true' || vars.INCLUDE_LEGACY_GSM == 'TRUE' || vars.INCLUDE_LEGACY_GSM == '1' || github.event.inputs.include_legacy_gsm == 'true' || github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}
        run: ./scripts/corpus.sh --set "${{ needs.discover.outputs.floor }}" --series "${{ steps.shard.outputs.series }}" --jobs 2
      # Save the converted HTML + zips for the NEXT run's --resume. Explicit save
      # (restore/save split, not the auto-save variant) so it runs HERE — BEFORE
      # the "Free HTML before artifact upload" rm -rf below — capturing the HTML
      # while it still exists on disk. Best-effort: skipped on an exact-key hit
      # (nothing new to store) and never fails the job (perf-only state).
      - name: Save convert/origin cache (perf only — feeds next --resume)
        if: always() && steps.convert_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            data/sources/convert
            data/sources/origin
          key: convert-v2-${{ steps.shard.outputs.tag }}-${{ hashFiles('scripts/corpus.sh', 'scripts/lib/convert.sh', 'internal/catalog/parse.go', 'cmd/discover/main.go') }}
      # ── CROSS-RUN cache (axis #16) ──────────────────────────────────────
      # Persists partial + completed shard DBs across DIFFERENT workflow runs
      # so a fresh dispatch on unchanged code finds yesterday's 13-success
      # shards in the cache → restore + --resume sees all 'done' → ingest
      # exits in ~seconds instead of redoing 3-260 min of work per shard.
      #
      # Key invariants:
      #   - pipeline_version (model.PipelineVersion in Go) MUST be in the key,
      #     so a chunker/embedder bump auto-invalidates the cache (rebuild
      #     from scratch on the algorithm shift — invariant #2).
      #   - hashFiles() of the SOURCE files that decide what a shard contains
      #     guarantees a code change to ingest/parse/store rebuilds; comment-
      #     only changes don't bust the cache.
      #   - restore-keys cascade lets a partial code change still pick up a
      #     compatible-enough prior shard (--resume's purge then handles the
      #     drift safely).
      #
      # GH Actions cache: 10 GiB total per repo, 7-day inactivity TTL. The
      # per-series shards are ~50-200 MiB each, so 28 series ~= 5 GiB — fits.
      # Cross-run shard cache — now active for LEXICAL runs too (plan TROU #2),
      # not just embed=true. A lexical delta on a big series (e.g. 24) otherwise
      # re-converts + re-ingests from scratch on every dispatch and every
      # auto-rerun attempt; with the cache + --resume it picks up yesterday's
      # 'done' specs and finishes in seconds. The embed_floor stays in the key so
      # lexical and vectorised shards never cross-restore (different artifacts).
      # Subject sources are in the hash so a subject bump (li-v1→li-v2) busts the
      # owning series' cached shard — otherwise a restore + --resume would see
      # every spec 'done' and the subject change would never be re-extracted.
      # Code-hash for the shard cache key. Embed/rerank code only changes a shard's
      # OUTPUT when embed=true — the lexical ingest never runs cmd/embed — so folding
      # internal/embed into the key on an embed=false run busts the cache for nothing:
      # every embed-only commit would force a needless re-ingest of every lexical
      # shard. Fold it in CONDITIONALLY, so the daily lexical build stays cache-stable
      # across embed work while an embed=true run still re-keys on embed changes.
      - name: Shard cache code-hash (embed code counts only when embedding)
        id: codehash
        run: |
          files="internal/ingest internal/htmlparse internal/ooxml internal/model internal/store/schema.sql internal/store/hnsw.go cmd/ingest/main.go internal/subject internal/subjectmeta internal/registry"
          if [ "${{ github.event.inputs.embed }}" = "true" ]; then
            files="$files internal/embed cmd/embed/main.go"
          fi
          h="$(find $files -type f \( -name '*.go' -o -name '*.sql' \) 2>/dev/null | sort | xargs sha256sum | sha256sum | cut -c1-40)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "shard code-hash (embed=${{ github.event.inputs.embed }}): $h"
      # Cross-run resume baseline = the PRIOR shard image on GHCR (replaces the
      # actions/cache shard slot). Best-effort: pull the rolling :<tag> image and
      # extract its /shard.duckdb so --resume skips already-done specs. First run
      # or a series with no prior tag → no image → fresh ingest (Note-resume below
      # handles both). The convert cache (raw HTML) is UNCHANGED — orthogonal perf.
      # NOTE: an embed run must NOT resume from a lexical (vector-less) shard, so we
      # only pull when this run's embed mode matches the published image's. We tag
      # embed images distinctly (see the push step) and gate the pull on embed mode.
      # Login with GHCR_PAT (NOT github.token): a package pushed by the CI's
      # GITHUB_TOKEN is auto-LINKED to this PUBLIC repo and inherits its PUBLIC
      # visibility (the leak we hit). A PAT-pushed, unlinked package is born
      # PRIVATE (and public→private is irreversible, so birth-private is the only
      # way). GHCR_PAT is REQUIRED for the private-image distribution.
      - name: GHCR login (resume pull + shard push)
        run: |
          source scripts/lib/retry.sh
          retry bash -c 'echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
      - name: Resume baseline from prior shard image (best-effort)
        continue-on-error: true # purely a resume optimisation — must never fail the job
        run: |
          mkdir -p dist
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-shard:${{ steps.shard.outputs.tag }}${{ github.event.inputs.embed == 'true' && '-embed' || '' }}"
          if docker pull "$img" 2>/dev/null; then
            # `docker create` on a FROM-scratch image (no CMD) errors "no command
            # specified" unless a command arg is given — it is NEVER run, we only
            # `docker cp` files out. The arg is a harmless placeholder.
            cid=$(docker create "$img" /shard.duckdb) || { echo "create failed — fresh ingest"; exit 0; }
            docker cp "$cid:/shard.duckdb" "dist/shard-${{ steps.shard.outputs.tag }}.duckdb" 2>/dev/null || true
            docker cp "$cid:/shard.report.json" "dist/shard-${{ steps.shard.outputs.tag }}.report.json" 2>/dev/null || true
            docker rm "$cid" >/dev/null 2>&1 || true
            echo "resume baseline pulled from $img"
          else
            echo "no prior shard image ($img) — fresh ingest"
          fi
      # Intra-run fallback: a partial DB uploaded by an EARLIER attempt of the
      # SAME run (e.g. the auto-rerun cycle after a 6h-cap kill) takes priority
      # over the cross-run cache hit (it's strictly more recent). Best-effort:
      # no artifact in the current run yet → no-op, the cache value (if any)
      # stays on disk.
      - name: Restore prior shard artifact (resume from previous attempt)
        id: restore_shard
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shard-${{ steps.shard.outputs.tag }}
          path: dist
      - name: Note resume state
        run: |
          mkdir -p dist
          if [ -f "dist/shard-${{ steps.shard.outputs.tag }}.duckdb" ]; then
            sz=$(stat -c %s "dist/shard-${{ steps.shard.outputs.tag }}.duckdb")
            echo "resume: prior shard restored (${sz} bytes) — --resume will skip its 'done' specs"
            # Cache-hit telemetry: helps spot a cold cache vs a warm one in logs.
            echo "  cache hit:          ${{ steps.shard_cache.outputs.cache-hit }}"
            echo "  cache matched key:  ${{ steps.shard_cache.outputs.cache-matched-key }}"
          else
            echo "resume: no prior shard — fresh ingest"
          fi
      # The ingest itself runs in a retry loop: a runner OOM, network blip, or
      # user-side cancel of a single attempt leaves the artifact upload step
      # (always: success or failure) keeping the partial DB available for the
      # next attempt. --resume makes the next attempt skip 'done' specs +
      # purge half-ingested ones (PR #47, see internal/ingest/ingest.go).
      - name: Ingest shard ${{ steps.shard.outputs.tag }} (lexical, --resume + retry)
        id: ingest
        run: |
          # Ingest is now ALWAYS lexical (clause text + FTS); embedding is the
          # separate step below. --resume skips 'done' specs from a restored
          # partial shard; the retry loop covers transient mid-ingest failures.
          # relflag pins a release when this is a (series|release) sub-shard.
          set -o pipefail
          mkdir -p dist
          OUT="dist/shard-${{ steps.shard.outputs.tag }}.duckdb"
          attempt=0
          max_attempts=3
          ingest_ok=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "::group::ingest attempt $attempt/$max_attempts (shard ${{ steps.shard.outputs.tag }})"
            if ./bin/ingest --series "${{ steps.shard.outputs.series }}" ${{ steps.shard.outputs.relflag }} --out "$OUT" --resume; then
              ingest_ok=1
            fi
            echo "::endgroup::"
            if [ "$ingest_ok" -eq 1 ]; then
              echo "ingest attempt $attempt succeeded"
              break
            fi
            echo "::warning::ingest attempt $attempt failed — sleeping 30s before retry"
            sleep 30
          done
          if [ "$ingest_ok" -eq 0 ]; then
            echo "::error::ingest exhausted $max_attempts attempts; the always-upload step preserves the partial DB so a manual re-run can --resume"
            exit 1
          fi
      # ── DECOUPLED EMBED (embed=true only) ───────────────────────────────────
      # Runs cmd/embed ON the just-built lexical shard: re-embeds ONLY the clauses
      # whose text or model changed (per-clause embedding_hash), so a resumed /
      # cached shard re-embeds the delta, not the whole series. The embedding_hash
      # persists in the shard artifact + cross-run cache, so a re-run over an
      # unchanged series embeds ~0 clauses. Retry loop: a 6h-cap kill mid-embed
      # leaves the partial vectors + hashes in the uploaded shard; the rerun's
      # restore + this step re-embed only what's still missing.
      - name: Embed shard ${{ steps.shard.outputs.tag }} (decoupled, micro-granular, --resume)
        if: github.event.inputs.embed == 'true'
        env:
          EMBEDDER: bge-m3
          EMBED_MODEL_DIR: ${{ github.workspace }}/data/models/bge-m3
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/data/models/onnxruntime/lib/libonnxruntime.so
          # Windowing is single-sourced from the model registry (EmbedIdentity
          # component), not this env — canonical default is truncate@1024 to match the
          # Rust corpus embedder. mean_pool is the urgent Rust port (tracked issue);
          # it will re-enable here via the registry once embed-core implements it.
          RERANKER_DIR: ${{ github.workspace }}/data/models/bge-reranker-v2-m3
        run: |
          set -o pipefail
          OUT="dist/shard-${{ steps.shard.outputs.tag }}.duckdb"
          RPT="dist/shard-${{ steps.shard.outputs.tag }}.report.json"
          attempt=0
          max_attempts=3
          embed_ok=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "::group::embed attempt $attempt/$max_attempts (shard ${{ steps.shard.outputs.tag }})"
            # --require-semantic refuses to no-op if the embedder isn't enabled.
            # The gate checks the model + that NO at/above-floor clause is left
            # without a vector. We key on null_embeddings_at_floor, NOT the global
            # null_embeddings: with --embed-floor set, below-floor clauses are
            # LEFT NULL on purpose (lexical-only), so global null is never 0 and
            # would fail every shard with older releases. The gate ALSO requires
            # .hnsw==true: a transient BuildAndFreezeHNSW failure leaves vectors
            # present but the index unfrozen (rep.HNSW=false) and is otherwise
            # non-fatal, so a shard could ship fully vectorised but UNINDEXED
            # (serve degrades to O(N) exact scan, no alert). Failing the attempt
            # makes the retry re-run the cheap build (0 re-embeds via
            # embedding_hash) instead of publishing an unindexed sub-base
            # (embed-gate-ignores-hnsw-false / hnsw-freeze-failure-not-gated).
            # _at_floor==0 means the
            # shard is fully vectorised at/above the floor; a 6h-cap partial
            # leaves >0 and fails → the rerun resumes via embedding_hash.
            if ./bin/embed --db "$OUT" --embed-floor "${{ github.event.inputs.embed_floor }}" \
                 --require-semantic --report json | tee "$RPT" \
               && jq -e '.model=="bge-m3" and .null_embeddings_at_floor==0 and .hnsw==true' "$RPT"; then
              embed_ok=1
            fi
            echo "::endgroup::"
            if [ "$embed_ok" -eq 1 ]; then echo "embed attempt $attempt succeeded"; break; fi
            echo "::warning::embed attempt $attempt incomplete — sleeping 30s before retry (resumes via embedding_hash)"
            sleep 30
          done
          if [ "$embed_ok" -eq 0 ]; then
            echo "::error::embed exhausted $max_attempts attempts; partial vectors+hashes preserved in the shard for a --resume rerun"
            exit 1
          fi
      - name: Free HTML before artifact upload
        run: rm -rf data/sources/convert || true
      # Stamp the EFFECTIVE per-shard timeout into a run artifact so the
      # workflow_run-triggered autorerun can read the real value instead of
      # hardcoding it (PR-1, timeout-min-drift-resurrects-operator-cancel).
      # workflow_run events do NOT propagate the source dispatch inputs, but
      # they CAN list/download the source run's artifacts — so this is the
      # drift-proof channel. Every matrix slice writes the SAME value; a single
      # overwrite-able artifact (last write wins, all identical) is enough.
      - name: Stamp effective shard timeout (for autorerun)
        if: always()
        run: |
          mkdir -p dist
          printf '%s\n' "${{ fromJSON(github.event.inputs.shard_timeout_minutes || '360') }}" > dist/shard-timeout.txt
      - name: Upload shard-timeout stamp (autorerun reads this)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shard-timeout
          path: dist/shard-timeout.txt
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true
      # Upload artifact ALWAYS (success or failure) so the next attempt of
      # this same job can --resume from the partial DB on disk. retention-days
      # is short (1d) — these are temp shards, not the published corpus.
      - name: Upload shard artifact (always — feeds --resume on retry + publish-vec)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shard-${{ steps.shard.outputs.tag }}
          path: |
            dist/shard-${{ steps.shard.outputs.tag }}.duckdb
            dist/shard-${{ steps.shard.outputs.tag }}.report.json
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true   # each attempt of this matrix slice replaces the prior partial
      # Push the shard as a FROM-scratch GHCR image so the merge job can COPY --from
      # it (an ORAS artifact manifest is NOT COPY --from-able; a real image is). The
      # rolling :<tag> is the resume baseline for the next run; :<tag>-<run_id> is an
      # immutable handle for that run's merge + debugging. Always (even a 6h-cap
      # partial) so the next run resumes. Embed runs tag distinctly (-embed) so a
      # lexical run never resumes from a vector-bearing image and vice-versa.
      - name: Push shard image to GHCR (always — replaces the shard cache/artifact baseline)
        if: always()
        run: |
          source scripts/lib/retry.sh
          [ -s "dist/shard-${{ steps.shard.outputs.tag }}.duckdb" ] || { echo "no shard DB on disk — nothing to push"; exit 0; }
          sfx="${{ github.event.inputs.embed == 'true' && '-embed' || '' }}"
          cp "dist/shard-${{ steps.shard.outputs.tag }}.duckdb" dist/shard.duckdb
          : > dist/shard.report.json
          [ -s "dist/shard-${{ steps.shard.outputs.tag }}.report.json" ] && cp "dist/shard-${{ steps.shard.outputs.tag }}.report.json" dist/shard.report.json
          printf 'FROM scratch\nCOPY shard.duckdb /shard.duckdb\nCOPY shard.report.json /shard.report.json\n' > dist/Dockerfile.shard
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-shard:${{ steps.shard.outputs.tag }}${sfx}"
          # --provenance=false --sbom=false: single plain manifest, no untagged child
          # manifest the retention prune can orphan (same failure class that dangled
          # 3gpp-corpus:latest → FAIL=ghcr_export). Shards are FROM-scratch data images,
          # not runnable artifacts — provenance/SBOM add nothing but a prunable child.
          retry docker buildx build --push --provenance=false --sbom=false -f dist/Dockerfile.shard \
            -t "$base" -t "${base}-${{ github.run_id }}" dist/

  # ---- 3. fuse the partial DBs (delta = replace changed series in base) -----
  # Runs in BOTH modes:
  #   embed=false → merge produces the lexical DB as before (full vectors absent).
  #   embed=true  → merge ALSO runs, with `--strip-embeddings` so the lexical
  #                 'latest' Release asset stays under the 2 GB GitHub cap. The
  #                 per-series vectorized sub-bases (with their HNSW) are
  #                 distributed in PARALLEL by publish-vec on GHCR. The two
  #                 channels are independent: lexical-only client pulls the
  #                 Release, semantic client pulls GHCR + sub-bases.
  #   ⇒ this fixes the long-standing 'latest stays stale during embed runs' gap
  #     and lets the OpenAPI ingest (wired here) ride along on every embed run.
  merge:
    needs: [discover, build-shard]
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # optional public-release step (off by default)
      packages: write # pull base + shard images, push the 3gpp-corpus image
    env:
      # GHCR_PAT so `gh api` can READ package visibility for the anti-leak
      # assertion (github.token lacks read:packages); falls back if unset.
      GH_TOKEN: ${{ secrets.GHCR_PAT || github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config zstd python3; then ok=1; break; fi
            echo "apt attempt $i failed; retrying in $((i*10))s" >&2; sleep $((i*10))
          done
          [ "$ok" = 1 ]
      # GHCR_PAT (not github.token) so the pushed 3gpp-corpus image is born PRIVATE
      # (unlinked to the public repo). See the build-shard login note.
      - name: GHCR login (pull base + shard images, push corpus image)
        run: |
          source scripts/lib/retry.sh
          retry bash -c 'echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin'
      - name: Pre-pull buildkit (retry; Docker Hub flakes)
        run: |
          source scripts/lib/retry.sh
          retry docker pull moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Merge shard images → consolidated DB (generated Dockerfile, merge in build)
        env:
          MATRIX: ${{ needs.discover.outputs.matrix }}
          OWNER: ${{ github.repository_owner }}
          FULL: ${{ needs.discover.outputs.full }}
          PUBLISH: ${{ needs.discover.outputs.publish }}
          EMBED: ${{ github.event.inputs.embed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          source scripts/lib/retry.sh
          sfx=""; [ "$EMBED" = "true" ] && sfx="-embed"
          strip=""; [ "$EMBED" = "true" ] && strip="--strip-embeddings"
          corpus="ghcr.io/${OWNER}/3gpp-corpus:latest"
          # ---- base probe (delta only): the prior corpus image is the --base ----
          # FAIL-CLOSED on a publishing delta with no base (preserves the old
          # delta-publish-clobbers-latest guard): a delta-only merge would shrink
          # latest to a few series. A non-publishing run may degrade to fresh.
          BASE_PRESENT=0
          if [ "$FULL" != "true" ] && docker manifest inspect "$corpus" >/dev/null 2>&1; then
            BASE_PRESENT=1
          fi
          if [ "$FULL" != "true" ] && [ "$BASE_PRESENT" = 0 ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::delta publish run: no 3gpp-corpus:latest base image — refusing to clobber latest with a delta-only rebuild"; exit 1
            fi
            echo "::notice::no base image; non-publishing run proceeds as a fresh rebuild (artifacts only)"
          fi
          # Extract the base DB for the pre-publish count guard (and confirm pullable).
          if [ "$BASE_PRESENT" = 1 ]; then
            retry docker pull "$corpus"
            # FROM-scratch image → docker create needs a (never-run) command arg.
            cid=$(docker create "$corpus" /3gpp.duckdb); docker cp "$cid:/3gpp.duckdb" base.duckdb; docker rm "$cid" >/dev/null
            ls -lh base.duckdb
          fi
          # ---- keep base.duckdb OUT of the build context (it can be ~8 GB) ----
          printf '%s\n' base.duckdb mergeout data .git '*.zst' '*.sha256' > .dockerignore
          # ---- generate Dockerfile.merge (CI-only, never committed) ----
          # shards stage = one COPY --from per series of THIS run's immutable shard
          # image (:<tag><sfx>-<run_id>); merge stage compiles + runs cmd/merge IN the
          # build (DuckDB links statically → golang+CGO is all it needs).
          {
            echo "# syntax=docker/dockerfile:1"
            echo "FROM scratch AS shards"
            printf '%s' "$MATRIX" | jq -r '.[]' | while IFS= read -r key; do
              series="${key%%|*}"; tag="$series"
              [ "$key" != "$series" ] && tag="${series}-${key#*|}"
              echo "COPY --from=ghcr.io/${OWNER}/3gpp-shard:${tag}${sfx}-${RUN_ID} /shard.duckdb /shards/${tag}.duckdb"
            done
            [ "$BASE_PRESENT" = 1 ] && echo "COPY --from=${corpus} /3gpp.duckdb /base.duckdb"
            echo "FROM golang:1.26-bookworm AS merge"
            echo "WORKDIR /src"
            echo "COPY go.mod go.sum ./"
            echo "RUN go mod download"
            echo "COPY . ."
            echo "RUN CGO_ENABLED=1 GOTOOLCHAIN=local go build -trimpath -o /bin/merge ./cmd/merge"
            echo "COPY --from=shards /shards /shards"
            [ "$BASE_PRESENT" = 1 ] && echo "COPY --from=shards /base.duckdb /base.duckdb"
            base_arg=""; [ "$BASE_PRESENT" = 1 ] && base_arg="--base /base.duckdb"
            echo "RUN mkdir -p /out && /bin/merge --out /out/3gpp.duckdb --index-out /out/corpus-index.json --subject-index-out /out/subject-index.json --build-index-out /out/build-index.json ${base_arg} ${strip} /shards/*.duckdb"
            echo "FROM scratch AS export"
            echo "COPY --from=merge /out/ /"
          } > Dockerfile.merge
          echo "----- Dockerfile.merge -----"; cat Dockerfile.merge; echo "----------------------------"
          # ---- build: cmd/merge runs INSIDE the build; extract result to runner ----
          retry docker buildx build -f Dockerfile.merge --output type=local,dest=mergeout .
          mkdir -p data
          cp mergeout/3gpp.duckdb        data/3gpp.duckdb
          cp mergeout/corpus-index.json  data/corpus-index.json
          cp mergeout/subject-index.json data/subject-index.json
          cp mergeout/build-index.json   data/build-index.json
          ls -lh data/3gpp.duckdb
      - name: Enrich — catalogue overlay + 5GC OpenAPI (additive, idempotent)
        run: |
          # Authoritative DynaReport metadata (WG, title, TS/TR, freeze_date → fixes
          # the non-monotonic version-ordering trap) + 5GC OpenAPI (populates
          # search_api). Both are idempotent (UPSERT / clear-api_*-then-reingest)
          # and degrade-don't-block: a forge/DynaReport outage must not fail the
          # corpus build — the DB stays valid with filename-derived metadata.
          go build -trimpath -o bin/ingest-catalog ./cmd/ingest-catalog
          ./bin/ingest-catalog --out data/3gpp.duckdb --cache data/catalog \
            || echo "[merge] catalog overlay degraded (kept filename-derived metadata)"
          # OpenAPI overlay now runs the RUST ingest-openapi (parse3gpp::openapi + store-rs),
          # the Go cmd/ingest-openapi having been removed (Phase 11b). It is fully
          # degrade-don't-block: if this runner lacks the Rust toolchain or the build fails,
          # the additive overlay is simply skipped and the DB stays valid (the full Phase 10
          # CI repoint installs the toolchain + toolcaches the bin).
          # auto = fetch EVERY REL-* branch the Forge currently has, so a newly
          # published release (REL-20, REL-21, …) is picked up by a cron build with
          # no code change — and any release before the old hardcoded floor too.
          ./scripts/fetch-5g-apis.sh auto \
            || echo "[merge] 5g-apis fetch degraded"
          ( cargo build --release --manifest-path rust/ingest/Cargo.toml --bin ingest-openapi \
            && ./rust/target/release/ingest-openapi --src data/sources/5g-apis --db data/3gpp.duckdb ) \
            || echo "[merge] openapi overlay skipped (Rust ingest-openapi unavailable on this runner)"
      - name: Package (zstd + sha256 over the enriched DB)
        run: |
          zstd -19 -T0 --long=27 -f data/3gpp.duckdb -o data/3gpp.duckdb.zst
          sha256sum data/3gpp.duckdb | awk '{print $1"  3gpp.duckdb"}' > data/3gpp.duckdb.sha256
      - name: Export embedding delta (work-list) — the 2nd .zst
        run: |
          # The delta = clauses WHERE embedding IS NULL (text + chunk_id, no vectors)
          # — exactly the input a GPU embed run consumes. On a lexical build that is
          # the whole corpus; on an incremental delta it is only what moved. It
          # REUSES the DB already on the runner (no rebuild) and is the companion of
          # cmd/overlay, which merges the returned (chunk_id → vector) back in.
          go build -trimpath -o bin/export-delta ./cmd/export-delta
          ./bin/export-delta --db data/3gpp.duckdb --out data/3gpp.delta.duckdb --zstd
          sha256sum data/3gpp.delta.duckdb | awk '{print $1"  3gpp.delta.duckdb"}' > data/3gpp.delta.duckdb.sha256
          ls -lh data/3gpp.delta.duckdb.zst
      # Always upload the merged DB + indexes as an artifact (even on a publish
      # run) — cheap, and gives an inspectable copy of every run including the
      # scoped tests that intentionally never touch `latest`.
      - name: Upload artifact (merged DB + indexes)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-duckdb-merged
          path: |
            data/3gpp.duckdb.zst
            data/3gpp.duckdb.sha256
            data/3gpp.delta.duckdb.zst
            data/3gpp.delta.duckdb.sha256
            data/corpus-index.json
            data/subject-index.json
            data/build-index.json
          retention-days: 7
      # PRE-PUBLISH COUNT GUARD (PR-1, deterministic / fail-closed). Before
      # clobbering `latest`, assert the about-to-publish DB does NOT have FEWER
      # spec_versions or api_operations than the base it is replacing. A delta
      # publish must only ADD or REPLACE rows; a DROP means the merge silently
      # lost normative/API coverage (e.g. a base-download or enrich regression
      # slipping past the fail-closed branch above). No vague "significantly
      # smaller" threshold — ANY decrease blocks, unless this is a full rebuild
      # (full=true, where shrink is intentional) or the operator explicitly
      # acknowledges it via ALLOW_CORPUS_SHRINK / ALLOW_API_SHRINK. The counts are
      # printed either way so a block is self-explanatory.
      - name: Pre-publish count guard (no silent corpus/API shrink)
        if: needs.discover.outputs.publish == 'true'
        env:
          ALLOW_CORPUS_SHRINK: ${{ vars.ALLOW_CORPUS_SHRINK }}
          ALLOW_API_SHRINK: ${{ vars.ALLOW_API_SHRINK }}
          FULL: ${{ needs.discover.outputs.full }}
        run: |
          set -eu
          go build -trimpath -o bin/dbcount ./cmd/dbcount
          # Parse "key=value" lines into shell vars (new_spec_versions, etc.).
          eval "$(./bin/dbcount --db data/3gpp.duckdb | sed 's/^/new_/')"
          echo "new: spec_versions=$new_spec_versions api_operations=$new_api_operations"
          if [ "$FULL" = "true" ]; then
            echo "::notice::full rebuild — count guard skipped (a full run may legitimately reshape the corpus)"
            exit 0
          fi
          if [ ! -f base.duckdb ]; then
            # A delta publish with no base would already have failed the fail-closed
            # branch in the merge step; this is pure defence-in-depth.
            echo "::error::delta publish run has no base.duckdb to compare against — refusing to publish"
            exit 1
          fi
          eval "$(./bin/dbcount --db base.duckdb | sed 's/^/base_/')"
          echo "base: spec_versions=$base_spec_versions api_operations=$base_api_operations"
          block=0
          if [ "$new_spec_versions" -lt "$base_spec_versions" ]; then
            if [ "${ALLOW_CORPUS_SHRINK:-}" = "true" ]; then
              echo "::warning::spec_versions shrank $base_spec_versions → $new_spec_versions but ALLOW_CORPUS_SHRINK=true — allowed"
            else
              echo "::error::spec_versions would SHRINK $base_spec_versions → $new_spec_versions on a delta publish — blocking (set repo variable ALLOW_CORPUS_SHRINK=true to override)"
              block=1
            fi
          fi
          if [ "$new_api_operations" -lt "$base_api_operations" ]; then
            if [ "${ALLOW_API_SHRINK:-}" = "true" ]; then
              echo "::warning::api_operations shrank $base_api_operations → $new_api_operations but ALLOW_API_SHRINK=true — allowed"
            else
              echo "::error::api_operations would SHRINK $base_api_operations → $new_api_operations on a delta publish — blocking (set repo variable ALLOW_API_SHRINK=true to override)"
              block=1
            fi
          fi
          if [ "$block" -ne 0 ]; then
            exit 1
          fi
          echo "count guard PASSED: corpus/API coverage did not shrink"
      # Anti-leak gate: the corpus images carry verbatim 3GPP text, so they MUST be
      # private. A public-repo package is born PUBLIC; Step 0 (README) sets it
      # private once, and this assertion fail-closes any later drift back to public.
      # A not-yet-created package returns 'absent' (first run) → passes; the manual
      # Step 0 makes it private right after that first push.
      - name: Assert GHCR corpus/shard packages are private (anti-leak)
        if: needs.discover.outputs.publish == 'true'
        run: |
          for pkg in 3gpp-corpus 3gpp-shard; do
            vis=$(gh api "/users/${{ github.repository_owner }}/packages/container/$pkg" --jq '.visibility' 2>/dev/null || echo absent)
            echo "$pkg: $vis"
            if [ "$vis" = "public" ]; then
              echo "::error::GHCR package '$pkg' is PUBLIC — refusing to publish verbatim 3GPP text. Make it private: gh api -X PATCH /user/packages/container/$pkg/visibility -f visibility=private"
              exit 1
            fi
          done
      # Publish ONLY when discover authorised it = a whole-corpus, non-PR run with
      # publish_to_latest=true (push/schedule/dispatch). A scoped/test run never
      # reaches this step. The data-only corpus image (FROM scratch + the DB +
      # indexes) replaces the old `latest` Release assets; tagged :YYYY-MM-DD for
      # the 7-day rotation + :latest=newest (the prune job enforces retention).
      - name: Publish corpus image to GHCR (:YYYY-MM-DD + :latest, clobber)
        if: needs.discover.outputs.publish == 'true'
        run: |
          set -eu
          source scripts/lib/retry.sh
          printf 'FROM scratch\nCOPY 3gpp.duckdb /3gpp.duckdb\nCOPY corpus-index.json /corpus-index.json\nCOPY subject-index.json /subject-index.json\nCOPY build-index.json /build-index.json\n' > data/Dockerfile.corpus
          # keep the heavy zst/delta out of the build context (only the 4 files COPYed)
          printf '%s\n' '*.zst' '*.sha256' catalog Dockerfile.corpus > data/.dockerignore
          DATE=$(date -u +%Y-%m-%d)
          REPO="ghcr.io/${{ github.repository_owner }}/3gpp-corpus"
          # --provenance=false --sbom=false: publish :latest as a SINGLE plain image
          # manifest, NOT a buildx provenance INDEX. An index references an untagged
          # child platform manifest; the GHCR retention prune (job 6) deletes that
          # "untagged" child and leaves :latest dangling → pull 404 → the embed kernel's
          # crane export of the base fails with FAIL=ghcr_export and NOTHING embeds. A
          # single manifest has no orphanable child, so the prune cannot break it.
          retry docker buildx build --push --provenance=false --sbom=false -f data/Dockerfile.corpus \
            -t "${REPO}:${DATE}" -t "${REPO}:latest" data/
          echo "published ${REPO}:${DATE} + :latest"
          # NOTE: package visibility is UI-only (no REST API) — set 3gpp-corpus
          # private ONCE in the UI after the first publish; the assertion above
          # fail-closes any later run while it is public. See the header PREREQS.

  # ---- 4. SEMANTIC (embed=true): distribute the per-series vectorized sub-bases
  # to GHCR (Option B). The sub-bases are the build-shard artifacts; we zstd each,
  # emit vec-manifest.json, and ORAS-push them to a rolling 'latest' OCI tag (no
  # 2 GB Release-asset cap). Gated on embed; the actual push is gated on publish.
  # NEEDS A CI DRY-RUN to validate (ORAS auth + the sub-bases exist).
  publish-vec:
    needs: [discover, build-shard]
    if: needs.discover.outputs.matrix != '[]' && github.event.inputs.embed == 'true'
    # discover.outputs.publish gates the actual GHCR push (whole-corpus run only).
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORAS_VERSION: "1.2.0"
    steps:
      # checkout so the run: steps can source scripts/lib/retry.sh (shared backoff).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: shard-*
          merge-multiple: true
      - name: Install zstd + jq + ORAS (pinned)
        run: |
          source scripts/lib/retry.sh
          retry sudo apt-get update -y
          retry sudo apt-get install -y --no-install-recommends zstd jq
          retry bash -c "curl -fsSL 'https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz' | sudo tar -xz -C /usr/local/bin oras"
          oras version
      - name: Package sub-bases + vec-manifest
        run: |
          mkdir -p vec
          subs="[]"
          for f in shards/shard-*.duckdb; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .duckdb)
            zstd -19 -T0 -f "$f" -o "vec/$b.duckdb.zst"
            subs=$(printf '%s' "$subs" | jq --arg n "$b.duckdb" '. + [$n]')
          done
          printf '%s' "$subs" | jq \
            --arg floor "${{ github.event.inputs.embed_floor }}" \
            '{embedding_model:"bge-m3", embed_floor:$floor, sub_bases:.}' > vec/vec-manifest.json
          cat vec/vec-manifest.json
          test "$(jq '.sub_bases|length' vec/vec-manifest.json)" -gt 0 || { echo "::error::no vectorized sub-bases to publish"; exit 1; }
      # Push to the rolling GHCR tag ONLY on an authorised whole-corpus run (same
      # guard as the Release publish — a scoped/test embed run never overwrites
      # the published vectorized channel).
      - name: Push sub-bases + manifest to GHCR (rolling 'latest')
        if: needs.discover.outputs.publish == 'true'
        run: |
          source scripts/lib/retry.sh
          retry bash -c 'echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin'
          cd vec
          args="vec-manifest.json:application/json"
          for z in *.duckdb.zst; do args="$args $z:application/zstd"; done
          retry oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-vec:latest" \
            --artifact-type application/vnd.kodflow.3gpp-vec.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            $args
      # Always keep an artifact copy (even on a publish run, for inspection).
      - name: Upload artifact (vectorized sub-bases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-vec
          path: vec/
          retention-days: 7

  # ---- 5b. CONTINUITY (opt-in): after a PUBLISHED lexical delta, hand the changed
  # series to the GPU embed so the semantic vectors track the corpus automatically.
  # This is the download→diff→reindex→re-embed handoff that makes the two halves one
  # continuum WITHOUT losing independence (the embed workflow stays dispatchable on
  # its own). Gated on a repo variable AUTO_EMBED_ON_BUILD=='true' so it can never
  # cause surprise Kaggle GPU spend, and skipped when the run already embedded
  # on-runner (embed=true). publish-vec (additive) folds the new series into the
  # existing 3gpp-vec channel, so partial catch-ups converge.
  dispatch-embed:
    needs: [discover, merge]
    if: >-
      needs.discover.outputs.publish == 'true' &&
      needs.discover.outputs.matrix != '[]' &&
      github.event.inputs.embed != 'true' &&
      vars.AUTO_EMBED_ON_BUILD == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch the embed workflow
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.discover.outputs.matrix }}
      FLOOR: ${{ needs.discover.outputs.floor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Dispatch GPU embed for the changed series
        run: |
          source scripts/lib/retry.sh
          # discover.matrix is a JSON array of "series" or "series|release" keys; the
          # embed takes unique space-separated series (it re-embeds only changed clauses).
          series="$(printf '%s' "$MATRIX" | jq -r '[.[] | split("|")[0]] | unique | join(" ")')"
          if [ -z "$series" ] || [ "$series" = "null" ]; then
            echo "::notice::no changed series — nothing to embed"; exit 0
          fi
          echo "dispatching GPU embed for changed series: $series (floor=${FLOOR:-Rel-99})"
          retry gh workflow run corpus-embed-kaggle.yml \
            -f series_list="$series" \
            -f embed_floor="${FLOOR:-Rel-99}" \
            -f precision=fp16 \
            -f publish=true

  # ---- 5b. dispatch-sparse: produce the SPARSE (learned-lexical) layer when the
  # published sparse-index differs from what this build expects (discover
  # --sparse-check). Sparse is CORPUS-GLOBAL and ADDITIVE: it runs an `embed
  # --sparse-only` pass over the fused DB's clauses (heading+text only) and NEVER
  # recomputes the dense vectors. Mirrors dispatch-embed but is its OWN signal, so it
  # fires even on a push with an empty dense matrix (the "code merged, sparse still
  # missing" case). DORMANT by default: gated on AUTO_SPARSE_ON_BUILD=='true' (no
  # surprise GPU spend) and on sparse_needed (false until a sparse-exported model is
  # active). always() so a SKIPPED merge (empty matrix) does not block it.
  dispatch-sparse:
    needs: [discover, merge]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      (needs.merge.result == 'success' || needs.merge.result == 'skipped') &&
      needs.discover.outputs.publish == 'true' &&
      needs.discover.outputs.sparse_needed == 'true' &&
      github.event.inputs.embed != 'true' &&
      vars.AUTO_SPARSE_ON_BUILD == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch the sparse workflow
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      FLOOR: ${{ needs.discover.outputs.floor }}
      SPARSE_ID: ${{ needs.discover.outputs.sparse_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Dispatch GPU sparse-only pass (fused DB; additive, no dense re-embed)
        run: |
          source scripts/lib/retry.sh
          echo "dispatching sparse-only campaign (expected sparse_id=$SPARSE_ID, floor=${FLOOR:-Rel-99})"
          retry gh workflow run corpus-sparse-kaggle.yml \
            -f embed_floor="${FLOOR:-Rel-99}" \
            -f publish=true

  # ---- 6. retention: keep the last 7 dated corpus images + rolling shard tags ---
  # GHCR has no auto-prune. Deleting a USER package version needs a token with
  # delete:packages — GITHUB_TOKEN does NOT have it, so this uses an optional
  # GHCR_PAT secret (classic PAT, delete:packages). Without it the job no-ops with
  # a notice (retention is housekeeping, never build-correctness). Gated on publish
  # so scoped/PR runs never prune.
  prune:
    needs: [discover, merge]
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GHCR_PAT || github.token }}
      OWNER: ${{ github.repository_owner }}
      HAVE_PAT: ${{ secrets.GHCR_PAT != '' }}
    steps:
      - name: Prune old GHCR versions (7 dated corpus + 7 dated data + rolling shard tags)
        run: |
          set -eu
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::notice::GHCR_PAT secret not set (needs delete:packages) — retention prune skipped. Old image versions will accumulate until a PAT is added."
            exit 0
          fi
          gh api --paginate "/users/${OWNER}/packages/container/3gpp-corpus/versions" > corpus.json 2>/dev/null || echo '[]' > corpus.json
          gh api --paginate "/users/${OWNER}/packages/container/3gpp-shard/versions"  > shard.json  2>/dev/null || echo '[]' > shard.json
          gh api --paginate "/users/${OWNER}/packages/container/3gpp-data/versions"   > data.json   2>/dev/null || echo '[]' > data.json
          python3 <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone, timedelta
          owner = os.environ["OWNER"]
          def load(p):
              try: return json.load(open(p))
              except Exception: return []
          def tags_of(v): return v.get("metadata", {}).get("container", {}).get("tags") or []
          def delete(pkg, vid, why):
              print(f"delete {pkg} #{vid} ({why})")
              subprocess.run(["gh", "api", "-X", "DELETE",
                              f"/users/{owner}/packages/container/{pkg}/versions/{vid}"], check=False)
          # corpus: keep :latest + the 7 newest YYYY-MM-DD; drop the rest (incl untagged).
          cv = load("corpus.json")
          DATE = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          keep = set(sorted({t for v in cv for t in tags_of(v) if DATE.match(t)}, reverse=True)[:7])
          print("corpus keep dates:", sorted(keep, reverse=True))
          for v in cv:
              t = tags_of(v)
              if "latest" in t or any(x in keep for x in t):
                  continue
              delete("3gpp-corpus", v["id"], f"tags={t or 'untagged'}")
          # data (split-data-image): same policy as corpus — keep :latest + the 7
          # newest YYYY-MM-DD dated tags; drop the rest (incl. untagged). Each
          # version is ~15 GB compressed, so retention matters double here.
          dv = load("data.json")
          dkeep = set(sorted({t for v in dv for t in tags_of(v) if DATE.match(t)}, reverse=True)[:7])
          print("data keep dates:", sorted(dkeep, reverse=True))
          for v in dv:
              t = tags_of(v)
              if "latest" in t or any(x in dkeep for x in t):
                  continue
              delete("3gpp-data", v["id"], f"tags={t or 'untagged'}")
          # shard: keep rolling tags (no run-id suffix = resume baseline); drop untagged
          # + run-id-only tags older than 7 days.
          sv = load("shard.json")
          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          RUNID = re.compile(r'-\d{6,}$')
          for v in sv:
              t = tags_of(v)
              if any(not RUNID.search(x) for x in t):
                  continue  # has a rolling tag → resume baseline, keep
              try:
                  ts = datetime.fromisoformat(v.get("created_at", "").replace("Z", "+00:00"))
              except Exception:
                  ts = cutoff
              if ts < cutoff:
                  delete("3gpp-shard", v["id"], f"tags={t or 'untagged'} created={v.get('created_at')}")
          PY
