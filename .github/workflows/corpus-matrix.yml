# Corpus Matrix — DYNAMIC, delta-sized 3GPP corpus consolidation.
#
# Not frozen in time: the matrix is sized to what actually changed on 3gpp.org.
#   discover     → fetch the 3GPP status report, diff vs corpus-index.json (the
#                  indexed state in `latest`), emit ONLY the changed series
#                  (0, a few, or all) — or all series on a full build.
#   build-shard  → one runner per series (parallel): download → convert → ingest
#                  → partial DB. A shard is one COMPLETE series.
#   merge        → delta: pull the existing DB from `latest` as --base, each
#                  shard's series REPLACES the base's; full: fuse shards fresh.
#                  Re-emits corpus-index.json and (opt-in) publishes to `latest`.
#
# Series sharding is disjoint (archive is series-structured); release is captured
# by the floor (default Rel-99 = all real 3GPP releases (Rel-99..latest); not frozen) + future releases appear in
# the listing automatically, so nothing is hard-frozen.

name: Corpus Matrix

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full rebuild: index ALL series (ignore the index / no base)."
        type: boolean
        default: false
      series_scope:
        description: "Explicit space-separated series (overrides auto-detect). Empty = delta from the index."
        type: string
        default: ""
      release_floor:
        description: "Lowest release to ingest (default Rel-99 = all real 3GPP releases (Rel-99..latest); not frozen)."
        type: string
        default: "Rel-99"
      publish_to_latest:
        description: "Publish the consolidated DB + index to the rolling 'latest' release."
        type: boolean
        default: false
      embed:
        description: "SEMANTIC: build per-series vectorized sub-bases (BGE-M3, -tags onnx, each with its own HNSW = Option B). Slow; off by default. NEEDS A CI DRY-RUN to validate the ONNX path."
        type: boolean
        default: false
      embed_floor:
        description: "Embed only clauses at/above this release (vectors are recent-only; lexical stays full)."
        type: string
        default: "Rel-15"
      shard_timeout_minutes:
        description: "Per-shard timeout (max 360 on free hosted runners; lower to force the auto-rerun chain quickly during testing — e.g. 10 to validate resume in ~30min)."
        type: string
        default: "360"

permissions:
  contents: read # discover/build-shard read-only; merge elevates per-job

env:
  CGO_ENABLED: "1"
  # Pinned ONNX Runtime version — MUST match DefaultORTVersion in
  # internal/bootstrap/models.go (and scripts/fetch-model.sh). Embedded in the
  # cached model bundle filename so a bump auto-invalidates a stale bundle.
  ORT_VERSION: "1.26.0"
  # Pinned HuggingFace commit SHAs — MUST match the bgeCommit / rerankCommit
  # constants in internal/bootstrap/models.go and the URLs in
  # scripts/fetch-model.sh. The first 8 hex chars are embedded in the per-
  # component asset filenames, so bumping a SHA auto-invalidates the cached
  # asset on the 'models' release. preflight (job below) verifies all three
  # places stay in lockstep.
  BGE_COMMIT: "5617a9f61b028005a4858fdac845db406aefb181"
  RERANK_COMMIT: "87449985a27bbd817f13ee2338df130bdb532bad"

jobs:
  # ---- 0. preflight: ORT_VERSION must be IDENTICAL across YAML / Go / shell.
  # The manual 3-way coupling is exactly the failure mode #41 tries to prevent
  # at the bundle-cache layer — so we fail-closed at the source. Cheap (<5 s).
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Pin sync — ORT_VERSION + HF commit SHAs (YAML env vs Go vs shell)
        run: |
          set -eu
          # check_pin <name> <yaml-value> <go-regex> <shell-regex>
          #   Extracts the same value from internal/bootstrap/models.go and
          #   scripts/fetch-model.sh, compares the trio. Fails CLOSED so a
          #   silent drift never reaches the model-bundle build (a drifted
          #   commit SHA would otherwise reuse a stale cached asset under the
          #   same fixed name and never re-fetch — exactly the bug PR #45
          #   addresses at the cache-key level).
          check_pin() {
            local name="$1" wf="$2" go_re="$3" sh_re="$4"
            local go_ sh_
            go_=$(grep -oE "$go_re" internal/bootstrap/models.go | head -1 | grep -oE '"[^"]+"' | tr -d '"')
            sh_=$(grep -oE "$sh_re" scripts/fetch-model.sh | head -1 | grep -oE '[A-Za-z0-9._-]{8,}' | tail -1)
            if [ -z "$wf" ] || [ -z "$go_" ] || [ -z "$sh_" ]; then
              echo "::error::could not extract $name (workflow=$wf go=$go_ shell=$sh_)"; return 1
            fi
            if [ "$wf" != "$go_" ] || [ "$wf" != "$sh_" ]; then
              echo "::error::$name desync — workflow=$wf, models.go=$go_, fetch-model.sh=$sh_"
              echo "::error::bump all three TOGETHER (see comment near env: $name)"
              return 1
            fi
            echo "OK: $name=$wf (uniform across YAML/Go/shell)"
          }
          # ORT_VERSION: numeric default in fetch-model.sh, const in Go.
          ort_sh=$(grep -oE 'ORT_VERSION:-[0-9][^}]+' scripts/fetch-model.sh | head -1 | sed 's/^ORT_VERSION:-//')
          if [ "$ORT_VERSION" != "$(grep -oE 'DefaultORTVersion = "[^"]+"' internal/bootstrap/models.go | head -1 | grep -oE '"[^"]+"' | tr -d '"')" ] \
             || [ "$ORT_VERSION" != "$ort_sh" ]; then
            echo "::error::ORT_VERSION desync"; exit 1
          fi
          echo "OK: ORT_VERSION=$ORT_VERSION"
          # HF commits: 40-hex sha pinned in 3 places (Go const, shell URL, YAML env).
          check_pin "BGE_COMMIT"    "$BGE_COMMIT"    'bgeCommit\s*=\s*"[0-9a-f]+"'    'BAAI/bge-m3/resolve/[0-9a-f]+'
          check_pin "RERANK_COMMIT" "$RERANK_COMMIT" 'rerankCommit\s*=\s*"[0-9a-f]+"' 'celinehoang/bge-reranker-v2-m3-onnx/resolve/[0-9a-f]+'
      # Workflow-dispatch input validation (Qodo PR #49). Fails CLOSED before
      # any expensive job spends a runner-minute on a bad input.
      - name: Validate workflow inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_TIMEOUT: ${{ github.event.inputs.shard_timeout_minutes }}
          IN_EMBED_FLOOR: ${{ github.event.inputs.embed_floor }}
          IN_RELEASE_FLOOR: ${{ github.event.inputs.release_floor }}
        run: |
          set -eu
          # shard_timeout_minutes: positive integer, 1..360. Any value > 360
          # is a no-op (platform hard-caps anyway), so reject loud rather than
          # let the user think 720 means 12h. fromJSON() downstream would also
          # fail on non-numeric, but here we fail with a CLEAR message early.
          if ! printf '%s' "${IN_TIMEOUT:-360}" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::shard_timeout_minutes must be a positive integer (got: '${IN_TIMEOUT}')"; exit 1
          fi
          if [ "${IN_TIMEOUT:-360}" -gt 360 ]; then
            echo "::error::shard_timeout_minutes=${IN_TIMEOUT} exceeds the GitHub free-runner hard cap of 360 — the platform will kill the job at 360 regardless. Lower it or accept default 360."; exit 1
          fi
          # release_floor + embed_floor: must look like Rel-<number> so the
          # cache key + downstream filters can rely on the shape.
          for var in IN_EMBED_FLOOR IN_RELEASE_FLOOR; do
            val=$(eval echo \$$var)
            if [ -n "$val" ] && ! printf '%s' "$val" | grep -qE '^Rel-(99|[0-9]{1,2})$'; then
              echo "::error::$var must match ^Rel-(99|[0-9]{1,2})\$ (got: '$val')"; exit 1
            fi
          done
          echo "OK: shard_timeout=${IN_TIMEOUT:-360}m, embed_floor=${IN_EMBED_FLOOR}, release_floor=${IN_RELEASE_FLOOR}"

  # ---- 1. dynamic, delta-sized discovery → matrix --------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      floor: ${{ steps.set.outputs.floor }}
      full: ${{ steps.set.outputs.full }}
      publish: ${{ steps.set.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - id: set
        run: |
          scope="${{ github.event.inputs.series_scope }}"
          floor="${{ github.event.inputs.release_floor }}"
          full="${{ github.event.inputs.full }}"
          # PR validation: tiny fixed scope.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope="21 24"; floor="Rel-19"; full="false"
          fi
          if [ -n "$scope" ]; then
            matrix=$(printf '%s\n' $scope | jq -R . | jq -cs .)   # explicit series
          else
            # Auto: diff the live 3GPP status report vs the indexed state. Pull
            # BOTH the spec index (changed norms) and the subject index (changed
            # subjects) from `latest`; a changed subject forces its series into
            # the delta even when no norm moved (plan TROU #1).
            gh release download latest --repo "$GITHUB_REPOSITORY" -p corpus-index.json -D . 2>/dev/null || true
            gh release download latest --repo "$GITHUB_REPOSITORY" -p subject-index.json -D . 2>/dev/null || true
            if [ "$full" = "true" ]; then
              matrix=$(CGO_ENABLED=0 go run ./cmd/discover --all --floor "$floor")
            else
              matrix=$(CGO_ENABLED=0 go run ./cmd/discover --index corpus-index.json --subject-index subject-index.json --floor "$floor")
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"   >> "$GITHUB_OUTPUT"
          echo "full=$full"     >> "$GITHUB_OUTPUT"

          # PUBLISH GUARD (single source of truth): only a WHOLE-corpus run may
          # ever clobber the rolling `latest` release. A scoped run — an explicit
          # series_scope (the operator's small test like "21 33"), or a PR's tiny
          # fixed scope — produces ARTIFACTS ONLY, even if publish_to_latest=true
          # was passed. This is the guard that stops a "small test scenario" from
          # shrinking latest (e.g. the 3031→149 clobber that motivated it): latest
          # is written exclusively by the job that builds the entire corpus.
          publish=false
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.event.inputs.publish_to_latest }}" = "true" ] \
             && [ -z "$scope" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix  floor=$floor  full=$full  publish=$publish (scope='$scope')"
          if [ "${{ github.event.inputs.publish_to_latest }}" = "true" ] && [ "$publish" != "true" ]; then
            echo "::notice::publish_to_latest=true was IGNORED — this is a scoped/PR run (scope='$scope'); latest is only written by a whole-corpus run. Outputs go to artifacts."
          fi

  # ---- 1b. model bundle (embed only): fetch BGE-M3 + ORT from HuggingFace ONCE
  # and publish to a 'models' release, so the N shards restore it intra-GitHub
  # instead of each hammering HF (~70 GB → 2.3 GB). Always SUCCEEDS (no-op when
  # embed=false) so build-shard can `needs:` it without the skipped-dependency trap.
  model:
    needs: [preflight, discover]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lexical run — no model needed
        if: github.event.inputs.embed != 'true'
        run: echo "embed=false → skipping the model bundle"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: github.event.inputs.embed == 'true'
        with:
          persist-credentials: false
      - name: Build + publish the model bundle (idempotent, version-keyed, per-component)
        if: github.event.inputs.embed == 'true'
        env:
          # Bundle the cross-encoder reranker alongside the embedder so the
          # build-shard ingest can fully populate the rerank path. Toggle off
          # only if disk-pressure on the runner becomes a real problem.
          WITH_RERANKER: "1"
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zstd
          # GitHub Release assets are CAPPED at 2 GiB (HTTP 422 "size must be less
          # than 2147483648"). A single tarball of BGE-M3 + reranker + ORT is
          # 3.16 GiB compressed (6.4 GiB raw). The fix is to split along the
          # natural component boundaries — each .tar.zst stays well under the cap
          # and the consumer can skip pieces (e.g. when WITH_RERANKER toggles off
          # in the future, the build-shard restore just doesn't pull rerank.tar.zst).
          #
          # Component-keyed names embed BOTH ORT_VERSION (binding API) AND the
          # commit-SHA-pinned model version (deterministic upstream content), so a
          # bump on either side auto-invalidates the cache — no manual cleanup.
          # Cache key encodes the upstream commit SHA (8-hex prefix) so a bump
          # of bgeCommit / rerankCommit (verified in preflight to match Go +
          # shell) auto-invalidates the cached asset — no risk of restoring
          # stale model contents under the same filename (Qodo Bug #45).
          ORT_ASSET="ort-${ORT_VERSION}.tar.zst"
          BGE_ASSET="bge-m3-${BGE_COMMIT:0:8}.tar.zst"
          RERANK_ASSET="bge-reranker-v2-m3-${RERANK_COMMIT:0:8}.tar.zst"
          ASSETS_NEEDED=("$ORT_ASSET" "$BGE_ASSET")
          [ "${WITH_RERANKER:-0}" = "1" ] && ASSETS_NEEDED+=("$RERANK_ASSET")
          # Export the asset names BEFORE any exit path so build-shard's restore
          # step has a stable contract regardless of cache hit vs miss.
          {
            echo "ORT_ASSET=$ORT_ASSET"
            echo "BGE_ASSET=$BGE_ASSET"
            echo "RERANK_ASSET=$RERANK_ASSET"
            echo "WITH_RERANKER=${WITH_RERANKER:-0}"
          } >> "$GITHUB_OUTPUT"
          # Cache-hit: AT LEAST .part00 + .sha256 for every required asset.
          # (A real multi-part asset has .part00..N; we don't know N here, but
          # if any part is missing the consumer's cat-reassemble step fails the
          # sha256 check and falls back to direct HF fetch — graceful degrade.)
          PRESENT=$(gh release view models --repo "$GITHUB_REPOSITORY" --json assets \
                     --jq '.assets[].name' 2>/dev/null || true)
          all_present=1
          for a in "${ASSETS_NEEDED[@]}"; do
            if ! printf '%s\n' "$PRESENT" | grep -Fqx "$a.part00" \
                || ! printf '%s\n' "$PRESENT" | grep -Fqx "$a.sha256"; then
              all_present=0
              break
            fi
          done
          if [ "$all_present" = 1 ]; then
            echo "all model components (part00 + sha256) already on the 'models' release — skipping HF fetch"
            exit 0
          fi
          ./scripts/fetch-model.sh  # honours WITH_RERANKER above
          # One .tar.zst per component. -19 high compression + -T0 multi-threaded.
          tar -C data/models -cf - onnxruntime        | zstd -19 -T0 -o "$ORT_ASSET"
          tar -C data/models -cf - bge-m3             | zstd -19 -T0 -o "$BGE_ASSET"
          [ "${WITH_RERANKER:-0}" = "1" ] && \
            tar -C data/models -cf - bge-reranker-v2-m3 | zstd -19 -T0 -o "$RERANK_ASSET"
          # Even per-component a single archive can blow past the 2 GiB Release
          # cap — the reranker ONNX compresses to ~2.1 GiB (49.5% ratio on ~4.25
          # GiB raw weights). pack_and_split() always produces N >= 1 numbered
          # parts (.part00, .part01, …) so the consumer's restore loop is
          # uniform regardless of original size. Sha256 covers the WHOLE
          # pre-split archive (verified after cat-reassemble on the consumer).
          SPLIT_BYTES=1932735283   # 1.8 GiB — leaves headroom under the 2 GiB cap for HTTP overhead
          pack_and_split() {
            local a="$1"
            [ -e "$a" ] || return 0
            sha256sum "$a" > "$a.sha256"
            local sz
            sz=$(stat -c %s "$a")
            if [ "$sz" -lt "$SPLIT_BYTES" ]; then
              mv "$a" "$a.part00"
            else
              split -d -b "$SPLIT_BYTES" "$a" "$a.part"
              rm "$a"
            fi
            printf '  %-44s %s bytes → %s parts\n' "$a" "$sz" "$(ls "$a".part* | wc -l)"
          }
          for a in "$ORT_ASSET" "$BGE_ASSET" "$RERANK_ASSET"; do
            pack_and_split "$a"
          done
          # Assemble upload list: every .part* + every .sha256 we just produced.
          UPLOAD=()
          for a in "$ORT_ASSET" "$BGE_ASSET" "$RERANK_ASSET"; do
            [ -e "$a.sha256" ] || continue
            UPLOAD+=("$a.sha256")
            # Glob expands lexically (.part00, .part01, …) — guaranteed order
            # for cat-based reassembly on the consumer.
            for p in "$a".part*; do
              UPLOAD+=("$p")
            done
          done
          # Final sanity check: NO single part may still be >= 2 GiB (a future
          # change to SPLIT_BYTES that breaks the invariant should fail loud
          # here rather than in `gh release upload`).
          for p in "${UPLOAD[@]}"; do
            sz=$(stat -c %s "$p")
            if [ "$sz" -ge 2147483648 ]; then
              echo "::error::$p is $sz bytes — split logic is broken"
              exit 1
            fi
          done
          gh release view models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models --repo "$GITHUB_REPOSITORY" --title models \
              --notes "Per-component model bundle: ORT (binding-version keyed) + BGE-M3 + (optional) bge-reranker-v2-m3. Each component < 2 GiB GitHub Release cap. Commit-SHA pinned upstream."
          gh release upload models --repo "$GITHUB_REPOSITORY" "${UPLOAD[@]}" --clobber
        id: bundle
    outputs:
      ort_asset: ${{ steps.bundle.outputs.ORT_ASSET }}
      bge_asset: ${{ steps.bundle.outputs.BGE_ASSET }}
      rerank_asset: ${{ steps.bundle.outputs.RERANK_ASSET }}
      with_reranker: ${{ steps.bundle.outputs.WITH_RERANKER }}

  # ---- 2. one shard per changed series (parallel) --------------------------
  build-shard:
    needs: [discover, model]
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Per-shard timeout, driven by the workflow input shard_timeout_minutes
    # (default 360, max enforceable on free hosted runners — the platform itself
    # kills the job at exactly that, which is why ANY value > 360 is a no-op).
    # Lowering this is the easiest way to TEST the auto-rerun + --resume chain
    # quickly: set 10 → cap fires within minutes → autorerun engages → full
    # cycle observable in ~30-45 min instead of ~30h.
    # fromJSON() converts the string input to the int the API expects.
    timeout-minutes: ${{ fromJSON(github.event.inputs.shard_timeout_minutes || '360') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps (LibreOffice + build)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config libreoffice-writer-nogui
      - name: Build ingest (+ decoupled embed binary when embedding)
        run: |
          # Ingest ALWAYS builds lexical (no -tags onnx): embedding is now a
          # separate step (cmd/embed), so ingest just produces the clause text +
          # FTS. When embed=true we ALSO build the onnx-tagged cmd/embed, which
          # vectorises the shard in place, re-embedding ONLY changed clauses.
          go build -trimpath -o bin/ingest ./cmd/ingest
          if [ "${{ github.event.inputs.embed }}" = "true" ]; then
            CGO_ENABLED=1 go build -trimpath -tags onnx -o bin/embed ./cmd/embed
          fi
      - name: Restore model components from the 'models' release (semantic only)
        if: github.event.inputs.embed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Component names come from the model job (single source of truth). The
          # fallbacks below MUST match the model job's naming rule exactly — they
          # only kick in on a `needs.model.outputs.*` glitch (extremely unlikely
          # given preflight gating); the real names always win.
          ORT_ASSET: ${{ needs.model.outputs.ort_asset }}
          BGE_ASSET: ${{ needs.model.outputs.bge_asset }}
          RERANK_ASSET: ${{ needs.model.outputs.rerank_asset }}
          # Whether the model job actually published the reranker — controls
          # whether the restore here pulls it (and whether HF fallback fetches it).
          WITH_RERANKER: ${{ needs.model.outputs.with_reranker || '1' }}
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p data/models
          ort="${ORT_ASSET:-ort-${ORT_VERSION}.tar.zst}"
          bge="${BGE_ASSET:-bge-m3.tar.zst}"
          rerank="${RERANK_ASSET:-bge-reranker-v2-m3.tar.zst}"
          assets=("$ort" "$bge")
          [ "${WITH_RERANKER:-0}" = "1" ] && assets+=("$rerank")
          echo "restoring components: ${assets[*]}"
          # restore_one <asset>: download every .partNN + .sha256 → cat them in
          # lexical order to reassemble the original archive → verify sha256
          # over the WHOLE archive → extract. Returns 0 on success, 1 on any
          # failure (caller falls back to direct HF fetch). The glob pattern
          # `${asset}.part*` matches every numbered part (split -d makes them
          # .part00, .part01, … in lexical = upload = cat order).
          restore_one() {
            local a="$1"
            # Wipe any leftover parts/archive from a previous failed call so a
            # partial-state retry doesn't cat orphan bytes.
            rm -f "$a" "$a".part* "$a.sha256"
            gh release download models --repo "$GITHUB_REPOSITORY" \
                  -p "$a.part*" -p "$a.sha256" -D . 2>/dev/null || return 1
            [ -f "$a.sha256" ] || return 1
            # Bash globs expand in lexical (= sorted) order by default → cat
            # gets parts in the exact same order they were split (part00,
            # part01, …, partNN). The array indirection keeps each part as a
            # SEPARATE arg even if a filename ever held whitespace — `cat $glob`
            # would word-split on $IFS and break the reassembly.
            local parts=( "$a".part* )
            [ -e "${parts[0]}" ] || return 1
            cat "${parts[@]}" > "$a" || return 1
            sha256sum -c "$a.sha256" || return 1
            zstd -d "$a" -c | tar -C data/models -xf - || return 1
            # Free disk: the parts + reassembled archive aren't needed past extract.
            rm -f "$a" "$a".part*
          }
          restore_ok=1
          for a in "${assets[@]}"; do
            if ! restore_one "$a"; then
              echo "::warning::failed to restore component $a"
              restore_ok=0
            fi
          done
          if [ "$restore_ok" -eq 0 ]; then
            echo "::notice::partial/missing component restore → falling back to direct HF fetch (WITH_RERANKER=$WITH_RERANKER)"
            # Clean any partial extractions so fetch-model.sh starts fresh.
            rm -rf data/models/onnxruntime data/models/bge-m3 data/models/bge-reranker-v2-m3
            ./scripts/fetch-model.sh
          fi
      - name: Download + convert series ${{ matrix.series }}
        env:
          # default-ON disk cleanup when embedding (the vectorized shard + model
          # crowd the 14 GB runner); harmless for the lexical path.
          CORPUS_DROP_ZIPS: ${{ github.event.inputs.embed == 'true' && '1' || '' }}
        run: ./scripts/corpus.sh --set "${{ needs.discover.outputs.floor }}" --series "${{ matrix.series }}" --jobs 2
      # ── CROSS-RUN cache (axis #16) ──────────────────────────────────────
      # Persists partial + completed shard DBs across DIFFERENT workflow runs
      # so a fresh dispatch on unchanged code finds yesterday's 13-success
      # shards in the cache → restore + --resume sees all 'done' → ingest
      # exits in ~seconds instead of redoing 3-260 min of work per shard.
      #
      # Key invariants:
      #   - pipeline_version (model.PipelineVersion in Go) MUST be in the key,
      #     so a chunker/embedder bump auto-invalidates the cache (rebuild
      #     from scratch on the algorithm shift — invariant #2).
      #   - hashFiles() of the SOURCE files that decide what a shard contains
      #     guarantees a code change to ingest/parse/store rebuilds; comment-
      #     only changes don't bust the cache.
      #   - restore-keys cascade lets a partial code change still pick up a
      #     compatible-enough prior shard (--resume's purge then handles the
      #     drift safely).
      #
      # GH Actions cache: 10 GiB total per repo, 7-day inactivity TTL. The
      # per-series shards are ~50-200 MiB each, so 28 series ~= 5 GiB — fits.
      # Cross-run shard cache — now active for LEXICAL runs too (plan TROU #2),
      # not just embed=true. A lexical delta on a big series (e.g. 24) otherwise
      # re-converts + re-ingests from scratch on every dispatch and every
      # auto-rerun attempt; with the cache + --resume it picks up yesterday's
      # 'done' specs and finishes in seconds. The embed_floor stays in the key so
      # lexical and vectorised shards never cross-restore (different artifacts).
      # Subject sources are in the hash so a subject bump (li-v1→li-v2) busts the
      # owning series' cached shard — otherwise a restore + --resume would see
      # every spec 'done' and the subject change would never be re-extracted.
      - name: Cross-run shard cache (resume baseline from prior runs)
        id: shard_cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: |
            dist/shard-${{ matrix.series }}.duckdb
            dist/shard-${{ matrix.series }}.report.json
          # mode (embed true/false) is part of the namespace so a lexical shard
          # (no vectors) is NEVER restored into an embed run — otherwise --resume
          # would see every spec 'done' and skip embedding, producing a
          # vector-less shard that fails the embedded_clauses gate. v2 bump
          # invalidates the old (mode-less, subject-less) cache namespace.
          key: shard-v2-${{ matrix.series }}-emb${{ github.event.inputs.embed }}-flr${{ github.event.inputs.embed_floor }}-${{ hashFiles('internal/ingest/**/*.go', 'internal/embed/**/*.go', 'internal/htmlparse/**/*.go', 'internal/ooxml/**/*.go', 'internal/model/**/*.go', 'internal/store/schema.sql', 'internal/store/hnsw.go', 'cmd/ingest/main.go', 'cmd/embed/main.go', 'internal/subject/**/*.go', 'internal/subjectmeta/**/*.go', 'internal/registry/**/*.go') }}
          restore-keys: |
            shard-v2-${{ matrix.series }}-emb${{ github.event.inputs.embed }}-flr${{ github.event.inputs.embed_floor }}-
            shard-v2-${{ matrix.series }}-emb${{ github.event.inputs.embed }}-
      # Intra-run fallback: a partial DB uploaded by an EARLIER attempt of the
      # SAME run (e.g. the auto-rerun cycle after a 6h-cap kill) takes priority
      # over the cross-run cache hit (it's strictly more recent). Best-effort:
      # no artifact in the current run yet → no-op, the cache value (if any)
      # stays on disk.
      - name: Restore prior shard artifact (resume from previous attempt)
        id: restore_shard
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shard-${{ matrix.series }}
          path: dist
      - name: Note resume state
        run: |
          mkdir -p dist
          if [ -f "dist/shard-${{ matrix.series }}.duckdb" ]; then
            sz=$(stat -c %s "dist/shard-${{ matrix.series }}.duckdb")
            echo "resume: prior shard restored (${sz} bytes) — --resume will skip its 'done' specs"
            # Cache-hit telemetry: helps spot a cold cache vs a warm one in logs.
            echo "  cache hit:          ${{ steps.shard_cache.outputs.cache-hit }}"
            echo "  cache matched key:  ${{ steps.shard_cache.outputs.cache-matched-key }}"
          else
            echo "resume: no prior shard — fresh ingest"
          fi
      # The ingest itself runs in a retry loop: a runner OOM, network blip, or
      # user-side cancel of a single attempt leaves the artifact upload step
      # (always: success or failure) keeping the partial DB available for the
      # next attempt. --resume makes the next attempt skip 'done' specs +
      # purge half-ingested ones (PR #47, see internal/ingest/ingest.go).
      - name: Ingest shard ${{ matrix.series }} (lexical, --resume + retry)
        id: ingest
        run: |
          # Ingest is now ALWAYS lexical (clause text + FTS); embedding is the
          # separate step below. --resume skips 'done' specs from a restored
          # partial shard; the retry loop covers transient mid-ingest failures.
          set -o pipefail
          mkdir -p dist
          OUT="dist/shard-${{ matrix.series }}.duckdb"
          attempt=0
          max_attempts=3
          ingest_ok=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "::group::ingest attempt $attempt/$max_attempts (series ${{ matrix.series }})"
            if ./bin/ingest --series "${{ matrix.series }}" --out "$OUT" --resume; then
              ingest_ok=1
            fi
            echo "::endgroup::"
            if [ "$ingest_ok" -eq 1 ]; then
              echo "ingest attempt $attempt succeeded"
              break
            fi
            echo "::warning::ingest attempt $attempt failed — sleeping 30s before retry"
            sleep 30
          done
          if [ "$ingest_ok" -eq 0 ]; then
            echo "::error::ingest exhausted $max_attempts attempts; the always-upload step preserves the partial DB so a manual re-run can --resume"
            exit 1
          fi
      # ── DECOUPLED EMBED (embed=true only) ───────────────────────────────────
      # Runs cmd/embed ON the just-built lexical shard: re-embeds ONLY the clauses
      # whose text or model changed (per-clause embedding_hash), so a resumed /
      # cached shard re-embeds the delta, not the whole series. The embedding_hash
      # persists in the shard artifact + cross-run cache, so a re-run over an
      # unchanged series embeds ~0 clauses. Retry loop: a 6h-cap kill mid-embed
      # leaves the partial vectors + hashes in the uploaded shard; the rerun's
      # restore + this step re-embed only what's still missing.
      - name: Embed shard ${{ matrix.series }} (decoupled, micro-granular, --resume)
        if: github.event.inputs.embed == 'true'
        env:
          EMBEDDER: bge-m3
          BGE_M3_DIR: ${{ github.workspace }}/data/models/bge-m3
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/data/models/onnxruntime/lib/libonnxruntime.so
          EMBED_WINDOWING: mean_pool
          RERANKER_DIR: ${{ github.workspace }}/data/models/bge-reranker-v2-m3
        run: |
          set -o pipefail
          OUT="dist/shard-${{ matrix.series }}.duckdb"
          RPT="dist/shard-${{ matrix.series }}.report.json"
          attempt=0
          max_attempts=3
          embed_ok=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt+1))
            echo "::group::embed attempt $attempt/$max_attempts (series ${{ matrix.series }})"
            # --require-semantic refuses to no-op if the embedder isn't enabled.
            # The gate checks the model + that NO at/above-floor clause is left
            # without a vector (null_embeddings==0 means the shard is fully
            # vectorised; a 6h-cap partial leaves >0 and fails → rerun resumes).
            if ./bin/embed --db "$OUT" --embed-floor "${{ github.event.inputs.embed_floor }}" \
                 --require-semantic --report json | tee "$RPT" \
               && jq -e '.model=="bge-m3" and .null_embeddings==0' "$RPT"; then
              embed_ok=1
            fi
            echo "::endgroup::"
            if [ "$embed_ok" -eq 1 ]; then echo "embed attempt $attempt succeeded"; break; fi
            echo "::warning::embed attempt $attempt incomplete — sleeping 30s before retry (resumes via embedding_hash)"
            sleep 30
          done
          if [ "$embed_ok" -eq 0 ]; then
            echo "::error::embed exhausted $max_attempts attempts; partial vectors+hashes preserved in the shard for a --resume rerun"
            exit 1
          fi
      - name: Free HTML before artifact upload
        run: rm -rf data/sources/convert || true
      # Upload artifact ALWAYS (success or failure) so the next attempt of
      # this same job can --resume from the partial DB on disk. retention-days
      # is short (1d) — these are temp shards, not the published corpus.
      - name: Upload shard artifact (always — feeds --resume on retry)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shard-${{ matrix.series }}
          path: |
            dist/shard-${{ matrix.series }}.duckdb
            dist/shard-${{ matrix.series }}.report.json
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true   # each attempt of this matrix slice replaces the prior partial

  # ---- 3. fuse the partial DBs (delta = replace changed series in base) -----
  # Runs in BOTH modes:
  #   embed=false → merge produces the lexical DB as before (full vectors absent).
  #   embed=true  → merge ALSO runs, with `--strip-embeddings` so the lexical
  #                 'latest' Release asset stays under the 2 GB GitHub cap. The
  #                 per-series vectorized sub-bases (with their HNSW) are
  #                 distributed in PARALLEL by publish-vec on GHCR. The two
  #                 channels are independent: lexical-only client pulls the
  #                 Release, semantic client pulls GHCR + sub-bases.
  #   ⇒ this fixes the long-standing 'latest stays stale during embed runs' gap
  #     and lets the OpenAPI ingest (wired here) ride along on every embed run.
  merge:
    needs: [discover, build-shard]
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only merge may clobber the DB asset on 'latest'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends build-essential pkg-config zstd python3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: shard-*
          merge-multiple: true
      - name: Merge → consolidated DB (+ index)
        run: |
          go build -trimpath -o bin/merge ./cmd/merge
          mkdir -p data
          base_arg=""
          # Delta run: start from the existing DB and let each shard's series replace it.
          if [ "${{ needs.discover.outputs.full }}" != "true" ]; then
            if gh release download latest --repo "$GITHUB_REPOSITORY" -p 3gpp.duckdb.zst -D . 2>/dev/null; then
              zstd -d 3gpp.duckdb.zst -o base.duckdb
              base_arg="--base base.duckdb"
              echo "incremental: using existing latest DB as base"
            fi
          fi
          # When embed=true the shards carry FLOAT[1024] embeddings + a per-shard
          # HNSW. Stripping them in the merged output keeps the lexical Release
          # asset slim (vectors live in the GHCR per-series sub-bases — see
          # publish-vec). The strip step also clears vector-specific schema_meta
          # so the slim DB doesn't claim semantic capability it can't deliver.
          strip_arg=""
          if [ "${{ github.event.inputs.embed }}" = "true" ]; then
            strip_arg="--strip-embeddings"
          fi
          ./bin/merge --out data/3gpp.duckdb --index-out data/corpus-index.json \
            --subject-index-out data/subject-index.json $base_arg $strip_arg shards/*.duckdb
          ls -lh data/3gpp.duckdb
      - name: Enrich — catalogue overlay + 5GC OpenAPI (additive, idempotent)
        run: |
          # Authoritative DynaReport metadata (WG, title, TS/TR, freeze_date → fixes
          # the non-monotonic version-ordering trap) + 5GC OpenAPI (populates
          # search_api). Both are idempotent (UPSERT / clear-api_*-then-reingest)
          # and degrade-don't-block: a forge/DynaReport outage must not fail the
          # corpus build — the DB stays valid with filename-derived metadata.
          go build -trimpath -o bin/ingest-catalog ./cmd/ingest-catalog
          ./bin/ingest-catalog --out data/3gpp.duckdb --cache data/catalog \
            || echo "[merge] catalog overlay degraded (kept filename-derived metadata)"
          go build -trimpath -o bin/ingest-openapi ./cmd/ingest-openapi
          ./scripts/fetch-5g-apis.sh REL-17 REL-18 REL-19 \
            || echo "[merge] 5g-apis fetch degraded"
          ./bin/ingest-openapi --out data/3gpp.duckdb \
            || echo "[merge] openapi ingest degraded"
      - name: Package (zstd + sha256 over the enriched DB)
        run: |
          zstd -19 -T0 --long=27 -f data/3gpp.duckdb -o data/3gpp.duckdb.zst
          sha256sum data/3gpp.duckdb | awk '{print $1"  3gpp.duckdb"}' > data/3gpp.duckdb.sha256
      # Always upload the merged DB + indexes as an artifact (even on a publish
      # run) — cheap, and gives an inspectable copy of every run including the
      # scoped tests that intentionally never touch `latest`.
      - name: Upload artifact (merged DB + indexes)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-duckdb-merged
          path: |
            data/3gpp.duckdb.zst
            data/3gpp.duckdb.sha256
            data/corpus-index.json
            data/subject-index.json
          retention-days: 7
      # Publish ONLY when discover authorised it = a whole-corpus, non-PR run with
      # publish_to_latest=true. A scoped/test run never reaches this step, so it
      # can't clobber latest no matter what inputs it was given.
      - name: Publish DB + index to 'latest' (clobber)
        if: needs.discover.outputs.publish == 'true'
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --latest --title "latest" \
              --notes "Rolling release — mcp-3gpp binaries + indexed 3GPP DB."
          gh release upload latest --repo "$GITHUB_REPOSITORY" \
            data/3gpp.duckdb.zst data/3gpp.duckdb.sha256 \
            data/corpus-index.json data/subject-index.json --clobber

  # ---- 4. SEMANTIC (embed=true): distribute the per-series vectorized sub-bases
  # to GHCR (Option B). The sub-bases are the build-shard artifacts; we zstd each,
  # emit vec-manifest.json, and ORAS-push them to a rolling 'latest' OCI tag (no
  # 2 GB Release-asset cap). Gated on embed; the actual push is gated on publish.
  # NEEDS A CI DRY-RUN to validate (ORAS auth + the sub-bases exist).
  publish-vec:
    needs: [discover, build-shard]
    if: needs.discover.outputs.matrix != '[]' && github.event.inputs.embed == 'true'
    # discover.outputs.publish gates the actual GHCR push (whole-corpus run only).
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORAS_VERSION: "1.2.0"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: shards
          pattern: shard-*
          merge-multiple: true
      - name: Install zstd + jq + ORAS (pinned)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zstd jq
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version
      - name: Package sub-bases + vec-manifest
        run: |
          mkdir -p vec
          subs="[]"
          for f in shards/shard-*.duckdb; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .duckdb)
            zstd -19 -T0 -f "$f" -o "vec/$b.duckdb.zst"
            subs=$(printf '%s' "$subs" | jq --arg n "$b.duckdb" '. + [$n]')
          done
          printf '%s' "$subs" | jq \
            --arg floor "${{ github.event.inputs.embed_floor }}" \
            '{embedding_model:"bge-m3", embed_floor:$floor, sub_bases:.}' > vec/vec-manifest.json
          cat vec/vec-manifest.json
          test "$(jq '.sub_bases|length' vec/vec-manifest.json)" -gt 0 || { echo "::error::no vectorized sub-bases to publish"; exit 1; }
      # Push to the rolling GHCR tag ONLY on an authorised whole-corpus run (same
      # guard as the Release publish — a scoped/test embed run never overwrites
      # the published vectorized channel).
      - name: Push sub-bases + manifest to GHCR (rolling 'latest')
        if: needs.discover.outputs.publish == 'true'
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd vec
          args="vec-manifest.json:application/json"
          for z in *.duckdb.zst; do args="$args $z:application/zstd"; done
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/3gpp-vec:latest" \
            --artifact-type application/vnd.kodflow.3gpp-vec.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            $args
      # Always keep an artifact copy (even on a publish run, for inspection).
      - name: Upload artifact (vectorized sub-bases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3gpp-vec
          path: vec/
          retention-days: 7
